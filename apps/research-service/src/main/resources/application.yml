server:
  port: ${RESEARCH_SERVICE_PORT:8082}
spring:
  config:
    # Run from the monorepo root (the supported command in this module's README), or set
    # GAME_CONFIG_PATH for a packaged/deployed service. This retains the current research and
    # LLM configuration without copying a large, independently drifting YAML file.
    import: "optional:file:${GAME_CONFIG_PATH:apps/game-service/src/main/resources/application.yml}"
  application:
    name: emergent-terrain-research-service
  datasource:
    url: ${PG_URL:jdbc:postgresql://localhost:5432/emergentterrain}
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:NewStrongPasswordHere}
    driver-class-name: org.postgresql.Driver
  jackson:
    default-property-inclusion: non_null
  sql:
    init:
      # Research owns only the tables declared in this module's schema.sql during the transition.
      mode: always
app:
  research-service:
    # Required by POST /api/v1/research/work. The game-owned outbox relay sends this value.
    work-api-key: ${RESEARCH_WORK_API_KEY:}
    work-interval-ms: ${RESEARCH_WORK_INTERVAL_MS:1000}
    result-delivery:
      base-url: ${RESEARCH_RESULT_GAME_API_BASE_URL:http://127.0.0.1:8081}
      api-key: ${RESEARCH_RESULT_API_KEY:}
      interval-ms: ${RESEARCH_RESULT_DELIVERY_INTERVAL_MS:1000}
    game-context:
      # database preserves the current standalone mode; remote uses the game-owned v1 context API.
      mode: ${RESEARCH_GAME_CONTEXT_MODE:database}
      base-url: ${RESEARCH_GAME_API_BASE_URL:http://127.0.0.1:8081}
      api-key: ${RESEARCH_CONTEXT_API_KEY:}
    lifecycle-shadow:
      # Read-only migration parity audit; enable before moving lifecycle transitions.
      enabled: ${RESEARCH_LIFECYCLE_SHADOW_ENABLED:false}
      # Records real parity evidence without calling the legacy university cycle.
      shadow-only: ${RESEARCH_LIFECYCLE_SHADOW_ONLY:false}
      projector:
        # Off until the age/reputation slice has completed a live parity audit.
        enabled: ${RESEARCH_LIFECYCLE_SHADOW_PROJECTOR_ENABLED:false}
    worker:
      enabled: ${RESEARCH_SERVICE_WORKER_ENABLED:true}
      interval-ms: ${RESEARCH_SERVICE_WORKER_INTERVAL_MS:1000}
