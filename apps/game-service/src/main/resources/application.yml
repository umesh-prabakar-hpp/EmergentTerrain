      incrementalReseedEnabled: true
      # 2026-06-14 — knob-filter exemption for investigation-verified growth anchors (room b72c4e10
      # review-c Rec 1). A growth-anchor bound (rhs ∈ WINDOW_GEOMETRY_SCALARS, e.g.
      # max_prime_gap ≤ k·log_sq_window_start) has slack that correlates with window_size BY
      # CONSTRUCTION, so the knob-restatement heuristic was silently retiring verified survivors —
      # the durable 0.649 Cramér bound was dropped_by_knob=window_size after a legitimate re-tighten,
      # erasing the whole growth-anchor program's output (Cramér/Wigert/ln ln x). ON: a verified
      # bound (professor confirmed it holds at the failure region) with a geometry-RHS is held aside
      # from the knob filter, like the composition exemption — still counterexample-checked. Gated on
      # investigation-verified so unverified spurious window-correlated seeds are still filtered.
      # Rollback: false.
      verifiedAnchorKnobExemptEnabled: true
      # 2026-06-14 — Phase 30 G1 openness prior (open-behavior-generation-activation.md). Drops SLOPED
      # affine bounds on settled-leading-order objects (mean_omega/mean_Omega ~ ln ln x,
      # mean_divisor_count ~ ln x, the densities) whose rhs is a flat feature — the trivial-refutation
      # class that dominated the corpus (the mean_omega monoculture, the density NULLs). Keeps
      # growth-anchor bounds (rhs a window-geometry scalar) and k≈0 constant bounds, so settled LHS
      # survive only as growth-anchor / non-affine-frame topics. Shifts the topic mix toward
      # open-behavior / second-order targets. Acceptance: next refresh's conjecture topics are
      # open/second-order, not settled-flat refutations. Rollback: false.
      opennessPriorEnabled: true
      # 2026-06-15 — Phase 30 G4 openness SELECTION prior (open-behavior-generation-activation.md).
      # G1 cleaned the conjecture pool to open/second-order objects, but the post-G1 bottleneck was
      # SELECTION: growing-LHS / open topics (max_prime_gap, dirichlet_error, omega_Omega_gap) surfaced
      # only by luck (0 picks two runs, then 3). ON: nextN promotes ScalarOpenness.PRIORITY_TARGETS to
      # the front of both tiers (rotation/clade order as within-bucket tiebreak), so the high-value
