      opennessSelectionEnabled: true
      # 2026-06-15 — Phase 30 G4 within-bucket diversity (open-behavior-generation-activation.md). The
      # bucket prior alone over-concentrated on the most-seeded priority family (max_prime_gap
      # monoculture, review-d) and couldn't reach LIVE-only targets (dirichlet_error has 0 retired
      # seeds; tier-1 retired is always served before tier-2 live). ON: nextN orders the merged
