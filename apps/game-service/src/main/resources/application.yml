      # dropped at load; IO is best-effort (failure degrades to in-memory). Rollback: blank.
      servedDescriptorRecencyStatePath: ${user.home}/.emergentterrain/served-descriptors.tsv
      # 2026-06-15 (review-2026-06-15e Rec 2) — exempt oscillating open targets (dirichlet_error =
      # Δ(x)/x^{1/4}) from the FIM slope_unpinned drop. Their affine slope is unpinned by nature (they
