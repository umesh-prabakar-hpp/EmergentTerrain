    # ── Phase 19 — sandbox-friction Layer 1 rewrites ──
    # When on (default), SandboxStaticChecker.normalizeForSandbox applies the
    # pre-parse rewrites that let the LLM emit JS-flavoured idioms the sandbox
    # subset would otherwise reject:
    #   - `Math.<builtin>(…)` → flat builtin (Layer 1a)
    #   - `<ident>.length` → `len(<ident>)` (Layer 1b)
    #   - `return {k: v, …}` → `recordSample(v); … return v_first;` (Layer 1c)
    #   - `return [v, …]`   → `recordSample(v); … return v_first;` (Layer 1c-array)
    # Flag-off is the rollback path: rewrites are skipped, code reaches the
    # existing reject paths (`preScanForJavascriptIdioms`) unchanged. The Layer
    # 1d-1f parser changes (single-statement bodies, break/continue as
    # keywords, comma-separated var decls) are NOT gated — they are pure
    # grammar additions with no rollback contract.
    # See phases-for-human-like-performance/phase-19-sandbox-friction.md
    # (Rollback section + Open Q2).
    sandbox:
      relaxed-grammar:
        enabled: true
      # Max elements per sandbox array (SandboxEngine.MAX_ARRAY_LEN). Each array
      # eagerly allocates this many doubles (8 bytes each) so push() grows without
      # a resize — i.e. the cap == per-array memory (16384 → ~128 KB/array).
      # 2026-05-25 — raised from the original 1024. With MAX_STMTS=50k /
      # MAX_ITERATIONS=5k bounding how many arrays a run can allocate, keep this
      # bounded; raise only if a real computation needs longer tabulated datasets
      # (worst-case run memory ≈ max-array-len × allocations × 8 bytes).
      max-array-len: 16384
