        - max_prime_gap
        - twin_vs_prime_sq
      # Phase 30 Wave 1 — dimensional-consistency gate (ConjectureDimensionFilter),
      # independent of trivialityFilter for separate A/B. Drops seeds of the form
      # density <= k*window_magnitude + c (k>0) — a [0,1] number-theoretic density
      # bounded by a harness window-magnitude function (log/sqrt_window_*), which
      # is eventually vacuous as the window grows. mertens_per_sqrt_W is NOT a
      # density, so the flagship bound is unaffected. OFF: no behavior change.
      # Rollback: false.
      dimensionFilterEnabled: true    # 2026-06-03: flipped ON (W1 conservative-gate tier). Rollback: false.
      # Phase 30 Wave 1 (finish) — unit/dimensional-consistency gate (ConjectureUnitConsistencyFilter).
      # Generalises dimensionFilter from the 4 densities to ALL O(1)-bounded number-theoretic scalars
      # (densities + abundant_minus_deficient + omega_Omega_gap + mertens_per_sqrt_W) bounded by a
      # harness window-magnitude with k>0 — a unit mismatch that's eventually vacuous. Default OFF. Rollback: false.
      unitConsistencyEnabled: true    # 2026-06-03: flipped ON (W1 conservative-gate tier). Rollback: false.
      # Phase 30 Wave 1 (finish) — Fisher-information identifiability gate (ConjectureIdentifiabilityFilter).
      # For a bound that claims a slope (k!=0), drops it when the OLS slope's relative standard error
      # over the window samples exceeds identifiabilityMaxRelStdErr (the data is consistent with k=0 —
      # the slope is a "constant the data doesn't pin"). Constant (k≈0) bounds are out of scope.
      # Default OFF; needs the same A/B (zero false-retirement of a control set) before flip. Rollback: false.
      identifiabilityEnabled: true    # 2026-06-03: flipped ON (W1 conservative-gate tier). Rollback: false.
      identifiabilityMaxRelStdErr: 1.0   # flag when SE(slope)/|slope| exceeds this (≥1 ⇒ indistinguishable from 0)
      # Phase 30 Wave 0 (IMPLEMENTATION-ORDER.md) — investigation rotation. The
      # refuted (Tier-1) queue is a stateless peek: next() re-serves the same
      # most-recently-refuted conjecture every cycle (with paperShare=1.0 that is
      # why every math paper investigates the identical mertens bound). When ON,
      # nextN serves least-recently-INVESTIGATED first (lastInvestigatedAt, marked
      # on consume), rotating through distinct conjectures. OFF: legacy ordering,
      # no behavior change. Flip for an A/B that should diversify conjecture papers
      # off the single mertens bound. Rollback: false.
      investigationRotationEnabled: true   # 2026-05-31: flipped false->true (Wave 0) — Tier-1 refuted queue serves least-recently-INVESTIGATED first, so papers rotate through distinct refuted conjectures instead of re-serving the same one. Takes effect on next app restart. Rollback: false.
      # 2026-06-10 — decision A (discovery→pool write-back, step 2). When ON, a row stamped
      # investigationVerifiedAt (a professor proved its bound HELD at the failure region; the write-back
      # revived it into the pool) is spared from EMPIRICAL retirement on sub-failure-region evidence:
      # a counterexample below x=1,000,000 no longer retires it (asymptotic bound — only ever claimed at
      # high x), and the stochasticNull / privateValidator / replication heuristics defer to the
      # verification. Structural gates (triviality/dimension/unit/identifiability/knob) still apply, and a
      # genuine counterexample AT x>=1,000,000 still retires it. Closes the loop where every write-back
      # revival was erased on the next mine pass (observed 2026-06-09: cramer_gap_ratio revived 23:20 →
      # _counterexample_ 23:24 from a sub-region window). Rollback: false.
      respectInvestigationVerified: true
      # Phase 30 Wave 3 — clade-value selection (CladeValueSelector). When ON, the LIVE (Tier-2)
      # investigation queue is ranked by clade-value (descendant productivity via derivedFrom, Laplace-
      # smoothed) × inverse-popularity (1/(1+cell population), cell = lhs scalar) instead of by fit
      # (confirmedRuns/p99Slack) — fit becomes an eligibility gate only. Diversifies the queue across
