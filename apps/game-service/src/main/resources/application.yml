      # domain_refs.jl and building corpus-nt/domain-refs (scripts/build-oeis.py + build-dlmf.py).
      domain-refs:
        enabled: true
    # Lever 2 — citation grounding. When on (and the literature corpus is wired),
    # the professor stage advertises the search_literature tool and is told to
    # cite ONLY references it returns (no invented author-year cites); the cited
    # refs land in the tool-call trace. Default off (dormant; needs a tool-capable
