      # practice — the per-candidate rejection histogram (Stage A, novelty-ceiling-and-vocab-activation.md)
      # now logs WHY. Default OFF. Rollback: false.
      vocabularyExpansionEnabled: true   # 2026-06-05: flipped ON for the 30.5 live A/B. Targets fall back to the anomaly stratum (counterexample-retired, confirmedRuns >= anomalyMinConfirmed) because the post-W4 live pool is empty — without the fallback the block is a silent no-op (targets empty, sublinear budget 0). A/B bar per vocabulary-expansion-mdl.md §8: hand-check every admitted scalar in the logs/derived_scalars (no spurious inflation; expect <= a handful per session, MDL-justified); battery-of-noise rejection covered by MdlGate unit tests; rollback: false (admitted rows persist in derived_scalars — TRUNCATE to fully revert).
      vocabularyExpansionDepth: 1   # operator-nesting depth of generated candidates (1 = single op)
      # Stage C (novelty-ceiling-and-vocab-activation.md) — type-aware MDL description code: an operator
      # node is priced by its own small alphabet (log2(2..4)) instead of the full scalar+op alphabet
      # (~log2(31)≈5 bits). Fixes the ~4-bit/op over-charge that kept genuinely-compressing depth-1
      # compositions in below_description_cost. Noise rejection (permutation null) unaffected; §8 noise
      # battery still guards admission. ON for the Stage-C A/B (run-3 histogram had 8 below-cost
      # candidates). Watch: derived_scalars admits must pass the hand-check; rollback: false.
      vocabTypeAwareDescriptionCost: true
      # Phase 30 Wave 6 — RAF-closure reporting (sim #1, RafReport over the derivation graph). When ON,
      # logs the irreducible core (iRAF) of the top confirmed findings as the publishable unit and the
      # count of findings grounded in no RAF (retirement candidates). Observability only (doesn't retire);
      # mostly trivial until composition / vocabulary-expansion chains produce non-food scalars. Default OFF.
      rafClosureEnabled: true   # 2026-06-05: flipped ON alongside mechanismProposal. Observability only (logs iRAF of top findings; retires nothing); becomes non-trivial as composition/vocab chains appear. Rollback: false.
      # Phase 30 Wave 4 — SHADOW mode for the W4 retirement gates (stochastic null + MCC, private
      # holdout, replication). When ON, any of those gates whose OWN flag is OFF still runs and LOGS
      # "W4 shadow — WOULD-RETIRE <conjecture> (reason ...)" without retiring (no persistRetired, store
      # unchanged). The safe A/B path: turn shadow ON in production, collect the would-retire log, hand-
      # check for false-retirement, then flip the gate's own flag once clean. A gate whose own flag is ON
      # retires for real (not shadow). Default OFF. Rollback: false.
      w4ShadowEnabled: false
      stochasticNullEnabled: true   # 2026-06-04: flipped ON after the null A/B. The 2026-06-03 shadow run (logs/archive/et-app-20260603-133911.log, 16 mine passes) produced a stable 7-line would-retire set — all flat-O(1) density cross-fits (deficient/happy_density vs mertens_per_sqrt_W/prime_density, omega_Omega_gap vs happy/abundant_density/mertens_delta, plus one rhs_near_constant_cv tautology) — hand-checked 2026-06-04: zero genuine relations among them, so zero false-retirement. Takes effect on next app restart. Rollback: false.
      stochasticNullPermutations: 999   # null-ensemble size per conjecture (add-one-smoothed p)
      stochasticNullAlpha: 0.05         # flag when permutation p > alpha (association not significant)
      stochasticNullMinCv: 0.01         # Fano/CV floor: flag when rhs coefficient-of-variation < this
      # Phase 30 Wave 4 component 2 — multiple-comparisons correction over the null p-values
      # (MultipleComparisonsCorrection). When ON (requires stochasticNullEnabled), a bound is kept
      # only if its no-effect H0 is rejected at the corrected FAMILY level over the surviving
      # (W1-reduced) denominator, controlling the false-discovery rate instead of judging each bound
      # at a raw p<=alpha. method: bh (Benjamini-Hochberg / FDR, default) | bonferroni (FWER). The
      # family alpha reuses stochasticNullAlpha. Default OFF; flip after the null A/B. Rollback: false.
      multipleComparisonsEnabled: true   # 2026-06-04: flipped ON with the null (its A/B is the null's — MCC family-corrects the null p-values; no separate shadow path by design, ConjectureMinerService gate runs only when this flag is ON). BH/FDR over the W1-reduced denominator. Rollback: false.
      multipleComparisonsMethod: bh
      # Phase 30 Wave 4 component 3 — private held-out validator + gaming-rate metric (anti-HARKing,
      # PrivateHoldoutValidator). When ON, each surviving bound is re-checked on PRIVATE windows whose
      # offsets are disclosed to neither the fitter (never seeded) nor the paper author (disjoint from
      # the verify_conjecture prompt's offsets); a bound that holds on the public runs but fails the
      # private holdout (worst margin > 2*TOL) "passed public, failed private" — overfit/gamed — and is
      # retired (droppedByKnob="private_validator:failed_holdout_windows_N_worst_M"). The gaming rate
      # (failed/tested) is logged per pass as the headline signal. Multi-window hardened: a bound is
      # retired only when >= PrivateHoldoutValidator.MIN_VIOLATING_WINDOWS (2) distinct private windows
      # each breach 2*TOL — a lone knife-edge overshoot (tolerance noise on a near-constant RHS) is spared.
      privateValidatorEnabled: true   # 2026-06-03: flipped ON with multi-window hardening. Shadow A/B flagged 2 happy_density bounds, but each breaches only ONE private window (omega@25000, prime_density@250000) — under the >=2-window rule both are spared, so this flip retires 0 on the current pool. A deep-N holdout (1.5M) was added to test prime_density's suspected N-divergence; measured, it still HOLDS there (margin≈-0.005) — the 250k breach is a happy_density plateau, not divergence — so the gate correctly keeps sparing it. Fires only on reproducible (>=2-window) non-generalization. Rollback: false.
      # Phase 30 Wave 4 component 4 — ensemble replication / K-fold CV stability + stochastic-pass
      # (ConjectureReplicationValidator). When ON, each surviving bound is K-fold cross-validated:
      # (k,c) is refit on K-1 folds and tested out-of-fold; the pass rate (folds held / K) is the
      # stochastic-pass score. A bound below replicationMinPassRate is replication-fragile (its fit
      # is an artifact of the exact window set, not a global bound) and retired
      # (droppedByKnob="replication:fragile_passRate_..."). Number-theory windows are deterministic,
      # so the "ensemble" is the folds, not RNG seeds. Default OFF; flip after the earlier A/Bs. Rollback: false.
      replicationValidatorEnabled: true   # 2026-06-03: flipped ON after W4 shadow A/B showed 0 would-retire on the live pool. Rollback: false.
      replicationFolds: 5               # CV folds (auto-reduced when there are too few windows)
      replicationMinPassRate: 0.8       # keep iff folds-held / folds >= this

    # Phase 30 fork 2b Path B — frontier-frame conjecture investigations whose quantity has a
    # beyond-sieve discovery oracle. When ON, a CONJECTURE_INVESTIGATION paper whose scalars map
    # to M(x) (mertens_delta) or D(x) (divisor_*) is posed as an ASYMPTOTIC question — does the
    # in-range bound persist past the sieve ceiling (x>2,000,000)? — and the seed text steers the
    # narrator to discover_mertens_value / recall_frontier_knowledge instead of only the in-range
    # verify_conjecture. omega/density bounds (no oracle) keep the in-range framing (extending
    # Path B to them needs a new oracle — Path A). Pair with the discovery flags below
    # (runtimeExecEnabled + the sidecar ET_DISCOVER_EXEC=1) so the tools the framing points at are
    # actually live. Rollback: false.
    conjectureInvestigation:
      frontierFramingEnabled: true   # 2026-06-02 (Path B): ON — Mertens/divisor conjecture papers pose the beyond-sieve question + use discover/recall. Takes effect on next app restart. Rollback: false.
      # Phase 30 Wave 6 — 30.7 P3: advertise the propose_mechanism professor tool (declare a runnable
      # mechanism DSL for the bound; gate-checked for closure + dimensional balance + declared
      # monotonicities + held-out bound regeneration via MechanismGate). Needs the conjecture verifier
      # wired (for windows). Default OFF. Rollback: false.
      mechanismProposalEnabled: true   # 2026-06-05: flipped ON. The gate is pure and self-protecting (DSL parse -> closure + dimensional balance + declared monotonicities + held-out bound regeneration via MechanismGate; bad mechanisms REJECTED with the failing gate named). With scalar_window_stats + frontier records in the loop, the 0.83-class papers have real material for a verified runnable mechanism. Rollback: false.
      # 2026-06-05 — advertise the scalar_window_stats professor tool: deterministic min/max/argmax/
      # mean of one window scalar (optionally Pearson+Spearman vs a second) over consecutive windows,
      # via the verifier's sampleWindows substrate. Built because the panel's follow-up computations
      # (HCN divisor growth, correlation over refuted windows — P-b72c-121's open questions) died on
      # the sandbox loop cap in three separate sessions. Same trust class as verify_conjecture (pure
      # arithmetic over the trusted sieve; zero LLM/sandbox spend). ON from day one. Rollback: false.
      scalarStatsToolEnabled: true
      # 2026-06-18 (REVIEW_REPORT b72c4e10 §1 rec 2/3) — inform-don't-suppress caveats on the
      # verify_conjecture result: (rec 2) a constant-framed LHS (omega_Omega_gap → 0.77316, twin_vs_prime_sq
      # → 2C₂, etc.) gets "use verify_constant — that converged value is the result, not this bound";
      # (rec 3) a HOLD whose lhs magnitude is at/below the 0.04 HOLD tolerance (twin_prime_density ~0.002–
      # 0.016) gets "tolerance-dominated — weak evidence". Pure result-text additions, no seed filtering and
      # no TOL change (respects no-reseed-skip + the parity-pinned TOL). false = bit-identical.
      verifyInformCaveatsEnabled: true

    # Phase 30 fork 2b Phase 3 — runtime self-verifying method discovery
    # (phase-30-conjecture/runtime-self-verifying-execution.md). The Java
    # generate->validate->repair loop (CandidateDiscoveryService) asks a model for a
    # numeric method, validates it via the sidecar /discover/validate moat, and
    # repairs on failure. THREE gates guard this RCE-adjacent path:
    #   1. runtimeExecEnabled (here)        — Java won't call the model or sidecar when OFF.
    #   2. ET_DISCOVER_EXEC=1 (sidecar env) — the endpoint returns 403 otherwise.
    #   3. the per-invariant MERTENS_CLASS gate in the Phase-4 tool that calls this.
    # OFF: discover() short-circuits to a disabled outcome; nothing is generated or
    # run. Rollback: false.
    discovery:
      runtimeExecEnabled: true   # 2026-05-31 (Phase 5): flipped false->true. Activates live runtime discovery on the NEXT app restart — discover_mertens_value then runs the generate->validate->repair loop (real LLM token spend). Still requires the sidecar's ET_DISCOVER_EXEC=1 (the /discover/validate moat) AND a mertens-class paper to actually fire. Rollback: false.
      maxRepairAttempts: 6        # 2026-05-31: 3->6 — more generate->validate->repair tries per scale before giving up on that x. Rollback: 3.
      # §10 mitigation — bail out of the repair loop after this many CONSECUTIVE resource
      # failures (timeout/oom) at one scale: repeated timeouts mean the SCALE is too big, not a
      # fixable bug, so grinding all maxRepairAttempts (6) just burns ~wall_s (80s) each. Bailing
      # early lets the escalation feed back a smaller x sooner — directly cuts the over-leap cost
      # (observed: an over-leap to 2e9 burned 6×~80s ≈ 8 min before walking down). A wrong-number
      # failure (repairable) resets the streak, so productive repair is never cut short. 0 = off
      # (grind all attempts). Rollback: 0.
      repairEarlyExitThreshold: 2
      httpTimeoutMs: 130000       # 2026-05-31: 35000->130000 — must exceed the sidecar wall budget (now up to 120s ceiling, 80s configured) so the sidecar's wall-kill is the authoritative timeout (proper 'timeout' status + segmented hint), not a Java-side 'transport' giveup. At 35s the bigger 60/80 budget produced spurious 'sidecar unreachable: request timed out'. Rollback: keep > frontierWallSeconds.
      # Phase 30 frontier-escalation Phase 1 (frontier-escalation-loop.md) — the
      # autonomous scale-curriculum: escalate a holding bound 10x/round, computing
      # the quantity from the sieve (<=NT_MAX_N) or validated discovery (beyond),
      # until counterexample / can't-compute / round cap. OFF: escalate() returns a
      # disabled outcome (nothing computed). The Phase-2 stall predictor + Phase-3
      # branch pivot are not built yet. Rollback: false.
      frontierEscalationEnabled: true   # 2026-05-31 (Phase 5): escalation LOGIC on — escalate() is functional. SAFE: spends nothing until produce() is invoked (scheduled run is separately gated below). Rollback: false.
      frontierEscalationMaxRounds: 20   # 2026-05-31: 8->20 — the prior run hit this cap while still progressing (2e8). More rounds let the frontier ratchet further per run. Rollback: 8.
      # Phase 2 stall predictor: fits cost~=a*x^p from discovery-rung elapsed and
      # solves a*x_c^p = stallBudgetMs for the compute frontier x_c; the loop stops
      # (predicted_stall) before a rung whose x would exceed x_c. scienceFrontier
      # (x_s) = where the question is actually decided (~1e14 for Mertens; 0 =
      # unknown) — only sets the informational stalls-before-answer flag for the
      # Phase-3 pivot, doesn't change the stop.
      frontierStallBudgetMs: 30000     # per-rung discovery-time ceiling for x_c
      frontierScienceFrontier: 0       # x_s; 0 = unknown/unbounded
      # Phase 3 branch pivot: on a predicted stall, try verifiable innovative
      # branches in trust order (B3 proxy reformulation, then B4 predictive model;
      # proposers injected — none yet, so the honest default is the B5 boundary)
      # instead of stopping. OFF: the loop just stops at predicted_stall. Rollback:
      # false.
      branchPivotEnabled: true   # 2026-05-31 (Phase 5): pivot LOGIC on — a predicted stall pivots to B3/B4 then the honest B5 boundary instead of just stopping. SAFE (no spend until produce() runs). Rollback: false.
      # Phase 4 frontier-paper: the start scale for the Mertens escalation (first
      # rung; <= NT_MAX_N so it begins on the sieve, then escalates 10x beyond).
      frontierStartScale: 2000000
      # Phase 5 — autonomous scheduled frontier runs. THIS is the token-spend gate:
      # each run drives the discovery rungs (real LLM + sandbox). OFF by default so
      # flipping the logic flags above does NOT auto-spend; the operator opts in
      # here, and the long interval bounds the cost. Watch the log for "frontier
      # paper produced" / "scheduled frontier run". Rollback: false.
      mertensFrontierScheduleEnabled: true   # 2026-05-31: flipped ON — autonomous frontier runs every frontierScheduleMs. SPENDS LLM tokens per run (discovery rungs + the llm step policy). Rollback: false.
      frontierScheduleMs: 21600000     # 6h between autonomous frontier runs
      # Second domain in the persist/recall corpus: the Dirichlet divisor sum D(x)=Σ d(n),
      # bound |D(x)−x(ln x+2γ−1)|<√x, keyed "divisor_D" (independent of mertens_M). Tier 2 —
      # it runs the SAME generic escalation as Mertens (sieve oracle ≤ NT_MAX_N, LLM-discovered
      # D(x) methods beyond), threading quantity="divisor" to the sidecar oracle switch. Like
      # the Mertens schedule it SPENDS LLM TOKENS on the discovery rungs — but only when
      # discovery is actually live (runtimeExecEnabled AND the sidecar's ET_DISCOVER_EXEC=1);
      # otherwise the pre-flight skips the whole run with no spend. divisor-count papers
      # recall_frontier_knowledge the accumulated D(x) corpus. Rollback: false.
      divisorFrontierScheduleEnabled: true     # 2026-06-01: ON — run the divisor_D frontier (sieve + discovery, doubly-gated by the discovery flags).
      divisorFrontierScheduleMs: 21600000   # 6h between divisor runs (re-walks until converged, then no-ops)
      divisorFrontierStartScale: 2000000    # first x to escalate (the sieve ceiling; resumes higher from the persisted frontier)
      divisorFrontierCpuSeconds: 60         # per-candidate sandbox CPU budget for divisor discovery (mirrors Mertens)
      divisorFrontierWallSeconds: 80        # per-candidate sandbox wall budget (> cpu for JIT/startup headroom)
      # 2026-06-02 — author-facing per-paper discovery tool for the divisor sum: advertises
      # `discover_divisor_value` (D(x) beyond the sieve) into a paper's tool loop, the divisor
      # sibling of `discover_mertens_value`. Default ON. Still doubly-gated by runtimeExecEnabled
      # (above) AND the sidecar's ET_DISCOVER_EXEC=1 — this flag only controls advertising the
      # divisor tool independently of Mertens. Rollback: false.
      divisorDiscoverToolEnabled: true
      # Path A (2026-06-02) — THIRD domain in the persist/recall corpus: the prime-counting
      # function pi(x), bound |pi(x)-li(x)| < sqrt(x)*ln(x)/(8*pi) (the von Koch/Schoenfeld
      # RH-equivalent bound), keyed "prime_pi" (independent of mertens_M / divisor_D). Runs the
      # SAME generic escalation, threading quantity="prime" to the sidecar oracle switch
      # (nt_prime_indicator cumulative -> pi(x)). Escalating it tests RH numerically: it keeps
      # HOLDing across every reachable scale (RH verified far past 10^14). Like the other
      # schedules it SPENDS LLM TOKENS on the discovery rungs, only when discovery is live
      # (runtimeExecEnabled AND the sidecar's ET_DISCOVER_EXEC=1); otherwise the pre-flight
      # skips the run with no spend. REQUIRES the sidecar's "prime" oracle branch (added in
      # julia-math-sidecar; needs a sidecar restart to take effect). Rollback: false.
      primeFrontierScheduleEnabled: true     # 2026-06-02 (Path A): flipped ON — autonomous pi(x) frontier opted in, SPENDS LLM tokens on the discovery rungs every primeFrontierScheduleMs. NOTE: until the sidecar carrying the "prime" oracle is RESTARTED, beyond-sieve validation 400s (quantity=prime unknown) so each run still spends a few LLM calls on doomed candidates then stalls — restart the sidecar promptly so the spend isn't wasted. Rollback: false.
      primeFrontierScheduleMs: 21600000      # 6h between prime runs (re-walks until converged, then no-ops)
      primeFrontierStartScale: 2000000       # first x to escalate (the sieve ceiling; resumes higher from the persisted frontier)
      primeFrontierCpuSeconds: 60            # per-candidate sandbox CPU budget for prime discovery (mirrors Mertens/divisor)
      primeFrontierWallSeconds: 80           # per-candidate sandbox wall budget (> cpu for JIT/startup headroom)
      # 2026-06-02 (Path A) — author-facing per-paper discovery tool for prime counting:
      # advertises `discover_prime_value` (pi(x) beyond the sieve) into a paper's tool loop,
      # the prime sibling of `discover_mertens_value` / `discover_divisor_value`. Default ON.
      # Still doubly-gated by runtimeExecEnabled AND the sidecar's ET_DISCOVER_EXEC=1 AND the
      # sidecar carrying the "prime" oracle branch. Rollback: false.
      primeDiscoverToolEnabled: true
      # Phase 6 — step policy. The frontier (max held scale) stays monotonic, but
      # the STEP is a decision and may go forward OR backward (a backward step
      # densifies/localizes; the loop guards cycles via a visited-set).
      #   default  — fixed x10 per round.
      #   adaptive — AGGRESSIVE margin-driven: leaps x100-x1000 while the bound holds
      #              with room, x3 floor near it (never crawls). Reaches the frontier
      #              fast; the stall predictor + pivot handle the ceiling.
      #   llm      — a frontier model picks the next scale from the (x, ratio) history
      #              (prompted aggressive, may step backward to localize); falls back
      #              to adaptive on a bad reply. Spends an LLM call per rung.
      # Rollback: default.
      frontierScalePolicy: llm   # 2026-05-31: flipped default->llm — a frontier model picks the next scale (aggressive, may step backward), one LLM call per rung; falls back to adaptive on a bad reply. Cheaper alternative: 'adaptive' (aggressive, no per-rung LLM call). Rollback: default.
      # Phase 6 — counterexample localization. OFF: the first counterexample stops
      # the loop (it's the headline result). ON: bisect the bracket (largest-held
      # -below, first-failed] to pin where the bound crosses (within ~10%), spending
      # extra rungs. For a non-monotone bound this localizes the bracket boundary,
      # not a proven first failure. Rollback: false.
      frontierLocalizeEnabled: true   # 2026-05-31: flipped ON — a counterexample bisects (largest-held-below, first-failed] instead of stopping (extra rungs). Rollback: false.
      # Phase 6 — proxy-discovery loop (the generalized-oracle consumption). When on,
      # B3 first tries a genuinely-different proxy quantity: generate a method ->
      # sandbox-execute -> judge via the proxy oracle (ProxyValidator vs
      # SummatoryProxyOracle), repairing on failure. Spends LLM + sandbox per attempt.
      # OFF: B3 keeps its M(x)-reformulation-only behavior. Whether a proxy is a
      # USEFUL constraint on the target is the open question — this only makes proxies
      # verifiable. Rollback: false.
      proxyDiscoveryEnabled: true   # 2026-05-31: flipped ON — B3 first tries a genuinely-different proxy quantity (generate->sandbox-exec->judge vs proxy oracle), spending LLM+sandbox per attempt. Rollback: false.
      # Pre-flight + sticky circuit-breaker for the discovery endpoint. ON (default):
      # every token-spending discovery/escalation path probes /discover/validate once
      # (cheap, no LLM, cached preflightCooldownMs) and SKIPS the run with a LOUD warn
      # if it's 403/unreachable (e.g. sidecar started without ET_DISCOVER_EXEC=1) — zero
      # tokens spent, the rest of the app keeps running. OFF: legacy degrade-on-403
      # (generate-then-fail per rung). Rollback: true (i.e. leave ON).
      preflightEnabled: true
      preflightCooldownMs: 60000      # re-probe interval; one probe per run shares the cache
      # Cold-start tolerance: the FIRST call to /discover/validate JIT-compiles the
      # parse+sandbox+sieve path on a single-thread Julia sidecar and can exceed the
      # steady-state timeout, causing a false "unavailable" right after boot. Until the
      # first 200, the probe uses preflightColdTimeoutMs and retries preflightColdRetries
      # times; a 403 (gate off) or connection-refused short-circuits without retrying.
      # After the first 200 it latches to the fast preflightProbeTimeoutMs.
      preflightProbeTimeoutMs: 5000   # steady-state per-attempt timeout (warm)
      preflightColdTimeoutMs: 20000   # per-attempt timeout until the first success (cold JIT)
      preflightColdRetries: 1         # extra retries on timeout while cold (0 = no retry)
      # Optional HARD STOP (default OFF): when ON, a pre-flight probe that finds
      # /discover/validate 403/unreachable shuts down the WHOLE ET app (graceful
      # SpringApplication.exit then System.exit hardStopExitCode) instead of just
      # skipping the run. This is the heavy blast radius — an explicit opt-in for
      # environments that prefer to fail loud rather than run with discovery dormant.
      # It rides the same probe, so it requires preflightEnabled=true. Default OFF:
      # the per-run circuit-break (skip + loud warn, app keeps running) is the right
      # default — a 403 is the sidecar gate working as designed. Rollback: false.
      hardStopOn403Enabled: false
      hardStopExitCode: 70            # exit code used on hard stop (70 = software error)
      # Run-until-converged: a frontier run on a fixed bound is largely repeatable, so
      # keep running only while a run PROGRESSES (extends the frontier); after this many
      # consecutive no-progress runs the bound is marked converged and scheduled runs
      # SKIP (no spend) until a new trigger. Validated results + convergence persist to
      # the DB (frontier_records / frontier_convergence), so the frontier accumulates
      # and survives restart. Rollback: large value (never converges) or
      # mertensFrontierScheduleEnabled:false.
      convergenceThreshold: 2
      # §10.1 — a discovery CANNOT_COMPUTE (e.g. OOM) feeds back to the scale policy
      # instead of ending the run; after this many CONSECUTIVE failures with no progress
      # the loop routes to the stall->branch-pivot path. Higher = give the LLM more
      # chances to self-correct to a reachable scale before pivoting. Rollback: 1
      # (first failure ends discovery, the old behavior).
      frontierMaxConsecutiveFailures: 5   # 2026-05-31: 3->5 — more failed scales (resets on any HOLDS) before pivot/stall, so the LLM has more room to walk down to a reachable x. Rollback: 3.
      # §10 / #3 — per-candidate sandbox compute budget. cpuSeconds bounds how big an x a
      # method can sieve (reachable x scales ~linearly with it: 20s reached ~2e8, 60s ~6e8-1e9).
      # wallSeconds is the hang backstop and MUST exceed cpuSeconds (Julia subprocess JIT/startup
      # is wall time, not the candidate's CPU). Bigger budgets reach further but each FAILED
      # attempt blocks the single-thread sidecar for the full wall time — with maxRepairAttempts(6)
      # x frontierMaxConsecutiveFailures(5) that's up to 30 attempts/run. Rollback: 20 / 28.
      frontierCpuSeconds: 60
      frontierWallSeconds: 80
      # Paper-side recall (§8b): when ON, a mertens-class paper can call the read-only
      # recall_frontier_knowledge tool to reuse the persisted, independently re-verified
      # frontier corpus (records + best method) with trust carried verbatim — no discovery
      # re-run, no LLM/sidecar spend. The tool is advertised only when this is ON AND the
      # FrontierKnowledgeService bean is present. Trust is never laundered: a FULL value is
      # reported as computed-and-verified at x, never as a proof. Rollback: false.
      frontierRecallEnabled: true   # 2026-05-31: flipped ON — accumulated frontier knowledge is reusable by papers.

  # SimulationGate — pauses scheduledRoomMaintenance when any provider's rolling
  # token spend crosses pauseThresholdPct of its limit, and reopens after a drop
  # below resumeThresholdPct (hysteresis). Provider keys are free-form; add any
  # future top-tier LLM (anthropic, openai, …) by appending an entry — every
  # model the provider exposes is aggregated under its key. dailyLimit /
  # minuteLimit = 0 means "unlimited" (use for local / unmetered providers).
  tokens:
    # TokenBudgetReporter prints a one-line-per-provider heartbeat every
    # reportIntervalMs: tokens used/remaining (day + minute), current burn rate,
    # pause-likelihood ETA. Cheap — only reads in-memory counters.
    reportIntervalMs: 60000
    budget:
      enabled: true
      pauseThresholdPct: 95
      # Phase 21 §21.1 — soft threshold consulted only by tool-loop
      # continuation rounds (round ≥ 1) via TpmBudgetGate.GateLevel.SOFT.
      # When the per-minute budget sits in [soft, hard), single-shot calls
      # and first tool-loop rounds still go through; mid-loop continuations
      # exit so the last 10% of budget stays available for higher-priority
      # work. Per-provider override available under providers.<key>.softPauseThresholdPct.
      softPauseThresholdPct: 85
      resumeThresholdPct: 80
      # Per-provider TPM/TPD limits now live alongside each pool under
      # app.ai.providers.<name>.rate (merged into TokenBudgetProperties at
      # startup), so the gate keeps its min-across-metered semantics: it closes
      # only when EVERY metered provider is over pauseThresholdPct. Only metered
      # generic-pool providers carry a rate block (groq, openrouter); fast
      # and local Ollama are unmetered — absent here means unlimited.

  # SystemResourcesGate — host-level kill-switch. Scheduled samples /proc/meminfo
  # and /proc/loadavg plus JVM heap; if any metric crosses the CRITICAL threshold
  # the gate closes and worker threads either return early or block in
  # awaitOpen(). Added after the 2026-05-16 system-wide hang to keep the app
  # from piling on more work while the kernel is thrashing.
  #
  # Memory thresholds are PERCENTAGES of total host memory by default — the
  # gate reads MemTotal at startup (re-resolved every 60s) and computes the
  # elevated/critical floors from that, so the same defaults work on a 4 GB
  # laptop and a 64 GB workstation. Set memAvailableElevatedMb /
  # memAvailableCriticalMb to a positive integer to override with absolute
  # values (useful for capping behavior in containers with cgroup limits
  # smaller than the host's MemTotal). Load and heap thresholds are already
  # per-core / heap-pct and don't need overrides.
  resources:
    enabled: true
    sampleIntervalMs: 5000
    memAvailableElevatedPct: 20   # warn when free mem < 20% of total
    memAvailableCriticalPct: 7    # pause when free mem < 7% of total
    memAvailableElevatedMb:  0    # >0 overrides the pct above
    memAvailableCriticalMb:  0    # >0 overrides the pct above
    loadPerCoreElevated:     2.0
    loadPerCoreCritical:     4.0
    heapElevatedPct:         85
    heapCriticalPct:         95

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  file:
    name: logs/et-app.log
  level:
    org.springframework.boot.context.config: DEBUG
    com.emergentterrain.service.RoomService: INFO
    com.emergentterrain.service.LlmService: INFO
