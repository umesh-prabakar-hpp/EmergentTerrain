      cladeValueSelectionEnabled: true   # 2026-06-03: flipped ON (non-retiring tier — reorders the queue). Rollback: false.
      # Phase 30 Wave 3 — sublinear generation budget (SublinearGenerationBudget). When ON (with
      # compositionPersistEnabled), the per-pass composition cap becomes floor(n_validations^alpha)
