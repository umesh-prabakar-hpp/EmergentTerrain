    # confirmatory (none REFUTED, none in the binding regime) to NEEDS_REVISION.
    # Defense-in-depth behind the Rec 1 auto-probe (app.julia.conjecture
    # .boundary-probe-enabled), which fixes it at the source; this catches a
    # confirmatory-only trace if the auto-probe is off or could not run.
    # 2026-05-30: flipped ON after the gate landed (it changes terminal status;
    # rollback = flip back to false, effective next published paper).
    binding-regime-coverage-gate:
      enabled: true
      # 2026-06-15 (review-2026-06-15e Rec 1) — the gate assumes a BOUND. A constant-convergence /
      # oscillation paper (load-bearing frame verify_constant/verify_oscillation, e.g.
      # omega_Omega_gap → 0.77316, mean_divisor_excess → 2γ) legitimately has no binding region / no
      # refutation, so the gate mis-fired and NEEDS_REVISION'd correct second-order recoveries (0/4
      # published, review-e). ON exempts that frame; bounds still gated. Rollback: false.
      constant-frame-exempt: true
    # A manuscript calling an affine relation "binding" must show the verifier's
    # same-relation, same-grid HOLD/REFUTED pair. This also covers an affine
    # sensitivity claim embedded in a measurement-framed paper.
    affine-binding-claim-gate:
      enabled: true
    # A same-grid HOLD/REFUTED pair establishes only local sharpness. For every
    # tight affine pair, the completion policy locks a deterministic second grid
    # before running it; a PUBLISHED paper must retain a HOLD there with all
    # affine parameters unchanged. Rollback: false.
    affine-binding-independent-grid-gate:
      enabled: true
    # Exact predicate censuses still need a design that distinguishes arbitrary
    # window choice from a robust baseline comparison: two widths and two
    # pairwise-disjoint confirmation windows, in addition to the original scan.
    predicate-baseline-sensitivity-gate:
      enabled: true
    # Dynamic predicate studies derive this plan before their initial census:
    # unchanged baseline, original window, independent location, and independently
    # located second width. Overlap is exploratory only and cannot satisfy this plan.
    # The selected trace must execute all three registered run_predicate_scan calls.
    predicate-study-preregistration-gate:
      enabled: true
    # max_prime_gap uses a distinct pre-registered design: estimate k/c only on the
    # 100M fit grid, then keep them unchanged across two location holdouts, an
    # overlapping offset, and a doubled-width grid. Each required hold uses the
    # affine binding tightness threshold (relative slack <= 0.05), so a loose shared envelope cannot
    # satisfy this gate. Rollback: false.
    max-prime-gap-multiscale-preregistration-gate:
      enabled: true
    # After the professor obtains a verifier-supplied tight-fit coefficient or refuting intercept,
    # execute only the next registered max_prime_gap call directly: tight fit, same-grid refutation,
    # then fixed holdouts. The model retains framing and interpretation; this prevents duplicate or
    # post-hoc re-fitted protocol calls. Rollback: false.
    max-prime-gap-multiscale-preregistration-executor:
      enabled: true
    # max_divisor_count measurement papers lock their fit grid and three fixed scale/window
    # holdouts. They cannot enter PUBLISHED until the selected trace also records a divisor/Wigert
    # search result that was read and cited in Related Work. Rollback: false.
    max-divisor-count-measurement-preregistration-gate:
      enabled: true
    # The signed window Möbius sum is a finite envelope measurement, never an affine
    # frontier claim. The selected trace must retain its locked primary, disjoint-location,
    # and changed-width verify_oscillation calls; the computational plan separately requires
    # the normal search → read → Related Work source chain. Rollback: false.
    mertens-envelope-preregistration-gate:
      enabled: true
    # 2026-06-06 review rec #1 — hypothesis-LHS coverage gate. Routes a conjecture
    # paper (topic conjecture/<lhs>) whose trace never invoked verify_conjecture
    # with that lhs to NEEDS_REVISION. Classification-independent sibling of the
    # binding-regime gate (which only sees SUPPORTED): catches P-b72c-215's shape
    # (no positive claim, every call off-target, reached PUBLISHED) and forces
    # P-b72c-210's shape (lhs swapped for another scalar → tautology) back through
    # revision against the preregistered pair. Rollback = flip to false.
    hypothesis-lhs-coverage-gate:
      enabled: true
    # A constant-framed scalar (for example cramer_gap_ratio) may be explored
    # with an affine bound, but cannot publish from that proxy alone. If the
    # selected trace tested the topic LHS with verify_conjecture, it must also
    # contain a usable same-LHS verify_constant measurement. This permits both
    # CONVERGED and NOT outcomes; the direct measurement, not the ceiling, is
    # the load-bearing result. Rollback: false.
    constant-frame-direct-measurement-gate:
      enabled: true
    # 2026-06-06 review rec #3 — bounded resample on a professor empty trace.
    # A professor's initial tool-bearing round now sends tool_choice=required,
    # but retain bounded resamples as a provider-compatibility fallback if an
    # upstream still returns no usable trace. 0 disables that fallback. Stamps
    # prof:empty_trace_resample.
    # 2026-06-08 review rec #2: 1 → 2. The first recall session hit a 77%
    # empty-trace rate (highest ever); at that decline rate one retry is too
    # few — a second roughly doubles per-draft rescue odds. Throughput backstop
    # independent of the recall-short-circuit hypothesis (rec #1).
    professor:
      empty-trace-retries: 2
      # Phase 33 lane D (D1, 2026-07-05) — binding-pair completion: when the professor trace
      # carries a tool-declared TIGHT HOLD without a REFUTED counterpart, the loop executes that
      # verifier-selected same-grid refutation before final synthesis. The bounded +2 round
      # extension remains available for its continuation. Inert on loops with no verifier-supplied
      # completion call. Rollback: false.
      extra-rounds-on-binding:
        enabled: true
        extra-rounds: 2
    # Phase 32 Wave 0 (32.1) — verified-values manifest capture (write-only:
    # a .manifest.json sidecar beside each published paper; nothing reads it
    # yet; capture failures never affect publication). Flipped ON 2026-06-06
    # at merge — capture-only is risk-free and every session without it loses
    # the acceptance-check data (manifest recall >= validator-ladder recall,
    # sidecar <= a few KB/paper) that gates the Wave 1 shadow validator.
    # Rollback = flip to false.
    manifest:
      capture:
        enabled: true
      # Phase 32 Wave 1 (32.2) — off | shadow | enforce.
      # 2026-06-06 shadow → ENFORCE after the 4-session A/B (227–244, ~420
      # salient values): shadow misses 10 (9 honest-derivation rule-covered +
      # 1 correct catch), 0 missed fabrications; ladder value-arms 3/3 FP.
      # Under enforce: a manifest miss ROUTES to NEEDS_REVISION
      # (publish:manifest_miss→needs_revision); the ladder's value-tracing
      # reason classes retire to manifest lookup (isValueTracingReason);
      # its STRUCTURAL classes (executed-range, Conclusion consistency,
      # call-marker integrity) keep routing — P-b72c-244's scope catch is
      # why. Rollback: set back to shadow (stamps return to :warn, ladder
      # value arms resume).
      validator-mode: enforce
    # Phase 32 Wave 2 (32.3) — off-target corrective re-run (deterministic
    # pivot arm). When a conjecture trace never verified the PRE-REGISTERED
    # lhs (P-b72c-210/215/217 shape, ~2 papers/session before the gate), the
    # professor re-runs once with a corrective note naming the pair; the
    # publish gate remains the backstop if still off-target. Drain-aware
    # (discretionary spend); bounded by max-refinements; only fires where the
    # paper was otherwise headed to NEEDS_REVISION, so worst case = one extra
    # call and the same gate outcome. Stamps prereg:pivot:*. Rollback = false.
    pivot:
      enabled: true
      # 2026-06-14 — bumped 1→2: the three triggers (off-target > second-order >
      # tighten) share ONE re-run loop, so with max-refinements=1 a paper that is
      # both second-order-skipped AND loose-held got only the higher-priority
      # re-run and the other deferred to still_* (observed on P-b72c-77627570:
      # second-order fired, tighten deferred → still_loose). 2 lets both fire on
      # the same paper. Per-paper bound (justified — per-paper corrections, not
      # cross-paper volume); the drain-window aggregate stays capped by
      # max-reruns-per-run=2 and the $1.30 reserve.
      max-refinements: 2
      # 2026-06-13 — reclassify the corrective re-run (off-target + second-order,
      # one shared loop) as IN-FLIGHT-COMPLETION spend rather than discretionary:
      # a re-run improves a paper already in flight, so it rides the drain
      # contract's "in-flight papers finish on the reserve" promise and may run
      # until the HARD stop, not just until drain-start. This is what lets the
      # second-order gate fire on a leading-order paper that lands AFTER
      # drain-start (the P-b72c-77627545 case). Paired with the 2026-06-13
      # cost-drain reserve bump ($1.00→$1.30). max-reruns-per-run bounds re-runs
      # that fire WHILE DRAINING (the reserve-consuming ones) so the aggregate
      # (~2 × $0.20) stays inside the $0.39 reserve headroom; pre-drain re-runs use
      # the normal budget. complete-in-flight=false → today's drain-gated behavior.
      complete-in-flight: true
      max-reruns-per-run: 2
    # Phase 32 Wave 2 (32.3, 2026-06-13) — second-order ENGAGEMENT gate. Shares
    # the pivot's corrective-re-run machinery (same max-refinements / drain
    # gate). When a conjecture trace on a textbook-leading-order LHS
    # (mean_omega, mean_Omega, mean_divisor_count, max_divisor_count, and the
    # densities — ScoreCalibration.LEADING_ORDER_LHS) only bounds the quantity
    # and never engages a second-order frame (verify_constant/oscillation/
    # growth), the professor re-runs once with a note that DEMANDS it go past
    # the leading order — but leaves WHICH second-order object to measure to the
    # model (directive SECOND-ORDER STEP is the menu). App enforces engagement;
    # model owns determination. Fixes the 0-vs-24 omega_ek_ratio adherence
    # variance structurally. Stamps prereg:pivot:secondorder_rerun:*. Rollback =
    # false (then today's behavior is bit-identical).
    second-order-gate:
      enabled: true
    # 2026-06-14 — tight-k re-run gate. Third trigger on the shared corrective-
    # re-run loop: when a growth-anchor bound HELD only LOOSELY and the verify
    # tool named the tighter k that holds, but the professor never re-verified
    # at it, force one re-run at the tool-suggested k so the tight machine-found
    # constant is captured (P-b72c-77627560 left the tight Cramér bound
    # max_prime_gap ≲ 0.488·(ln x)² on the table). The tight k is the TOOL's
    # determination; the app only enforces the follow-up. Same drain/in-flight/
    # budget contract as the other two triggers. Stamps prereg:pivot:
    # tighten_rerun:* / still_loose. false = bit-identical to today.
    tighten-gate:
      enabled: true
    # 2026-06-15 (Phase 30 G2) — the two-term twin of tighten-gate. A generated
    # two-term composite (lhs ≤ k·rhs + k2·rhs2 + c) that HELD only loosely — the
    # verify tool emitted "LOOSE (two-term): re-verify at c=…" — and was never
    # re-verified at that tight intercept gets ONE corrective re-run driving it to
    # the binding region: tighten c (keep k/k2, the residual structure) and show a
    # slightly-tighter c REFUTES, so a confirmatory-only hold gains the binding
    # region binding_regime_uncovered requires (and a refuted-by-a-hair fit is
    # rescued). Lowest priority of the four re-run triggers; only reachable when
    # two-term rows exist (twoTermEnabled). Stamps prereg:pivot:twoterm_tighten_
    # rerun:* / still_twoterm_loose. false = bit-identical to today.
    two-term-tighten-gate:
      enabled: true
    # 2026-06-18 (Phase 30 G2 follow-on, REVIEW_REPORT b72c4e10) — the TIGHT-HOLD
    # twin of two-term-tighten-gate. That gate only fires on a LOOSE hold (the tool
    # emits "re-verify at c="); a composite that holds TIGHTLY emits no suggestion,
    # so a paper can still publish with the binding region never shown (P-b72c-
    # 77627715: 60/60 windows held, slack 0.018–0.042, no refute). When on, a two-
    # term composite that HELD with NO refuting call anywhere gets one corrective
    # re-run that steps the intercept c down to where it binds (clears binding-
    # regime-uncovered). Lowest priority of the five re-run triggers; only reachable
    # when two-term rows exist (twoTermEnabled). Stamps prereg:pivot:sharpness_
    # probe_rerun:*. Shipped OFF 2026-06-18; flipped ON (fired live 2026-06-22, 2
    # re-runs). false = bit-identical to today.
    sharpness-probe-gate:
      enabled: true
    # 2026-06-18 (REVIEW_REPORT b72c4e10 §1) — scope-recover gate. A paper that narrates
    # results over an integer range NO tool call scanned is nulled by the publish gate
    # (NumericalConsistencyValidator scope overreach: P-b72c-77627718 narrated [0,400),
    # P-b72c-77627719 narrated [750,1200), neither scanned → NULL_RESULT). When on, such a
    # draft gets one corrective re-run telling the professor to either SCAN the missing
    # range (the re-run runs with tools) or DELETE the out-of-scope claim, before that null.
    # Domain-neutral — runs on ANY topic, in a PARALLEL loop after the conjecture pivot loop,
    # reusing its budget/drain plumbing. Stamps prereg:pivot:scope_recover_rerun:* /
    # scope_recovered / still_scope_overreach. false = bit-identical (gate still nulls).
    scope-recover-gate:
      enabled: true
    # 2026-06-13 — survivor-aware fallback guard. Tells the professor which
    # second-order CONSTANTS are already converged survivors in the pool so it
    # CITES them instead of re-measuring (a theorem-locked constant can't flip —
    # re-measuring is duplication; verify budget belongs on the open /
    # not-yet-established object). Only CONSTANT-kind rows are surfaced (the
    # living OSCILLATION/BOUND rows are intentionally re-evaluated each run, per
    # the no-reseed-skip rule). Generic logic (lists whatever the pool holds),
    # model decides cite-vs-measure. false = bit-identical to today.
    established-constant-cite:
      enabled: true
    # 2026-06-14 (paper-pipeline-quality-brief Change 1) — well-posedness gate. A
    # single cheap LLM check on a candidate topic BEFORE a paper run, catching
    # framing failures the verification machinery can't: representation-dependent
    # quantities (happy numbers are base-10 specific), no-limiting-value
    # "densities", tooling artifacts. CAVEAT-FIRST (per inform-don't-suppress +
    # no-reseed-skip): never hard-drops a topic — a non-admit verdict prepends a
    # caveat to the hypothesis so the writer opens by stating the issue. Domain-
    # neutral; best-effort (disabled/null-router/parse-fail → admit). false =
    # bit-identical to today (assess() returns ADMIT, no LLM call).
    wellposedness-gate:
      enabled: true
      # 2026-06-15 (review-2026-06-15a Rec 1) — PRUNE the recurring base-10 happy-prime density topic.
      # When on, a directive the gate flags representation_dependent (no representation-independent
      # density — the isPrime∧isHappy density topic that was 60% of recent batches as honest-but-
      # wasteful NULLs) is skipped + logged as a boundary event, not caveated-and-published. A
      # deliberate, flag-gated exception to caveat-first for that one non-research-grade class; OTHER
      # ill-posed classes (no_limiting_value, tooling_artifact, …) still get the caveat. The prompt
      # example was also de-anchored off isHappy so it stops being proposed. Rollback: false.
      prune-representation-dependent: true
      # Run-35 rec 1 (2026-07-06, user-approved) — single-predicate density topics whose
      # asymptotic density is a KNOWN constant (abundant ~0.2476, squarefree 6/pi^2, ...) are
      # REDIRECTED to second-order framing (measure the deviation rate, not the constant) instead
      # of re-measured (P-825 REJECTED + P-826 NULL re-measuring abundant; run-15 lost 3/6 slots).
      # Inform-don't-suppress: topic survives, target sharpens. Rollback: false.
      known-density-redirect: true
    # 2026-06-14 (paper-pipeline-quality-brief Change 4) — correct the result-
    # classification line shown to the SCORING REVIEWER. Conjecture drafts seed
    # SUPPORTED but the professor often refutes the bound; the reviewer was shown
    # "Result classification: SUPPORTED" while reading a refuting conclusion
    # (the divergence was caught only later, at the publish direction_inversion
    # gate). When on, reuses that same DirectionOfFindingValidator to correct the
    # label so a reviewer is never told SUPPORTED about a refutation. false =
    # bit-identical (raw stored label).
    reviewer-classification-fix:
      enabled: true
    # 2026-06-14 (paper-pipeline-quality-brief Change 6, capture point) — persist
    # each published paper's EXACT predicate-scan counts (keyed by predicate) to
    # the research-memory store, so a later cross-paper reconciliation pass can
    # flag overlapping ranges with mutually-impossible counts (e.g. 11 happy-primes
    # in [400,800) but 10 in the wider [400,850)). Write-only/best-effort; ON now
    # so the store accumulates history before the validate-at-publish wiring lands.
    # The deterministic checker is CrossPaperCountValidator. false = no capture.
    cross-paper-count:
      enabled: true
    # Phase 31 §31.7 — synthesis (review) papers over the room's own corpus.
    # A scheduled low-frequency pass picks the most-warranted topic family
    # (>= minSources cite-able PUBLISHED papers, not yet synthesized),
    # composes outline-first multi-section prose (every claim cited by
    # [paperId]), caps the evidence label at the weakest source, and persists
    # as PaperKind.SYNTHESIS. NULL_SYNTHESIS is first-class. Drain-aware,
    # ~1 paper/pass. Ships OFF: flip after the first composed synthesis is
    # spot-checked (>=5 sources, 0 citation violations, label cap respected).
    # The cramer convergence (6 papers + a compiled lesson) is the first
    # warrant. Rollback = false (no passes; corpus untouched).
    # 2026-06-08 flipped ON: the first scheduled pass (~20 min after startup)
    # composes the cramer synthesis — the memory arc's first published
    # artifact. Spot-check the result (>=5 sources, 0 citation violations,
    # weakest-label cap = CONJECTURE) before trusting subsequent passes.
    synthesis:
      enabled: true
      minSources: 5
      minSections: 3
      maxSections: 6
      # 2026-06-11 — evidence-based re-synthesis. 0 = legacy one-synthesis-per-family-EVER (after which
      # synthesis goes dormant once every family is done — which it was, by 2026-06-10, so syntheses
      # stopped). >0 re-synthesizes a family once it has gained this many NEW published source papers
      # since its last synthesis, so a stale review (the Jun-8..10 set predate the lever-D / decision-A /
      # tight-Cramér arc) refreshes when the corpus genuinely grows — without re-reviewing unchanged
      # families. Bounded to ≤1 synthesis/pass (runOnePass), one pass/session at the 4-min mark. 5 ≈
      # minSources, so a family refreshes roughly every few sessions it is actively topic'd. Lower to
      # refresh sooner; set 0 to revert to permanent-dedup.
      reSynthesisMinNewSources: 5
      # Phase 33 D3 (2026-07-07) — full-paper promotion: every published synthesis gets a
      # deliverable-grade pass (grounded intro/related-work with search + up to 2 full-text
      # reads at compose time, abstract, results program, provenance) written as
      # PAPER-<family>-<hash>.fullpaper.md. Failure-soft; synthesis publishing unaffected.
      # Rollback: false.
      full-paper:
        enabled: true
        # A readable legacy-grounding source is not enough for program-paper
        # promotion. Require a Phase 35 relevance-safe key, a successful read
        # of that exact key, and a related-work citation to it. Otherwise the
        # synthesis remains available for revision but no PAPER-* export is made.
        # Rollback: false.
        relevance-safe-promotion-gate:
          enabled: true
    # Phase 31 §31.6 (gap #21) — startup reconciliation across the three
    # provenance stores (room markdown / DB rows / llm-traces), keyed by
    # paperId. Read-only: one summary line + a WARN per md-without-DB orphan
    # (the genuinely-wrong class; trace-without-DB is expected D3-suppression,
    # DB-without-md is expected under retention=archive). ON at ship —
    # read-only check, zero behavioral risk.
    provenance:
      reconcile:
        enabled: true
    # Phase 32 Wave 3 (32.4) — calibrated absolute review head. STAYS OFF
    # until ReviewAnchorCalibration clears the deploy bar (binary accuracy
    # >= 0.80 AND Reject-recall >= 0.90 on the held-out 20% of
    # research/review-verdicts.csv). Run the harness in a dedicated app
    # session with ET_REVIEW_CALIBRATION=1 (the ET_DISCOVER_EXEC convention;
    # ~25 LLM calls). Advisory wiring (anchor:<verdict> stamps) lands with
    # the calibrated flip, not before — an uncalibrated absolute head is
    # worse than none.
    review-anchor:
      enabled: false
    # Phase 31 §31.1 — cross-run research memory, CAPTURE ONLY (the shadow
    # mode of the whole phase): deterministic writers append typed,
    # content-hash-deduped rows (paper outcomes, conjecture retirements) to
    # the additive research_memory table; nothing reads it until 31.3. ON at
    # ship — write-only, replay-safe (duplicate capture reinforces, never
    # duplicates), pipeline never depends on it. Rollback = false (zero rows
    # written, byte-identical pipeline).
    memory:
      enabled: true
      # Phase 31 §31.2 — offline consolidation over the capture store (30-min
      # schedule, off the hot path). Deterministic supersession (a retirement
      # FACT supersedes older live confirms on the same conjecture topic —
      # history kept, lineage queryable) + capped group->LESSON synthesis
      # (fast tier, drain-aware) + one crystal row per pass (also the
      # hash-incremental cursor: unchanged input = no-op).
      # 2026-06-08 flipped ON: 31.1 has accumulated several sessions of rows
      # (outcomes + retirements); the cursor bug from the commit-review pass
      # is fixed (cursor = last-consumed createdAt, mid-pass writes safe).
      # First live pass IS the row-count + confirm-then-refute acceptance
      # check — watch `memory-consolidation:` for newFacts/superseded/lessons.
      # Rollback = false (no passes run; capture continues).
      consolidation:
        enabled: true
        maxLlmCallsPerPass: 10
        minGroupSize: 3
      # Phase 31 §31.3 — index-first recall (the read path). Injects a
      # `## Prior lessons (compiled)` block of the top-k live LESSON rows for
      # the paper's topic into the professor prompt — recency-decayed,
      # reinforcement-boosted, char-budget-capped. No embeddings (curation,
      # not vector search, at this scale).
      # 2026-06-08 flipped ON: 31.2 synthesized the first compiled lessons
      # (incl. conjecture/cramer_gap_ratio — "2·density-feature bounds yield
      # trivial/unit-confounded/falsified results; only deficient/abundant
      # survive but still need revision"). The next cramer paper recalls this
      # and can reference the prior convergence instead of blindly re-mining a
      # seventh dressing — the capture→consolidate→recall assembler closes.
      # Watch `memory-recall: topic=` for the injection. A/B = repeat-
      # investigation rate down, NEEDS_REVISION not up. Rollback = false
      # (byte-identical to the recall-off pipeline).
      recall:
        enabled: true
        topK: 5
        # 600 → 1000 (2026-06-08 rec #1): the anti-short-circuit framing is
        # fixed overhead (~0.6KB); the budget must still leave room for topK
        # lessons after it. Set OFF here for the recall-short-circuit A/B —
        # flip to false for one session to isolate whether recall drives the
        # 77% empty-trace rate, then re-enable with the reworded block.
        tokenBudget: 1000
    # 2026-05-21 review §1 rec #4 follow-up — when on, flags Hypothesis prose
    # that declares a baseline value not matching any run_predicate_scan
    # tool-call baseline (P-a328-871 signature: prose said "≈ 0.300" while
