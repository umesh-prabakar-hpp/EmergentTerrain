      # §1 rec #1) stays dormant in a populated pool until a destructive wipe. ON: each pass also
      # seeds the genuinely-NEW (lhs,rhs) pairs absent from the pool entirely (live AND retired) into
      # the live store — activating new scalars without a wipe, preserving verified survivors (the
