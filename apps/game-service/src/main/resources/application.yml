      trivialityFilterEnabled: true   # 2026-05-31: flipped false->true — review Rec 1: P-b72c-46 (log_window_start ≤ 2·log_window_size + c) was a content-free window-geometry tautology that reached publish; this drops that class at mining time. Verified to keep mertens_per_sqrt_W bounds (carry mertens_delta, not geometry). Rollback: false.
      # 2026-06-14 — surgical incremental re-seed. seed() only fires on an empty pool, so a
