    #   warn      — log + stamp publish:prose_baseline_drift:warn, no status change.
    #   downgrade — route to NEEDS_REVISION with publish:prose_baseline_drift→needs_revision.
    # Default disabled+warn for rollout; one refresh of warn-mode data should
    # show the would-be-route rate before any paper status changes.
    prose-baseline-drift:
      enabled: true
      mode: warn
    # 2026-05-21 review §1 rec #5 — when on, flags "Lastname (Year)" cites
    # in Findings / Discussion / Related-Work prose that aren't backed by
    # any literature-corpus.yml entry. Targets the fabrication cluster:
    # P-a328-862 cited "P-2022-07", P-a328-872 "Torquato and Stillinger",
    # P-a328-890 "Hecht Optics 5th ed.". Mode escalation:
    #   warn      — log + stamp publish:citation_corpus:n=N:warn, no status change.
    #   downgrade — route to NEEDS_REVISION with publish:citation_corpus:n=N→needs_revision.
    # Default enabled+warn for rollout — v1 has known blind spots (textbook
    # references without years aren't extracted; unicode-dashed paper-IDs
    # like "P‑2022‑07" with U+2010 still escape the existing in-room
    # paper-ID regex). One refresh in warn mode should expose the
    # would-be-route rate before promotion.
    citation-corpus:
      enabled: true
      mode: warn
    # 2026-05-21 review §1 rec #6 — when on, flags published Discussion /
    # Related-Work prose that mentions a TopicValidatorRegistry topic name
    # OTHER than the paper's declared topic. P-a328-886 (Abundant Density)
    # carried "the specific focus on the Pendulum Breakdown Angle is new"
    # — narrator template-bleed from a different paper's context. Mode:
    #   warn      — log + stamp publish:topic_consistency:n=N:warn, no status change.
    #   downgrade — route to NEEDS_REVISION with publish:topic_consistency:n=N→needs_revision.
    # Default enabled+warn for rollout: a legitimate cross-topic mention
