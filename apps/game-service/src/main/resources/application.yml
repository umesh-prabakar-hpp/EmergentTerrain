      compositionPersistCap: 5
      # Phase 30 integration step 2.5 — exempt derived (composed) conjectures from
      # the window_size knob-restatement filter. Without this, every persisted
      # composition is culled within one mine pass: a cross-quantity relation
      # (deficient_density <= 4*abundant_density + c) has slack that trends
