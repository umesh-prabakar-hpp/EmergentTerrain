      # Rollback: false.
      opennessDiversityEnabled: true
      # 2026-06-30 — Phase 30 G4 (open-behavior-generation-activation.md) quality-diversity retention
      # into selection (30.3). ON: nextN collapses the servable pool to one elite (most-confirmed) per
