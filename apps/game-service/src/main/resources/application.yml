      # 2026-05-29 — allow-substrate gate (ConjectureTopicProvider). CSV of substrate keys permitted to source conjecture papers; a cycle whose mapped substrate (MATHEMATICS→math, PHYSICS→physics, MATERIALS→materials) is not listed falls through to the catalog path. Pinned to 'math' (the only populated substrate today) to focus testing. Append physics,materials here as Phase 23.7 substrates come online — enable one at a time.
      allowedSubstrates: math
      # Phase 30 Wave 1 (phase-30-conjecture/IMPLEMENTATION-ORDER.md) — structural
      # triviality + dedup of seeds each mine pass (ConjectureTrivialityFilter):
      # drops window-geometry tautologies (both sides log/sqrt of window params)
