spring:
  config:
    # Per-model LLM price lookup lives in a separate file (optional so the app
    # still boots if it's absent). Bound by the LlmPricing component.
    import: optional:classpath:llm-pricing.yml
  datasource:
    url: ${PG_URL:jdbc:postgresql://localhost:5432/emergentterrain}
    driverClassName: org.postgresql.Driver
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:NewStrongPasswordHere}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    # JpaBaseConfiguration warns when this is left at its implicit default.
    # `false` is production-correct: closes the persistence context at the
    # controller boundary so DB connections aren't held across view
    # rendering. Safe here because no entity carries @OneToMany / @ManyToMany
    # / FetchType.LAZY associations — every reference is eagerly fetched, so
    # there's nothing for the closed context to lazy-load against.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  thymeleaf:
    cache: false
  task:
    scheduling:
      pool:
        size: 12
  # Phase 9 U4 — spring.ai.ollama.* removed from default config; OllamaPool reads
  # from app.ai.ollama.* now. If you have an existing override in another
  # application.yml or env layer, OllamaPool will log a deprecation WARN at
  # startup and continue using the legacy value for this release cycle.
server:
  port: 8081
app:
  research-context:
    # Required by the internal research-service caller; keep empty to reject unauthenticated calls.
    api-key: ${RESEARCH_CONTEXT_API_KEY:}
  research-results:
    # Required for research service to publish immutable display results to the game.
    api-key: ${RESEARCH_RESULT_API_KEY:}
  e2e:
    enabled: true
  # Phase 42 — gameplay reads research through a v1 API boundary.  "local" keeps
  # the existing co-located UniversityService implementation during extraction;
  # set mode to "remote" only after apps/research-service is deployed on base-url.
  research-api:
    mode: local
    base-url: ${RESEARCH_API_BASE_URL:http://127.0.0.1:8082}
    # `outbox` writes generic research work durably, then delivers it to the research service.
    # Set the same nonempty value on research-service's RESEARCH_WORK_API_KEY.
    work-api-key: ${RESEARCH_WORK_API_KEY:}
    outbox-relay-interval-ms: 1000
    reconciliation:
      # Default-off cutover evidence only: reads generic durable status and writes game-owned audit records.
      enabled: ${RESEARCH_WORK_RECONCILIATION_ENABLED:false}
      interval-ms: ${RESEARCH_WORK_RECONCILIATION_INTERVAL_MS:5000}
  # Hermes-style external secret source. Default OFF. When enabled, ONE
  # bootstrap token (held in the OS env / .env) unlocks a vault, and the
  # provider API keys are pulled from it at startup and injected as a
  # LOWEST-precedence property source. Effects:
  #   - Non-destructive: a fetched key is skipped if already set by the OS env
  #     / .env / this yaml, so shell exports and explicit config always win.
  #   - A vault value DOES supersede the committed `${X:literal}` fallbacks
  #     below (those literals are placeholder defaults, not a property source).
  #   - Fail-open: a missing CLI / token / network logs one line and startup
  #     continues with whatever config already exists.
  # The vault should publish secrets named like the env vars referenced below:
  #   GROQ_API_KEY, OPENROUTER_API_KEY, NVIDIA_API_KEY, CEREBRAS_API_KEY, ...
  # See com.emergentterrain.secrets.* (ExternalSecretsEnvironmentPostProcessor).
  secrets:
    enabled: true
    source: file               # file | command
    timeout-seconds: 30
    cache-ttl-seconds: 300     # in-memory cache for fetched secrets; 0 disables
    command:
      # Generic fallback for any vault with a CLI that prints JSON to stdout,
      # e.g. ["vault","kv","get","-format=json","secret/llm"] or an `op`/`aws`
      # invocation. Accepts {"K":"V"} or [{"key":"K","value":"V"}].
      exec: []
    file:
      # Local encrypted-file source (no CLI, no server, no network): an
      # AES-256-GCM blob unlocked by ONE bootstrap passphrase. Create/rotate it
      # with the seal CLI (see RUN.md, "Encrypted provider secrets"). To use, set source: file above.
      path: ""                               # empty = ~/.emergentterrain/secrets.enc
      passphrase-env: ET_SECRETS_KEY         # the ONE bootstrap secret (decryption passphrase)
      passphrase-file: ~/.emergentterrain/passphrase   # 0600 file holding the passphrase; wins over passphrase-env
  # Phase 22 §22.2 — Julia math sidecar bindings. The sidecar is an
  # opt-in HTTP service in services/julia-math-sidecar/ that wraps
  # Symbolics.jl + Roots.jl + QuadGK.jl. With
  # `enabled: false` the JuliaMathClient bean still instantiates but
  # every call short-circuits, so MathToolSuite uses the in-process
  # Symja path. The bean's @PostConstruct probes /healthz; on
  # failure it marks itself unreachable and the Symja fallback kicks
  # in for every call.
  #
  # 2026-05-20: flipped false → true to trigger §22.7 acceptance run.
  # The sidecar must be running on the configured baseUrl BEFORE the
  # Spring app starts, otherwise @PostConstruct sets reachable=false
  # and the system stays on Symja. See julia-math-sidecar/README.md
  # for sidecar bringup; see phase-22-julia-math-sidecar.md §22.7 for
  # the full acceptance runbook.
  julia:
    enabled: true
    baseUrl: http://127.0.0.1:8088   # 2026-05-23: localhost → 127.0.0.1; box resolves localhost to ::1 only, but sidecar binds IPv4 127.0.0.1 → probe timed out
    timeoutMs: 5000
    healthProbeTimeoutMs: 3000   # 2026-05-20: bumped 2000 → 3000 to survive JIT-busy window
    reportIntervalMs: 300000     # 5-minute sidecar metrics heartbeat
    # PyCall-backed endpoints (prove_identity, recognise/{constant,minpoly}) run
    # ONLY in the single-threaded py-sidecar (start-py-sidecar.sh), never the
    # PyCall-free main server (8088). The Sympy/Pslq/Lll clients connect here
    # directly and PySidecarHealth probes this /healthz, so their isAvailable()
    # reflects the process that actually serves the work (not the main server's
    # /healthz, which answers 200 even when those endpoints would 503).
    pySidecarUrl: http://127.0.0.1:8089
    pySidecarHealthProbeTimeoutMs: 3000
    # Phase 24 §24.2 — PySR symbolic regression knobs. Flag-gated dormant
    # until §24.5's recovery probe passes; flip `enabled: true` to wire
    # the `symbolic_regress` tool into MathToolSuite. timeoutMs here is
    # the per-/pysr-call cap (longer than the shared timeoutMs above
    # because SR runs evolve a Pareto front, not a single evaluation).
    pysr:
      enabled: true
      timeoutMs: 20000           # per-call wall-clock cap, server clamps /pysr at 120s
      populations: 8             # multi-population GP island count
      iterations: 40             # iterations per population
      complexityCeiling: 30      # max expression-tree size SR will propose
      # Phase 24 §24.6 Lever 1 + Lever 3 defaults. Per-PysrRequest override
      # available for tests/probe; production defaults match the recommended
      # wiring (autoRetry on, autoNormalize off — clean fits pay nothing,
      # stuck fits get the rescaling rescue via the sidecar's lazy retry).
      autoNormalize: false
      autoRetry: true
    # Phase 25 §25.2 — SymPy combinatorial-identity prover, hosted in
    # the sidecar via PyCall.jl (per the 2026-05-22 Julia-consolidation
    # decision). enabled=true (flipped 2026-05-22 end-of-day) registers
    # MathToolSuite's prove_identity tool; the reviewer panel can stamp
    # EvidenceLabel.THEOREM on identities where the tool returns a
    # verified Gosper / Zeilberger-WZ certificate. Coverage probe
    # cleared 10/10 (above the §25.5 8/10 bar) before this flip.
    # timeoutMs is currently advisory (PyCall + Threads.@spawn don't
    # compose; sidecar enforces no wall-clock cap in v1 — relies on
    # the 512-char input cap to bound runtime).
    sympy:
      enabled: true
      timeoutMs: 10000
    # Phase 26 §26.1–§26.6 — constant + sequence recognition pass.
    # OEIS Superseeker + PSLQ + (optional) minimal-polynomial recovery
    # hosted in the sidecar via /recognise/* routes per the 2026-05-22
    # Julia-consolidation decision. The JVM keeps the Postgres
    # oeis_cache (single cache source of truth) and only hits the
    # sidecar on cache miss.
    #
    # enabled=true (flipped 2026-05-22) after §26.6's coverage probe
    # cleared 30/30 constants + 30/30 sequences — both bars at maximum
    # margin. OeisRecogniserClient.isAvailable() and
    # PslqRecogniserClient.isAvailable() now report true; the
    # ResearchNarrationService bean has the orchestrator wired but
    # narration-side recognise() invocation is still gated by a
    # follow-on slice (see 26.4b commit message).
    #
    # Operator watch items for the first 30 MATHEMATICS-domain papers:
    # zero hallucinated cite-recognised:* handles (use
    # RecognitionCitationValidator) and ≥80% narration-readability
    # parity vs pre-phase-26 papers.
    #
    # The LLL sub-flag stays off — minimal-polynomial recovery has a
    # larger false-positive surface than constant recognition; flip it
    # on per-paper when an operator wants algebraic-number recovery
    # for that specific computation.
    recognise:
      enabled: true
      timeoutMs: 5000
      lll:
        enabled: false   # phase 26.3 sub-flag — gated separately
    # Phase 28 §28.1 — conjecture-substrate consolidation knobs.
    # §28.6 cutover (2026-05-22): flipped enabled=true ahead of the full
    # N-day burn-in window due to runtime-availability constraints.
    # Justification: 19/19 parity tests green on the live sidecar
    # (numbertheory_window, conjecture_seed/update/verify, predicate_scan
    # all byte-identical), zero sidecar errors across ~179 calls so far.
    # Graceful fallback is wired: MathConjectureSubstrateDelegate logs
    # WARN and falls through to legacy on any sidecar exception, so a
    # sidecar outage degrades to phase-23.1J behaviour rather than
    # blocking recognition/mining. Flip back to false if sidecar warns
    # cluster.
    conjecture:
      enabled: true
      timeoutMs: 15000           # 2026-05-29: 5000→15000 — large windows (e.g. size 50k near n=1M) on the single-thread 8088 sidecar exceeded 5s and crashed the mine pass; sidecar clamps at 30s. Paired with per-window skip-on-failure in ConjectureMinerService.materialize so a timeout no longer kills the pass. (Root contention fix = more sidecar Julia threads, deferred.)
      # verify_conjecture caps (surfaced in the tool schema so the LLM sizes its first call legally):
      #   maxWork — per-call total-integers budget (window_size × num_windows). A FREE tuning knob:
      #     the per-integer number-theory eval is in-process, so this just bounds one call's cost.
      #   maxN — the verify window ceiling (window_start + window_size × num_windows). NOT a free knob:
      #     it is the trusted factorization range, coupled to the sidecar's SEGMENTED reach
      #     (NT_SEGMENTED_MAX=1e12) and CLAMPED to ConjectureVerifier.MAX_N (2e9, the Java int-safe
      #     ceiling). The window-stat path (omega/Omega/divisor/Möbius-window, including mertens_delta)
      #     is segmented-safe to this ceiling — verified correct + fast at 1e9 (mean_omega→ln ln x, 74ms).
      #     The GLOBAL Mertens M(x) oracle stays dense-capped at the sidecar's NT_MAX_N=2e7 on a
      #     SEPARATE checkpoint-judge path (handlers.jl ~2538) that this knob does NOT gate.
      #     2026-06-16: 2e6→2e9 so the auto scale-ladder (verify_constant scale_ladder:true) actually
      #     reaches 1e8/1e9; at 2e6 every ladder capped at 2 rungs [1e5,1e6] and the segmented reach
      #     went unused. Needs an app restart to take effect (@Value read at startup).
      maxWork: 100000
      maxN: 2000000000
      # Room b72c4e10 fix — binding-regime auto-probe. For a start-monotone bound
      # (lhs <= k*log_window_start + c, k>0) whose requested windows all HELD,
      # ConjectureVerifier appends one window at boundary-probe-start (the
      # smallest-ceiling regime where the bound actually binds) and flips the
      # verdict to REFUTED if it violates. Stops confirmatory-only traces
      # (P-b72c-15) from earning a false HELD → SUPPORTED. Scoped to
      # log_window_start so it can never fabricate a spurious refutation on
      # content/size scalars; probe-window errors are swallowed (enhancement,
      # not correctness-critical). 2026-05-30: flipped ON after fix landed.
      boundary-probe-enabled: true
      # Start used for the binding-regime probe; 2000 is the regime where sibling
      # papers P-b72c-13/14 found genuine refutations, above the sub-100 noise
      # floor where number-theoretic scalars are too erratic to be representative.
      boundary-probe-start: 2000
      # 2026-07-05 (run-21 Rec 1, option b) — relative-tolerance VERDICT mode. When mean |lhs| ≤
      # 0.04 (the absolute HOLD slack) the absolute verdict is vacuous — every nearby intercept
      # "holds" and a formal REFUTED is unreachable, so binding_regime demotions were structurally
      # guaranteed for the small-density families (P-766, P-779: professors bracketed intercepts
      # correctly and could not terminate). In that regime ONLY, holds re-score against
      # max(4%·mean|lhs|, 1/window_size) — same 4% proportion O(1) quantities get, floored at the
      # density granularity. Post-pass over margins (covers the sidecar-batched path; no Julia
      # change); verdicts outside the regime bit-identical (parity). Output carries a
      # RELATIVE-TOLERANCE VERDICT tag. Rollback: false.
      relative-tolerance-verdict-enabled: true
      # 2026-07-05 (run-25 rec 1, P-b72c-77627793) — CONSTANT scale-ladder per-rung sample budget.
      # Second-order deficit signals are count-noise-limited: 100k integers/rung at x=1e9 holds
      # ~300 twin pairs (~6% noise) against a ~5% c/ln x signal → sign-flipping fits. Each rung
      # widens its windows to ~budget/num_windows integers (mean-identical for CONSTANT frames;
      # NOT applied to oscillation/growth ladders whose window statistics are size-dependent).
      # 5e6 → ~0.8% twin-noise at 1e9; the output reports the rung sample so papers can compare
      # signal vs noise in-band. 0 = legacy shape. Rollback: 0.
      ladder-rung-budget: 5000000
      # Locked v5 constant studies use this smaller ceiling for their primary ladder only. It
      # avoids a terminal high-x Julia request consuming the complete 15s deadline; the two
      # independent direct holdouts retain their declared 5,000×5 and 10,000×5 shapes.
      # 0 = use ladder-rung-budget (legacy behavior). Rollback: 0.
      ladder-deadline-budget: 500000
    # Phase 28 §28.6 — physics-topic compute is now SIDECAR-ONLY.
    # MathPhysicsEngineDelegate fires the Julia sidecar's /physics/topic for all
    # 63 topics (9 domains) and composes the ResearchResult JVM-side from the
    # numeric `detail` (SidecarResultComposer — prose built with the engine's own
    # String.format templates, byte-identical to the former in-process result).
    # The §28.5 shadow-read flags (app.julia.physics.topic.enabled / .primary) and
    # the in-process numeric engine they gated were removed in §28.6 legacy
    # removal: there is no flag and no fallback — if the sidecar is unreachable,
    # compute throws and the research loop treats it as a recoverable per-cycle
    # error.
  gpu:
    enabled: true
    world:
      enabled: true 
      minCells: 20000
    bots:
      enabled: true 
      applyEdits: true 
      cacheWorld: true
      steps: 1
      diffMaxEdits: 4000
      minBotCount: 128
      minWorkItems: 256
    patch:
      minArea: 4
  qr:
    hmacSecret: "dev-secret-change"
  room:
    defaultName: "Consensus Field"
    defaultAutoCreate: true
    multipleRoomsEnabled: false
    defaultUseWhenAvailable: true
    defaultSystemEmail: "system@emergentterrain.local"
    defaultSystemPasswordHash: "system-hash"
  world:
    auto: true
    width: 40
    height: 30
    maxTiles: 120000
    cacheTtlMs: 60000
    cacheMaxEntries: 64
    aspectRatio: 1.3333
    highwayRatio: 0.02
    flushIntervalMs: 750
    flushMinChanges: 80
    flushMaxIntervalMs: 15000
    flushOverdueLockTimeoutMs: 10
  consensus:
    neighborRadius: 24
    voteWindowSeconds: 6
    minProposalLiveSeconds: 1
    maintenanceIntervalMs: 150
    maintenanceWorkers: 4
    broadcastMinIntervalMs: 40
    botVoteRetentionSeconds: 0
    minVotesToResolve: 2
    quorumCap: 4
    botRuleChecksEnabled: false
    botProposalsPerMinute: 480
    maxBotProposalsPerMaintenance: 200
    maxBotsInspectedPerMaintenance: 400
    botApproveBias: 0.35
    approveOnTieAfterExpiry: true
    minNeighbors: 1
    noParticipationLockSeconds: 300
  density:
    areaSize: 20
    maxOccupants: 15
    occupancyRefreshMs: 250
  move:
    maxSteps: 6
  bots:
    populationFraction: 0.8
    maxPerRoom: 1000
    initialRoomCreateTarget: 200
    maxTickPerMaintenance: 0
    reversePenalty: 0.6
    headingBias: 0.18
    planLength: 3
    reverseCooldownTicks: 2
  highways:
    emergent:
      enabled: true
      longTripMinDistance: 12
      travelPressure: 0.35
      explorationPressure: 0.08
      decayPerMaintenance: 0.002
      promoteThreshold: 1.0
      preserveThreshold: 0.35
      removeThreshold: 0.12
      maxCoverageRatio: 0.08
      localDensityCap: 0.4
      localDensityRadius: 3
      seedPressure: 0.65
  government:
    enabled: true
    maintenanceIntervalMs: 2500
    electionIntervalMs: 60000
    billIntervalMs: 20000
    stateCount: 4
    feedback:
      implementation:
        successTrustDelta: 0.025
        successServiceDelta: 0.03
        stallTrustDelta: -0.015
        backfireTrustDelta: -0.045
        backfireServiceDelta: -0.03
      conflict:
        activeTrustDelta: -0.02
        activeServiceDelta: -0.015
        settledTrustDelta: 0.01
      pressure:
        trustPenaltyScale: 0.025
        trustPenaltyCap: 0.08
    thresholds:
      pressure:
        high: 0.65
        agendaShock: 0.68
        executiveTrigger: 0.55
      implementation:
        succeed: 0.72
        stall: 0.46
      court:
        blockScore: 0.45
    timeline:
      enabled: true
      fullResolutionHours: 6
      minuteBucketHours: 24
      fiveMinuteBucketDays: 7
      defaultWindowMinutes: 360
      maxWindowMinutes: 21600
      compactionIntervalMs: 300000
  simulationHistory:
    root: simulation-history
  activityLog:
    intervalMs: 30000
  university:
    enabled: true
    researchIntervalMs: 15000
    researchOutputDir: research
    # Phase 31 §31.6 (gap #20) — archive (default, pre-31.6 behavior: prior
    # room dirs move to research/archive/<room>-<stamp>/ at startup) | retain
    # (keep in place — /paper-review sees the cross-restart corpus in one dir;
    # paperId uniqueness across restarts is guaranteed by the durable allocation ledger). Operator
    # decision per the 31.6 design; flip to retain when cross-run review
    # continuity matters more than a clean per-run dir.
    researchOutputRetention: archive
    # 2026-05-26: lowered 3 → 2 to hold at most 2 papers in flight at any time,
    # aligned with app.research.narration-concurrency-cap=2. With backlog==cap the
    # narration slot never queues, so no paper waits (or risks the 10-min
    # reaper) behind the throttle.
    maxDraftBacklog: 2
    peerReviewEnabled: true
  ai:
    enabled: true
    # Run-scoped LLM budget. Default OFF (today's behaviour). When enabled, the
    # app tracks calls / input tokens / output tokens / $cost per provider and
    # globally ($cost from the per-model lookup in llm-pricing.yml). Behaviour:
    #   - a per-provider cap reached  → that provider is dropped from routing
    #   - a GLOBAL ceiling reached, OR every provider in use is exhausted
    #                                  → the app terminates (exit code 42)
    # Each cap is active only when > 0 (0 / negative = unlimited). NOTE: an
    # uncapped provider (e.g. the free OpenRouter mirror) never exhausts, so to
    # bound the whole run set a global ceiling or cap every provider.
    # See BudgetProperties / RunBudgetTracker.
    budget:
      enabled: true
      report-interval-ms: 300000   # RunBudgetReporter heartbeat (per-provider + global spend)
      # Overall run budget: $5 (global ceiling = the hard total stop). Per-
      # provider $ caps live alongside each pool under
      # app.ai.providers.<name>.budget (merged into BudgetProperties at startup).
      # They are INDEPENDENT per-slot ceilings ("max any one provider may spend")
      # and intentionally over-subscribe the $5 total: every slot — including
      # currently-free ones — carries a $ cap (assume-paid prep) so it's bounded
      # the moment it migrates to a paid model. Where a paid price exists, token
      # caps are derived from llm-pricing.yml (~50/50 in:out split); the $ cap is
      # the precise control.
      global:
        max-cost-usd: 5.00              # 2026-07-21 — $5 hard cap with a $2.80 cost reserve keeps the cost-drain point at $2.20 while providing more aggregate closeout headroom. This is not per-paper escrow: optional work can still consume the shared reserve. 2026-06-06 temporarily trimmed $5 → $3.50 after cost-bound runs; the latest run reached $2.40 in only 42 calls, confirming calls were not the limiter.
        # 2026-05-25 — hard cap on total dispatched LLM calls per run, as an
        # additional runaway-loop safeguard alongside the $5 ceiling. Counted
        # in RunBudgetTracker.recordCall (pre-call, all providers); reaching it
        # stops the app (exit 42). 0 = unlimited. Raise if a normal paper-review
        # run legitimately needs more than this. 2026-05-25: bumped 100→300 —
        # the prior run hit the 100 cap mid-batch (calls=100/100) while the $10
        # cost ceiling was barely touched ($0.39), so calls was the wrong limiter.
        # 2026-05-27: 300 → 1000 for Phase 29 best-of-N (~2× calls/paper at
        # candidates=3, screen-top-m=2). 2026-05-28: 1000 → 500 — the $5 cost
        # ceiling binds well before calls do (best-of-N ~doubles $/paper), so the
        # 1000 cap was never the limiter; 500 is a tighter runaway-loop safeguard.
        # Raise max-cost-usd too if more volume is needed.
        max-calls: 350   # 2026-06-06 — trimmed 30% with the $ cap (cost binds first in practice); call-drain derives to 290. (2026-06-10: temporary 2× volume bump reverted — see max-cost-usd note.)
        # 2026-06-05 — graceful drain (RunBudgetTracker). The threshold is DERIVED:
        # drain starts at max-calls − drain-reserve-calls (here 350−60=290), so
        # raising max-calls moves it automatically. At the threshold the run stops
        # STARTING new research cycles; in-flight papers finish on the reserve and
        # the app exits cleanly (same exit 42) when the draft queue empties —
        # max-calls stays the hard backstop. The reserve is absolute (not a
        # fraction): its job is "finish the in-flight papers" (~2 pipelines ≈ 60
        # calls), which doesn't scale with budget size. drain-start-calls (absolute)
        # overrides the derivation when set; reserve 0 disables the drain.
        # Motivation: the 06-05 07:17 hard stop killed P-b72c-140/141 in flight —
        # the first two papers ever to compute beyond-sieve values.
        drain-reserve-calls: 60
        # 2026-06-05 — cost-dimension drain reserve, symmetric with the call reserve:
        # drain starts at max-cost-usd − this (here $5.00 − $2.80 = $2.20). Added after
        # the 19:59 session ended on the $5 ceiling at only 326/500 calls — richer
        # 20-scalar prompts + metered openrouter made COST the binding dimension and
        # the call-only drain never engaged (P-b72c-183/184 hard-killed in flight).
        # 2026-06-05 21:34 measurement: $0.50 bought ~6 min of in-flight burn (~$0.09/min) and
        # the hard cap preempted quiescence (no losses, by 17s of luck). $1.00 ≈ 11 min covers
        # a full fresh pipeline comfortably. 0 = off.
        # 2026-07-21 — preserve the $2.20 drain point while raising the hard cap from $3.50 to
        # $5.00: reserve rises from $1.30 to $2.80. The reserve is aggregate closeout headroom,
        # not a completion guarantee; optional work needs separate credit-gating before it can be
        # treated as per-paper protection.
        drain-reserve-cost-usd: 2.80
        max-input-tokens: 0
        max-output-tokens: 0
    # Phase 7 E2 — opt-in list of providers allowed to receive tool-calling professor-stage
    # calls. Default "groq" matches the spec: non-Groq pool tool calls must be explicitly
    # whitelisted by the operator after the ≥3-day E1 soak demonstrates they're stable
    # (no startup errors, no quota anomalies in /tmp/et-app.log). Acceptance test: with
    # Groq manually exhausted, a paper completes prof:nvidia:ok / prof:openrouter:ok /
    # prof:cerebras:ok depending on which providers are in this list.
    # Set to "*" to allow every supportsTools pool in the primary chain (legacy behaviour).
    # To opt in after the soak: tool-calling.providers: "groq,nvidia,openrouter,cerebras"
    # Phase 9 follow-on (2026-05-14) — opened to all 4 providers. The
    # PrimaryModelRegistry walks every available 70B+ tool-capable model across
    # Groq, NVIDIA, OpenRouter, Cerebras; the professor stage no longer
    # routes "Groq first then nothing" when Groq's TPD is exhausted. The
    # soak period for non-Groq tool calls completed on 2026-05-14 with
    # Phase 9 U3b's registry-backed routing.
    tool-calling:
      # 2026-05-22 paper-review — nvidia removed (provider disabled above).
      # 2026-05-23 — cerebras removed (0 calls last run; provider disabled).
      # Restore "nvidia," / "cerebras," if/when their legacy blocks flip enabled: true.
      # The local AI gateway translates these application-owned tool calls to
      # a constrained JSON tool plan, then ET executes the Java tool and sends
      # the result back for synthesis. OpenRouter remains the provider fallback
      # when the gateway is unavailable or rate-limited.
      providers: "local-ai,openrouter,groq"
    # Global primary routing order (provider keys, CSV) — first match in the bean
    # registry wins when building the primary chain and sorting the model registry.
    # Externalized from LlmRouter on 2026-05-24 so no provider name is baked into
    # the routing policy; blank / missing falls back to registry/bean order (any
    # available pool). Per-role reordering layers on top of this (role-overrides).
    # The local AI gateway is the first primary provider. OpenRouter and Groq
    # provide normal API fallbacks.
    primaryProviderOrder: "local-ai,openrouter,groq"
    # Fast-tier pool key — low-stakes / audit calls route here (router.callFast /
    # streamFast). Externalized from LlmRouter on 2026-05-24; blank / missing falls
    # back to the first non-primary pool, then the primary pool.
    fastProvider: "openrouter"   # 2026-05-29: fast tier (router.callFast/streamFast — low-stakes/audit calls) routed to the OpenRouter frontier pool (deepseek-v4-pro / grok-4.20 / gpt-5.4) for now. NOTE: premium $/token for fast traffic — switch to a dedicated cheap fast pool (openrouter-fast, fast-tier:true) later. Was "ollama".
    # Phase 20.5 — per-role override layer on top of the global primaryProviderOrder.
    # Empty section (default) reproduces today's behavior exactly. Each role key
    # is a free-form string that call sites pass to LlmCallContext.withRole(...);
    # the current roles tagged in ResearchNarrationService are:
    #   - "narration"        — first-pass narration stream (router.streamPrimary)
    #   - "professor-tools"  — tool-calling critique-and-revise loop
    #                          (router.callPrimaryWithTools)
    # Sub-keys (both optional, both empty by default):
    #   - preferred-providers — provider keys in priority order; handles whose
    #                          providerKey appears here sort to the front.
    #   - avoid-models        — full reviewerIds (provider/model) excluded for
    #                          this role.
    # Example (commented; uncomment + edit to activate):
    # role-overrides:
    #   fast-audit:
    #     preferred-providers: [cerebras, groq, ollama]
    #   professor-tools:
    #     preferred-providers: [groq, cerebras, nvidia]
    #     avoid-models: [groq/llama-3.3-70b-versatile]   # 2026-05-18 daily-quota incident
    # Phase 20.3 — cache the tools JSON spec across tool-loop rounds so
    # rounds 2..N don't re-pay ~2-4 KB of redundant schema tokens. OFF by
    # default until per-provider tool-stickiness behavior is verified
    # (Groq's OpenAI-compat documents sticky tools across a conversation;
    # Cerebras / NVIDIA should be checked before flipping). If a model
    # starts hallucinating tool names mid-conversation, raise the cadence
    # (more frequent re-sends) or set enabled=false.
    cached-tool-schema:
      enabled: false
      refresh-cadence: 3        # when enabled, force-resend every Nth round (0 = never re-send)
    # Phase 20.1 — condense older role=tool messages in the in-flight
    # conversation history. The freshest tool result stays raw; older
    # ones get truncated to first head-chars + marker + last tail-chars
    # when their content exceeds threshold-chars. Persisted trace
    # (LlmTraceWriter) is unaffected — only the next round's payload
    # changes. OFF by default until the next REVIEW_REPORT refresh
    # confirms Phase 18.1's trace-scan validator isn't reading the
    # compressed in-flight messages (it shouldn't — it reads the
    # persisted trace — but verify before flipping).
    tool-result-compression:
      enabled: false
      threshold-chars: 1024
      head-chars: 500
      tail-chars: 200
    # Phase 20.2 — tag-level history compaction. Two stages: (1) truncate
    # old message content to first 200 + marker + last 50 when content
    # > 256 chars, keeping the most recent keep-recent messages intact;
    # (2) drop oldest non-system messages if still over budget. Pull when
    # a real paper fails at MAX_TOOL_ROUNDS for context-window pressure.
    # OFF by default — speculative until a real failure drives demand.
    conversation-compaction:
      enabled: false
      target-chars: 24000       # ~70% of an 8K-context window in chars
      keep-recent: 2
    # Phase 20.11 — generic OpenAI-compat pool: declarative provider
    # registration. Each entry under providers: registers a GenericOpenAICompatPool
    # bean visible to PrimaryModelRegistry / LlmRouter. Adding a new provider
    # is config-only — no Java code, no rebuild. Empty section (default)
    # leaves the registrar dormant.
    #
    # Per-provider keys:
    #   base-url            HTTPS base ending at /v1 (no trailing slash).
    #   api-key-env         env var holding the bearer token.
    #   models              static model id list (use OR models-discovery-path).
    #   models-discovery-path  GET path returning {data:[{id}]} list (TBD).
    #   supports-tools      boolean; pool exposes tool-call API when true.
    #                       NOTE step 1+2: pool's supportsTools() is hardcoded
    #                       to false until the tool-call follow-up commit lands.
    #   context-window      advisory; informs the per-pool token cap.
    #   max-tokens-field    response cap field name; "max_tokens" default;
    #                       Anthropic uses "max_completion_tokens".
    #   retry-after-source  HEADER (standard) or BODY (Groq-style error JSON).
    #   parallelism         concurrent slots; default 3.
    #
    # Example future providers (commented; uncomment + edit + restart to activate):
    # providers:
    #   anthropic:
    #     base-url: https://api.anthropic.com/v1
    #     api-key-env: ANTHROPIC_API_KEY
    #     models: [claude-opus-4-7, claude-sonnet-4-6, claude-haiku-4-5]
    #     supports-tools: true
    #     context-window: 200000
    #     max-tokens-field: max_completion_tokens
    #     retry-after-source: HEADER
    #   deepseek:
    #     base-url: https://api.deepseek.com/v1
    #     api-key-env: DEEPSEEK_API_KEY
    #     models: [deepseek-chat]
    #     supports-tools: true
    #
    # Phase 20.11 §migration COMPLETE — each provider is defined solely by its
    # entry below; the legacy hand-written *Pool classes and app.ai.<pool>.*
    # named blocks were deleted in step 2b. API keys resolve from api-key-env;
    # per-provider budget/rate caps live inline (merged into Budget/
    # TokenBudgetProperties at startup).
    providers:
      # Local compatible AI gateway; see docs/subscription-providers.md.
      local-ai:
        base-url: http://127.0.0.1:8788/v1
        api-key: local-ai-gateway
        models: [local-ai]
        supports-tools: true
        context-window: 200000
        max-output-tokens: 8000
        parallelism: 2
        retry-after-source: HEADER
      openrouter:
        base-url: https://openrouter.ai/api/v1
        api-key-env: OPENROUTER_API_KEY
        # 2026-05-22 paper-review — nvidia/nemotron-3-super-120b-a12b:free
        # removed. The :free tier is a zero-cost mirror of nemotron-3 hosted
        # on NVIDIA; same 0/9 publish-rate quality issue, no reason to keep
        # it on the panel even at $0 cost.
        # 2026-05-26 — paid frontier slot (promoted above groq). Three
        # tool-capable frontier models, cheapest-frontier first so most fallback
        # traffic hits best value and the premium model is a deeper fallback.
        # IDs transcribed from the OpenRouter API on 2026-05-26 —
        # VERIFY exact ids at https://openrouter.ai/models before relying on
        # them; a wrong id silently drops the model from the pool. Prices live
        # in llm-pricing.yml (openrouter:) and must match.
        models:
          - deepseek/deepseek-v4-pro
          - x-ai/grok-4.20
          - openai/gpt-5.4
        supports-tools: true
        # Lever 1 — OpenRouter forwards response_format:json_schema to the
        # underlying provider (best-effort per model). Dormant until a caller
        # sets a schema (narration.structured-output.enabled /
        # review-panel.tool-call-schema.enabled); the pool degrades to
        # json_object on any model that ignores it. Our schemas use no enums
        # (x-ai/grok rejects '/'-in-enum), so they're grok-safe.
        supports-json-schema: true
        context-window: 32000
        max-output-tokens: 2000   # reasoning models — 2000 gives chain-of-thought headroom
        parallelism: 2
        extra-headers:
          HTTP-Referer: https://github.com/umesh-prabakar-hpp/EmergentTerrain
          X-Title: EmergentTerrain
        excluded-backends: [Venice]    # Venice has a global free-tier cap
        rate:                    # TPM/TPD — merged into TokenBudgetProperties at startup
          daily-limit: 500000           # ~70% of the ~200 req/day × 3500 tok cap
          minute-limit: 175000          # ≈50 RPM × 3500 tok/call
        budget:                  # run-scoped $ cap — merged into BudgetProperties at startup
          # Assume-paid prep: dormant while the free mirror is in use ($0 spend
          # → never reached), but in place for when this slot migrates to a paid
          # model (add its price to llm-pricing.yml then; token caps derive from
          # it at that point). Independent per-slot ceiling; global $5 is the total stop.
          max-cost-usd: 4.00            # primary-tier ceiling (matches groq); was $8
    # Groq primary + fast tiers (models pre-ranked, highest-quality first).
      groq:
        # 2026-05-29 — Groq disabled (default OFF). With Ollama also dormant,
        # the primary tier is Codex + OpenRouter, and the fast
        # tier (FastModelRegistry now empty) falls through to the legacy
        # fastPool = OpenRouter (app.ai.fastProvider). Config block preserved;
        # set enabled: true to bring Groq back into the primary chain.
        enabled: false
        base-url: https://api.groq.com/openai/v1
        api-key-env: GROQ_API_KEY
        models:
          # Pre-ranked: highest-quality first. Legacy Borda+Ollama
          # tournament that produced this order at startup is now
          # operator-curated.
          - llama-3.3-70b-versatile
          - openai/gpt-oss-120b
        supports-tools: true
        # Lever 1 — Groq supports structured outputs (response_format:
        # json_schema, strict) on these models. Dormant until a caller sets a
        # schema via the feature flags; emission is also gated by this flag in
        # the pool, so flag-off behaviour is byte-identical to today.
        supports-json-schema: true
        context-window: 32000
        max-output-tokens: 2000
        parallelism: 3
        retry-after-source: BODY            # Groq's distinctive quirk
        long-block-body-markers: ["tokens per day", "TPD"]
        long-block-ms: 3600000              # 1h, matches recordGroqRateLimitBlock TPD default
        budget:                  # run-scoped $ caps — merged into BudgetProperties at startup
          max-cost-usd: 4.00            # $4 share of the $5 global ceiling
          max-input-tokens: 3400000     # ~$2 ÷ $0.59/Mtok
          max-output-tokens: 2500000    # ~$2 ÷ $0.79/Mtok
        rate:                    # TPM/TPD — merged into TokenBudgetProperties for TpmBudgetGate/SimulationGate
          daily-limit: 270000           # 90% of Groq's aggregate daily cap
          minute-limit: 8000            # observed TPM rate-limit
      fast:
        # Fast-tier pool (Groq-hosted small models). Picked up by
        # FastModelRegistry via fastTierModelIds() (Groq parity); skipped
        # by PrimaryModelRegistry because supports-tools: false.
        # 2026-05-29 — disabled alongside the groq primary pool (it is also
        # Groq-hosted). With this off and Ollama dormant, FastModelRegistry is
        # empty, so callFast/streamFast fall through to the OpenRouter legacy
        # fastPool. Re-enable (enabled: true) to restore the Groq fast tier
        # independently of the primary pool.
        enabled: false
        base-url: https://api.groq.com/openai/v1
        api-key-env: GROQ_API_KEY
        models:
          - llama-3.1-8b-instant
          - allam-2-7b
          - meta-llama/llama-4-scout-17b-16e-instruct
        supports-tools: false               # excluded from PrimaryModelRegistry
        fast-tier: true                     # included in FastModelRegistry
        role: fast-audit
        context-window: 32000
        # allam-2-7b caps max_tokens at 4096; llama-4-scout at 8192. 2000
        # stays well under both and matches the legacy fast-tier maxTokens.
        max-output-tokens: 2000
        parallelism: 3
        retry-after-source: BODY
        long-block-body-markers: ["tokens per day", "TPD"]
        long-block-ms: 3600000
        budget:                  # run-scoped $ caps — merged into BudgetProperties at startup
          max-cost-usd: 1.00            # $1 share of the $5 global ceiling
          max-input-tokens: 10000000    # ~$0.50 ÷ $0.05/Mtok
          max-output-tokens: 6250000    # ~$0.50 ÷ $0.08/Mtok
        # no rate: block — fast tier is unmetered for TPM/TPD (absent = unlimited)
    # Phase 9 U5 — startup selection tests for every configured model on every
    # pool (primary + fast). Three probes per tool-capable model: chat ("reply
    # with OK"), JSON-mode ("return JSON with name=Euler, value=2.71828,
    # good=true"), tool-call (one-arg get_value(key=pi) probe). Two probes for
    # non-tool pools (Ollama). Models that fail any probe drop from activeModels
    # at startup with a WARN log line; passes log INFO with per-probe latency.
    #
    # No timeout drops per operator direction 2026-05-15 — slow models pass if
    # they eventually return a valid response. Failures look like HTTP error,
    # non-JSON response, missing fields, or wrong tool-call shape.
    selection-tests:
      enabled: true
      # Phase 9 follow-on (2026-05-14) — interval at which ModelRetestService
      # re-probes models that failed initial selection. Surfaces dropped models
      # for transient causes (NVIDIA's intermittent 503 ResourceExhausted,
      # OpenRouter backend hiccups, etc.) — a passing re-probe moves the model
      # back into activeModels and the registries pick it up immediately.
      # Floor: 10 min (re-tests burn provider quota; tighter would thrash).
      retestIntervalMinutes: 15
    # Phase 9 follow-on (2026-05-14) — per-request HTTP read timeout for every
    # primary pool's chat-completions calls. 7 minutes is long enough for slow
    # reasoning models generating long responses but short enough to fall through
    # on a true hang. The 30s timeout on GroqPool's /models GET is separate.
    http:
      requestTimeoutSeconds: 420   # global default (now honored by GenericPoolsRegistrar)
      # 2026-05-25 — per-provider overrides. The peer-review panel runs reviewers
      # sequentially on groq/openrouter; a slow/congested reviewer call previously
      # hung up to the 420s cap, so a draft sat ~7 min in the panel and was reaped
      # at the 10-min stuck-draft TTL (1 paper of ~7). Cap those providers tight so
      # a slow reviewer fails fast and the panel degrades-and-proceeds.
      provider-timeout-seconds:
        local-ai: 1000
        groq: 120
        openrouter: 120
    digestCooldownMinutes: 10
    advisorCooldownSeconds: 15
    explanationCooldownMs: 2500
    hintAcceptanceRate: 0.6
    # 2026-06-05 — per-room policy-consultation cooldown. Without it, consultations fired on
    # every government change (~every 20-40s), consuming ~20-30% of each 500-call session
    # budget — civic chatter competing with papers all session (and 33 of the 60-call drain
    # reserve in the 06-05 post-mortem, since fixed separately by the drain gate). 120s caps
    # the rate at ~15-20/session, freeing roughly two papers' worth of budget. 0 = legacy
    # (no cooldown). Rollback: 0.
    policyConsultCooldownSeconds: 120
    # Phase 9 U4 — Ollama config migrated to the unified app.ai.ollama.* namespace.
    # The previous app.ai.backendHosts / app.ai.backendPort / app.ai.backendParallelism
    # keys and the Spring AI auto-config keys (spring.ai.ollama.chat.*) are still
    # read as fallback for one release cycle; OllamaPool logs a deprecation WARN at
    # startup if any legacy key is present.
    #
    # preferredModels: CSV of Ollama model names. The pool creates one Backend per
    # (host, model) tuple — a single host running gemma3:4b + qwen2:7b becomes two
    # Backend instances. callSyncOnModel(modelId, ...) targets a specific model;
    # callSync(...) keeps legacy "first model wins" behaviour for back-compat.
    ollama:
      # 2026-05-29 — per-provider kill switch (default OFF). Ollama calls run
      # ~20-32s each (generation-bound), so the provider is now dormant and
      # OpenRouter (app.ai.fastProvider) carries the fast tier. The OllamaPool
      # bean only loads when BOTH app.ai.enabled AND this flag are "true"; set
      # to true (or OLLAMA, via env) to opt it back in — it rejoins
      # FastModelRegistry automatically. The host/model config below is kept so
      # re-enabling is a one-line flip.
      enabled: false
      # localhost removed 2026-05-24: local ollama (gemma3:4b, ~2GB RSS) drove
      # this box into SystemResourcesGate CRITICAL pauses; cloud providers
      # (groq/openrouter) cover the tiers now. Remote 192.168.1.145 kept;
      # add localhost back via OLLAMA_HOSTS=localhost,192.168.1.145 if needed.
      backendHosts: ${OLLAMA_HOSTS:192.168.1.145}
      backendPort: 11434
      # Max concurrent requests per backend — must match OLLAMA_NUM_PARALLEL on each Ollama instance.
      backendParallelism: 3
      preferredModels: "gemma3:4b"
      temperature: 0.7
      maxTokens: 200

  # All research flags enabled on 2026-05-13. Phases ship chronologically;
  # later phases sometimes depend on earlier ones being on (Phase 5 C2 needs
  # programs.enabled; Phase 4b auto-staking needs markets.enabled; etc.).
  research:
    # Append-only high-water ledger for every allocated draft ID, including drafts
    # suppressed before publication. It is outside `research/` because that output
    # is archived/reset between runs; do not point it at a disposable run directory.
    paper-id-ledger:
      dir: simulation-history/research-paper-ids
    conjecture-consumption-audit:
      # Phase 42 queue-consumption evidence only. The legacy cycle writes an idempotent event
      # after it marks a source investigated. When enabled, the context endpoint exposes only a
      # bounded post-consumption audit window; this never selects, routes, or mutates a queue.
      enabled: false
      journal-root: simulation-history/research-queue-consumption
    experiments:
      range-chunking:
        # Phase 36: every count-weighted density CONSTANT ladder window retains its exact logical
        # [start,end) request but executes/resumes as 50k chunks. Keep the Julia 15s fail-soft
        # deadline; telemetry distinguishes actual queue, sidecar compute, and transport before changing it.
        enabled: true
        chunk-size: 50000
    # Stuck-draft watchdog (ResearchCycleService). The draft backlog gates new
    # research cycles (maxDraftBacklog). A narration task that hangs/throws before
    # publishPaper would otherwise pin its slot forever and dead-lock all research
    # once the backlog fills (observed 2026-05-25: 3 drafts hung post-audit, zero
    # new cycles for 25+ min). The task's finally releases on normal/exception exit;
    # this reaper reclaims true hangs whose finally never runs.
    # 2026-05-27 600000 → 1320000 (22 min). Phase 29 best-of-N (candidates=3,
    # eval-cascade screen-top-m=2) runs the expensive finishCandidate half
    # (professor tools + panel) 2× per paper plus 3 first-passes, all inside the
    # narration bracket. Measured per-paper budget ~14 min median / ~18 min worst
    # (professor loop alone hit 329s; refinement spiked to 147s once). Reaper TTL
    # stays above narrationTimeoutMs so the timeout fires first.
    # 2026-05-28 1320000 → 2880000 (22 → 48 min): kept above the narration
    # timeout so the narration timeout still fires first. 2026-07-17: 2880000
    # → 6000000 (48 → 100 min), retaining a 10-min margin above the new 90-min
    # narration deadline for long Phase 34 FTS-backed professor/tool cascades.
    stuckDraftTtlMs: 6000000  # reclaim a draft in-flight longer than 100 min
    stuckDraftScanMs: 60000   # reaper sweep cadence
    # Hard-budget shutdown reconciliation. A normal drain stops only after the
    # in-flight queue reaches zero; a hard cap waits this bounded interval before
    # recording each remaining ID/phase as an intentional suppression. It then
    # closes the publication gate before Spring may tear down JPA/Hikari, avoiding
    # a commit racing a closed datasource. If the gate cannot close in its own
    # bounded interval, the process exits fail-closed without context teardown.
    shutdown-reconciliation:
      timeout-ms: 30000
      publication-lock-ms: 5000
    # Wall-clock cap for one narration task (refinement→first-pass→audit→professor
    # tools→panel). With Phase 29 best-of-N this now wraps N first-passes + M
    # finishCandidate halves (see §29.1.2). Measured ~14 min median / ~18 min
    # worst at candidates=3, screen-top-m=2 — set to 18 min to cover the variance.
    # Fires below the reaper TTL and INTERRUPTS the hung call (reaper only frees
    # the slot). Lower it (or drop best-of-n.candidates) once professor latency is
    # healthier. 0 would disable (not recommended).
    # 2026-05-27 420000 → 1080000 (7 → 18 min) for best-of-N — was abandoning
    # 100% of best-of-N papers at 7 min (P-a328-981/982 timed out, 0 published).
    # 2026-07-17 2400000 → 5400000 (40 → 90 min): a live best-of-N run had one
    # FTS-backed paper publish just before 40 min while a second missed the deadline
    # during its final candidate. The reaper remains 10 min higher. Phase 35 still
    # targets bounded, efficient FTS retrieval; this larger cap is not that fix.
    # NOTE: cancel(true) does not currently stop a hung worker (REVIEW_REPORT rec 2),
    # so until that's fixed this cap mainly frees the slot + salvages a first-pass.
    narrationTimeoutMs: 5400000  # 90 min; < stuckDraftTtlMs so it fires first
    # rec #8 (research/a3289005 batch-3) — when a narration STILL hits
    # narrationTimeoutMs, publish its already-produced first-pass (stamped
    # critique:skip:incomplete_firstpass → NEEDS_REVISION) instead of abandoning
    # the paper for the reaper. The 18-min extension above cut the timeout rate
    # but a paper that still overruns was discarded with its content; this salvages
    # it. An atomic checkpoint-map remove() guarantees exactly one publish vs. the
    # worker's normal path. 2026-05-28 false → true (operator-directed; see
    # phase-flags.md "Recently flipped — a3289005 batch-3"). Rollback: flip to
    # false (next timed-out paper reverts to abandon).
    narration-firstpass-checkpoint:
      enabled: true
    # Caps how many papers narrate in parallel. Narration slots default to the
    # primary LLM pool size (one per primary model), but that can outrun the
    # most-constrained provider's TPM ceiling (Groq: 12k on llama-3.3-70b, 8k on
    # gpt-oss-120b). When parallel narrations exceed that floor the batch starves:
    # budget_fallback chains exhaust and papers publish with empty traces or hit
    # narrationTimeoutMs (2026-05-26: 7 papers lost, 955-964). Set to 1-2 to
    # serialize against the TPM floor. 0 = no cap (historical pool-sized default).
    # The permit is acquired BEFORE the narrationTimeoutMs wall-clock starts, so
    # queueing for a slot at a low cap does NOT consume the per-paper budget — a
    # throttled paper simply waits its turn rather than being abandoned. Under
    # sustained overload the 10-min stuck-draft reaper (stuckDraftTtlMs) is the
    # only backstop for a paper parked in the slot queue.
    #
    # Set to 2 (down from the pool-sized default of 4 = primaryPoolSize). The
    # contention only bites on the Groq fallback path (per-call ~6-8k tokens vs
    # 12k TPM on llama-3.3-70b, 8k on gpt-oss-120b): 4 concurrent narrations
    # overshot the limit and starved 7 papers on 2026-05-26; 2 keeps demand near
    # one model's ceiling while retaining 2x serial throughput. Drop to 1 if the
    # log still shows recurring `pre-debit budget exceeded` / 429 once the
    # primary is spilling to Groq; raise back toward 4 when
    # the primary is healthy and Groq isn't on the critical path.
    narration-concurrency-cap: 2
    # ── Phase 1 — identity + graph + programs ──
    programs:
      enabled: true        # Phase 1 Iter 4 — longitudinal research programs (also a hard dep for C2 dispute-reconciliation)
    # ── Phase 2 — surprise + planner ──
    planner:
      enabled: true        # Phase 2 Iter 5 — algorithmic experiment plans (4 strategies)
    # ── Phase 3 — world + institutions + markets ──
    institutions:
      enabled: true        # Phase 3 Iter 8 — universities / journals / funding / council bootstrap
    markets:
      enabled: true        # Phase 3 Iter 7 — reputation-staked prediction markets
    world-intervention:
      enabled: true        # Phase 3 Iter 6 write side — bots file GovernmentBills via WorldInterventionService
    # ── Phase 4 — formal findings + meta-science ──
    findings:
      enabled: true        # Phase 4 Iter 9 — FormalFinding persistence + KnowledgeBaseService
    meta:
      enabled: true        # Phase 4 Iter 10 — MetaResearchService self-observation stats
    # ── Phase 4b — meta-science evolution targets ──
    reviewer-routing:
      enabled: true        # Phase 4b — adversarial reviewer picking by topic-weight orthogonality
    funding-allocation:
      enabled: true        # Phase 4b — periodic grants from FundingAgency → University
    journal-review:
      enabled: true        # Phase 4b — reviewers drawn from journal editor pool
    impact-factor:
      enabled: true        # Phase 4b — Journal.impactFactor recomputed from citation counts
    replication-council:
      enabled: true        # Phase 4b — CONTRADICTS citations force replication; pairs naturally with Phase 5 C2
    auto-staking:
      enabled: true        # Phase 4b — same-domain bots auto-stake on open markets (needs markets.enabled)
    dominant-methodology:
      enabled: true        # Phase 4b — University.dominantMethodology emerges from member modes
      reputation-weighted: true  # Phase 4b refinement — bot reputation weights the methodology count
    surprise-broadcast:
      enabled: true        # Phase 4b — per-room cross-bot surprise fan-out (rate-limited)
    exploration-tuning:
      enabled: true        # Phase 4b — per-room z-threshold + EXPLORATION trigger auto-tune
    theory-composition:
      enabled: true        # Phase 4b — A~f(B) ^ B~g(C) chains emit derived ProgramOpenQuestions (needs findings.enabled)
    # ── Phase 5 — quality pipeline ──
    truncation-guard:
      enabled: true        # Phase 5 A1 — mid-sentence papers publish as NEEDS_REVISION
    harness-leak-filter:
      enabled: true        # Phase 5 A4 — strip simulator-coord phrases from prose
    numerical-consistency:
      enabled: true        # Phase 5 B1 — catch "close to N×" with no nearby observed; hypothesis-vs-conclusion range mismatch
      # Phase 12 D2 — promotion mode.
      #   warn      — publish as REJECTED on disk (today's behaviour, default for rollout).
      #   downgrade — publish as NULL_RESULT with an honest preamble naming
      #               the unverifiable values; same persistence path, different
      #               status + prose.
      #   suppress  — paper is dropped entirely before addPaper (no disk, no DB);
      #               operational log carries `numeric_inconsistent→suppressed`.
      # 2026-05-18 warn → downgrade. FP fixes in commit f6b89b9 now in main;
      # operator-flipped per phase-flags.md D2 row despite the post-restart
      # FP-rate re-check not yet observed in a refresh. Rollback: revert this
      # line and restart.
      mode: downgrade
    verdict-grounding:
      enabled: true        # REVIEW_REPORT b72c4e10 batch 1 rec #1 — downgrade verify_conjecture papers whose prose hedges/reverses the margin-sign convention the tool states inline
    # measurement-frame-default.md (tag claim-type-shift) Stage 1 — the CLAIM-TYPE lever. For an object
    # with a registered intrinsic asymptotic (ScalarOpenness.MEASUREMENT_FRAMES), frame the investigation
    # as the MEASUREMENT (verify_constant/oscillation/growth — the >0.4-novelty claim) instead of the
    # default affine-bound proxy-wrapper (~0.22). Frame-only; seeding unchanged. ON for the A/B — watch
    # whether open registry objects (dirichlet_error, omega_Omega_gap, …) score novelty >0.4 consistently;
    # if only dirichlet clears, novelty is supply-limited → pivot to segmented-sieve reach. Rollback: false.
    measurement-frame-default:
      enabled: true
    magnitude-range:
      enabled: true        # Phase 5 B2 — per-(domain, topic) physical bounds (composite ≤ 3 GPa, Arrhenius ≤ 12×, …)
    dedup:
      enabled: true        # Phase 5 B3 — uncited near-clones publish as NEEDS_REVISION
    cross-domain-gate:
      enabled: true        # Phase 5 B4 — MATHEMATICS bots drifting into materials prose flagged; INTERDISCIPLINARY exempt
    dispute-reconciliation:
      enabled: true        # Phase 5 C2 — DISPUTED papers queue reconciliation questions
    citation-aware-scoring:
      enabled: true        # Phase 5 C1 — +0.02 / −0.04 per high-quality / critique-skip citation
    audit-physical-mechanism-rejects:
      enabled: true        # Phase 7 G8 — SUPPORTED papers carrying audit-4b physical_mechanism gap publish as REJECTED
    # ── Phase 6 — novelty levers ──
    literature-search:
      enabled: true        # Phase 6 D1.3 — professor stage sees curated literature block
    # Phase 32 §32.5 step 1 (2026-07-04) — OpenAlex client + daily credit ledger (addendum A
    # substrate; dormant — no runtime consumer until §32.5 step 4 wires the grounding caller).
    # Key via the secrets-file convention: add OPENALEX_API_KEY to ~/.emergentterrain/secrets.enc
    # (free key at openalex.org/settings/api → $1/day allowance; BLANK also works on the anonymous
    # ~$0.10/day tier). Ceiling defaults to half the free keyed tier so an unattended room can
    # never incur billable spend. The offline corpus builder (scripts/build-nt-corpus.sh) reads
    # env vars directly and does not need this flag.
    literature:
      openalex:
        # Timeout-recovery uses this client asynchronously to discover possible
        # open-access backfill targets. Its results remain non-evidentiary until
        # an offline import puts full text in the local Phase 34 index.
        enabled: true
        api-key: ${OPENALEX_API_KEY:}
        mailto: ${OPENALEX_MAILTO:}
        daily-credit-ceiling: 0.50
        state-dir: ${user.home}/.emergentterrain/corpus-nt
      # A Phase 35 timeout holds its paper before publication and journals the
      # exact semantic request. The worker may query OpenAlex only to write
      # non-evidentiary backfill candidates, then waits for an operator's
      # offline immutable-index refresh before re-running normal local search.
      timeout-recovery:
        enabled: true
        state-dir: simulation-history/research-literature-recovery
        max-discovery-attempts: 3
        max-queue-size: 100
        poll-interval-ms: 60000
      # Phase 32 §32.5 step 4 (2026-07-04) — search_literature grounding mode. When true, the
      # tool routes qualifying papers (promotion-track + measurement-frame/priority-target
      # conjecture topics) to the py-sidecar's offline BM25 corpus (/ground/claim, port 8089;
      # requires the corpus at ~/.emergentterrain/corpus-nt + a py-sidecar restart to index it).
      # EVIDENCE → cite-only-provided-keys with support/contradict assessment; SILENT → the
      # honest no-references line UPGRADED to a positive novelty signal + near-miss context refs.
      # Failure-soft: sidecar down = curated-corpus fallback, never blocks a paper.
      # FLIPPED ON 2026-07-04 (operator) after the 20-claim probe set passed 20/20
      # (zero fabricated keys; threshold 0.27). Rollback: false = byte-identical.
      grounding:
        enabled: true
      # Phase 32 §32.5b (step 5, 2026-07-04) — panel novelty grounding: the reviewer prompt for a
      # qualifying paper gains the deterministic corpus verdict for the paper's core claim.
      # SILENT = positive novelty evidence (a real corpus was searched and lacks the claim — do
      # not floor novelty for "no literature comparison"); EVIDENCE = rediscovery cap + citation.
      # Requires grounding.enabled=true (the client bean) AND this flag, so the professor-side
      # grounding can burn in first. Failure-soft: sidecar down = prompt byte-identical.
      # FLIPPED ON 2026-07-04 (operator, together with grounding.enabled — both failure-soft
      # and probe-validated). Rollback: false = panel prompt byte-identical.
      panel-novelty-grounding:
        enabled: true
      # Phase 33 lane L (L2, 2026-07-06) — read_reference: the professor can READ the full text
      # of a work search_literature matched (open-access cores: 1,244 PDF + 654 ar5iv-HTML on
      # disk). EVIDENCE-gated in the tool description, hard cap 2 calls/paper in the executor,
      # chunked ≤~2k tokens Java-side (no sidecar, no index); PDF-tier output carries the
      # paraphrase-don't-quote caveat. Acceptance: a paper positions its result against a cited
      # work's ACTUAL content (theorem/constant/range), and the panel's novelty rationale cites
      # that positioning. Rollback: false.
      read-reference:
        enabled: true
      # Phase 34 — local SQLite/FTS5 literature index. Enabled by the operator on 2026-07-16
      # after the completed import wrote fulltext_fts_complete=true. It routes both
      # search_literature and read_reference through a read-only database connection. The fixed
      # real-claim acceptance suite remains a required rollout check; rollback: false.
      phase34-sqlite:
        enabled: true
        index-dir: ${user.home}/.emergentterrain/indexes/math-literature
        # Optional coarse routed primary shards. Build them OFFLINE with
        # build-hf-math-literature-shards.py, shadow-validate results/latency, then enable.
        # The router selects a few subject shards plus cross-list and applies one aggregate
        # deadline; it never fans a query out to every shard or compares raw FTS ranks.
        shards:
          enabled: true
          dir: ${user.home}/.emergentterrain/indexes/math-literature-shards
          parallelism: 3
        # Phase 35 — bounded, storage-backed FTS5 retrieval. Enabled by the operator on
        # 2026-07-17. false retains the former Phase 34 all-terms-then-OR query for rollback.
        # The per-search guard interrupts pathological FTS work before it can occupy both
        # narration slots; it is independent of the 90-minute narration deadline.
        phase35-retrieval:
          enabled: true
          search-timeout-ms: 15000
          # Search the highest-ranked tranche first, then retain the complete 512-result range
          # only when it has not produced evidence within the same fail-soft deadline.
          initial-candidates: 64
        # One bounded follow-up read when the professor trace has safe HF evidence but omitted
        # every read_reference call. It does not write a citation or relax the publication gate.
        # Rollback: false.
        deterministic-post-search-read:
          enabled: true
      # Small, incrementally populated SQLite/FTS5 index for hash-validated sources found by
      # paper review. Its matches are merged with the primary Phase 34 index under the same
      # planner, title-anchor, issued-key, read, and Related Work gates. Disabled until the
      # fixed acceptance tests are run against a real screened source.
      paper-review-screened:
        enabled: true
        index-dir: ${user.home}/.emergentterrain/indexes/math-literature-paper-review-screened
      # Phase 32 §32.5d — OEIS + DLMF domain-reference lookup tools (lookup_oeis / lookup_dlmf).
      # Dormant by default: the DomainRefClient bean (DomainRefsConfig) exists only when true, so
