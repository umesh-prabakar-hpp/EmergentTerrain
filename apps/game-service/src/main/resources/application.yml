      residualStructureEnabled: true   # 2026-06-03: flipped ON (non-retiring tier — logs candidates only). Rollback: false.
      # 2026-06-15 — Phase 30 G2 Stage 3+4: PROMOTE a residual-discovered lhs~rhs+z to a persisted
