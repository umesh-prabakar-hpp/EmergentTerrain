[package]
name = "emergent_terrain_gpu_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
bytemuck = { version = "1.23", features = ["derive"] }
chrono = "0.4"
pollster = "0.4"
prost = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "sync"] }
tokio-stream = "0.1"
toml = "0.8"
tonic = { version = "0.11", features = ["transport"] }
wgpu = "0.20"

[build-dependencies]
tonic-build = "0.11"
