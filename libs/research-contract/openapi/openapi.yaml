openapi: 3.1.0
info:
  title: EmergentTerrain Research API
  version: 1.0.0
  description: |
    Versioned game-to-research read contract. The game service retains the legacy
    /room/{roomId}/research paths while research is co-located; separate deployments
    use these /api/v1 paths exclusively.
paths:
  /api/v1/research/rooms/{roomId}/papers:
    get:
      operationId: listPublishedPapers
      parameters:
        - $ref: '#/components/parameters/roomId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: Most recently published papers first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResearchPaperSummary'
  /api/v1/research/rooms/{roomId}/stats:
    get:
      operationId: getResearchStats
      parameters:
        - $ref: '#/components/parameters/roomId'
      responses:
        '200':
          description: Aggregated research state for a room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchStats'
  /api/v1/game/rooms/{roomId}/research-context:
    get:
      operationId: getResearchGameContext
      security:
        - researchContextKey: []
      description: |
        Game-owned, read-only context for an autonomous research worker. The response is a
        snapshot; it never grants the research service authority to mutate game state.
      parameters:
        - $ref: '#/components/parameters/roomId'
      responses:
        '200':
          description: Most recent persisted government context for the room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchGameContext'
        '404':
          description: Room does not exist.
  /api/v1/research/work:
    post:
      operationId: submitResearchWork
      description: |
        Accepts a game-agnostic immutable work request into the research-owned durable queue.
        Replaying the same requestId is idempotent and returns the original receipt state.
      security:
        - researchWorkKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResearchWorkRequest'
      responses:
        '202':
          description: Work was durably accepted or an idempotent replay was acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchWorkReceipt'
        '401':
          description: Missing or invalid research-work credential.
  /api/v1/research/work/{requestId}:
    get:
      operationId: getResearchWorkStatus
      description: |
        Returns read-only, research-owned lifecycle and delivery status for reconciliation. It never
        returns request context, research result content, gameplay commands, or effect authority.
      security:
        - researchWorkKey: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Durable work lifecycle status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchWorkStatus'
        '401':
          description: Missing or invalid research-work credential.
        '404':
          description: No work item exists for the request id.
  /api/v1/game/research-results:
    post:
      operationId: projectResearchResult
      description: |
        Accepts only approved planning outcomes for the game's idempotent display-only projection.
        This endpoint rejects effect recommendations, gameplay mutations, and unapproved outcomes.
      security:
        - researchResultKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResearchResult'
      responses:
        '202':
          description: Result was accepted for idempotent display projection.
        '401':
          description: Missing or invalid research-result credential.
        '400':
          description: Result is outside the display-only projection policy.
components:
  securitySchemes:
    researchContextKey:
      type: apiKey
      in: header
      name: X-Research-Service-Key
    researchWorkKey:
      type: apiKey
      in: header
      name: X-Research-Work-Key
    researchResultKey:
      type: apiKey
      in: header
      name: X-Research-Result-Key
  parameters:
    roomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ResearchWorkRequest:
      type: object
      required: [requestId, workspaceId, workType, sourceRevision, requestedAt, subjects, contextSnapshot]
      properties:
        requestId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        workType: { type: string, minLength: 1 }
        sourceRevision: { type: integer, format: int64, minimum: 0 }
        requestedAt: { type: string, format: date-time }
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/ResearchSubject'
        contextSnapshot:
          type: object
          properties:
            draftSelection:
              $ref: '#/components/schemas/ResearchDraftSelectionInput'
          additionalProperties: true
    ResearchDraftSelectionInput:
      type: object
      required: [selectorVersion, selectionSeed, topicSelectionMode, candidates, executionIntent]
      properties:
        selectorVersion: { type: string, minLength: 1 }
        selectionSeed: { type: integer, format: int64 }
        topicSelectionMode: { type: string, enum: [WEIGHTED, UNIFORM] }
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ResearchDraftCandidate'
        executionIntent:
          $ref: '#/components/schemas/ResearchDraftExecutionIntent'
        topicHistory:
          $ref: '#/components/schemas/ResearchTopicHistorySnapshot'
        topicReselectionPolicy:
          $ref: '#/components/schemas/ResearchTopicReselectionPolicy'
        conjectureQueueSnapshot:
          $ref: '#/components/schemas/ResearchConjectureQueueSnapshot'
        preTopicRandomDoubleDraws:
          type: integer
          minimum: 0
          maximum: 1
    ResearchDraftExecutionIntent:
      type: object
      required: [kind, payload]
      properties:
        kind:
          type: string
          enum: [STANDARD_CATALOG, DEFERRED_PARAMETERIZED_STUDY, DEFERRED_FOLLOW_UP_STUDY, DEFERRED_CONJECTURE_STUDY]
        payload:
          oneOf:
            - type: object
              description: Empty object for STANDARD_CATALOG.
            - $ref: '#/components/schemas/ResearchStudySpecification'
            - $ref: '#/components/schemas/ResearchParameterOverride'
            - $ref: '#/components/schemas/ResearchConjectureSpecification'
    ResearchStudySpecification:
      type: object
      description: Frozen planning input only; it does not authorize computation or publication.
      required: [specificationVersion, studyId, description, rangeStart, rangeEnd, predicateExpression, measurement, baseline, expectedRelation]
      properties:
        specificationVersion: { type: string, minLength: 1 }
        studyId: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        rangeStart: { type: integer, format: int32 }
        rangeEnd: { type: integer, format: int32 }
        predicateExpression: { type: string, minLength: 1 }
        measurement: { type: string, minLength: 1 }
        baseline: { type: number, format: double }
        hypothesis: { type: string }
        expectedRelation: { type: string, enum: [ABOVE_BASELINE, BELOW_BASELINE, APPROXIMATELY_EQUAL] }
        comparisonTolerance: { type: number, format: double, exclusiveMinimum: 0 }
    ResearchParameterOverride:
      type: object
      description: Frozen planning input only; it does not authorize computation or publication.
      required: [overrideVersion, parameterOne, parameterTwo]
      properties:
        overrideVersion: { type: string, minLength: 1 }
        parameterOne: { type: integer, format: int32 }
        parameterTwo: { type: number, format: double }
        predictedScore: { type: number, format: double }
        priorMethodology: { type: string }
    ResearchConjectureSpecification:
      type: object
      description: Frozen planning input only; it does not authorize verification or publication.
      required: [specificationVersion, sourceId, domain, resultKind, leftExpression, rightExpression, primaryCoefficient, secondaryCoefficient, intercept, confirmationCount, maximumSlack, selectionReason]
      properties:
        specificationVersion: { type: string, minLength: 1 }
        sourceId: { type: string, minLength: 1 }
        domain: { type: string, minLength: 1 }
        resultKind: { type: string, minLength: 1 }
        leftExpression: { type: string, minLength: 1 }
        rightExpression: { type: string, minLength: 1 }
        secondRightExpression: { type: string }
        primaryCoefficient: { type: number, format: double }
        secondaryCoefficient: { type: number, format: double }
        intercept: { type: number, format: double }
        confirmationCount: { type: integer, format: int32, minimum: 0 }
        maximumSlack: { type: number, format: double }
        captureWindowStart: { type: integer, format: int64, minimum: 0 }
        selectionReason: { type: string, enum: [QUEUE_CANDIDATE, PROMOTED_ANOMALY] }
    ResearchConjectureQueueSnapshot:
      type: object
      description: |
        Bounded, immutable queue observation used only to replay and audit promoted-first,
        probability-gated selection. It does not authorize queue consumption, computation,
        verification, publication, or gameplay effects.
      required: [snapshotVersion, domain, ordinarySelectionProbability, promotedCandidates, ordinaryCandidates]
      properties:
        snapshotVersion: { type: string, minLength: 1 }
        domain: { type: string, minLength: 1 }
        ordinarySelectionProbability: { type: number, format: double, minimum: 0, maximum: 1 }
        promotedCandidates:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/ResearchConjectureSpecification'
        ordinaryCandidates:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/ResearchConjectureSpecification'
    ResearchTopicHistorySnapshot:
      type: object
      description: Frozen input for a future deterministic topic-reselection replay.
      required: [snapshotVersion, entries]
      properties:
        snapshotVersion: { type: string, minLength: 1 }
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ResearchTopicHistoryEntry'
    ResearchTopicHistoryEntry:
      type: object
      required: [domain, topic, outcome, peerScore]
      properties:
        domain: { type: string, minLength: 1 }
        topic: { type: string, minLength: 1 }
        outcome: { type: string, minLength: 1 }
        peerScore: { type: number, format: double }
    ResearchTopicReselectionPolicy:
      type: object
      description: Frozen settings for deterministic history-aware topic reselection.
      required: [policyVersion, enabled, yieldAware, maxRetries, lowYieldPeerCeiling, lowYieldNullDecay]
      properties:
        policyVersion: { type: string, minLength: 1 }
        enabled: { type: boolean }
        yieldAware: { type: boolean }
        maxRetries: { type: integer, format: int32, minimum: 0 }
        lowYieldPeerCeiling: { type: number, format: double }
        lowYieldNullDecay: { type: number, format: double, minimum: 0, maximum: 1 }
    ResearchDraftCandidate:
      type: object
      required: [subjectId, tier, selectionScore, domain, topicOptions]
      properties:
        subjectId: { type: string, format: uuid }
        tier: { type: string, enum: [PRIMARY, FALLBACK] }
        selectionScore: { type: number, format: double }
        domain: { type: string, minLength: 1 }
        topicOptions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ResearchTopicOption'
    ResearchTopicOption:
      type: object
      required: [topic, weight]
      properties:
        topic: { type: string, minLength: 1 }
        weight: { type: number, format: double, minimum: 0 }
    ResearchSubject:
      type: object
      required: [subjectId, kind, attributes]
      properties:
        subjectId: { type: string, format: uuid }
        kind: { type: string, minLength: 1 }
        attributes:
          type: object
          additionalProperties: true
    ResearchWorkReceipt:
      type: object
      required: [requestId, state, acceptedAt]
      properties:
        requestId: { type: string, format: uuid }
        state: { type: string, minLength: 1 }
        acceptedAt: { type: string, format: date-time }
    ResearchWorkStatus:
      type: object
      required: [requestId, state, attempts, acceptedAt]
      properties:
        requestId: { type: string, format: uuid }
        state: { type: string, minLength: 1 }
        attempts: { type: integer, format: int32, minimum: 0 }
        acceptedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        resultPublishedAt: { type: string, format: date-time }
        resultDeliveryClaimedAt:
          type: string
          format: date-time
          description: Read-only timestamp of an active bounded result-delivery lease, when present.
        resultDeliveryRejectedAt: { type: string, format: date-time }
        resultDeliveryRejection: { type: string }
    ResearchResult:
      type: object
      required: [resultId, requestId, workspaceId, outcome, summary, findings, completedAt]
      properties:
        resultId: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        outcome:
          type: string
          enum: [DRAFT_CANDIDATE_PLANNED, DRAFT_BRANCH_PREPARED]
        summary: { type: string, minLength: 1 }
        findings:
          type: object
          additionalProperties: true
        completedAt: { type: string, format: date-time }
    ResearchPaperSummary:
      type: object
      required: [paperId, roomId, reviewerBotIds, peerScore, tick, generation, quality]
      properties:
        paperId: { type: string }
        roomId: { type: string, format: uuid }
        authorBotId: { type: string }
        domain: { type: string }
        topic: { type: string }
        title: { type: string }
        hypothesis: { type: string }
        methodology: { type: string }
        findings: { type: string }
        conclusion: { type: string }
        reviewerBotIds:
          type: array
          items: { type: string }
        peerScore: { type: number, format: double }
        status: { type: string }
        tick: { type: integer, format: int64 }
        generation: { type: integer, format: int32 }
        quality:
          $ref: '#/components/schemas/ResearchQualitySummary'
    ResearchQualitySummary:
      type: object
      required: [grade, rubricVersion, assessorModel, assessmentRevision, unmetRequirements, contradictions]
      properties:
        grade:
          type: string
          enum: [UNASSESSED, RESEARCH_NOTE, RESEARCH_DRAFT, HUMAN_QUALITY_PAPER, BEYOND_HUMAN_BENCHMARK]
        rubricVersion: { type: string }
        assessorModel: { type: string }
        assessmentRevision: { type: integer, format: int32, minimum: 0 }
        assessedAt: { type: string, format: date-time }
        unmetRequirements:
          type: array
          items: { type: string }
        contradictions:
          type: array
          items: { type: string }
    ResearchStats:
      type: object
      required: [totalPublished, totalRejected, researcherCount, maxGeneration, avgReputation, avgPeerScore, byDomain]
      properties:
        totalPublished: { type: integer, format: int64 }
        totalRejected: { type: integer, format: int64 }
        researcherCount: { type: integer, format: int64 }
        maxGeneration: { type: integer, format: int32 }
        avgReputation: { type: number, format: double }
        avgPeerScore: { type: number, format: double }
        byDomain:
          type: object
          additionalProperties: { type: integer, format: int64 }
    ResearchGameContext:
      type: object
      required: [roomId, gameTick, capturedAt, governmentState, activeBots]
      properties:
        roomId: { type: string, format: uuid }
        gameTick: { type: integer, format: int64, minimum: 0 }
        capturedAt: { type: string, format: date-time }
        governmentState:
          type: object
          description: Opaque JSON representation of the game-owned government state.
        activeBots:
          type: array
          description: Active game-owned bots selected for the research cycle at this snapshot.
          items:
            $ref: '#/components/schemas/ResearchBotSnapshot'
        conjectureConsumptionWindow:
          $ref: '#/components/schemas/ResearchConjectureConsumptionWindow'
          description: >
            Default-off, bounded post-consumption audit evidence. It is never a live queue
            snapshot and grants no selection, routing, or mutation authority.
    ResearchBotSnapshot:
      type: object
      required: [botId, type]
      properties:
        botId: { type: string, format: uuid }
        type: { type: string }
        lifecycleJson:
          type: string
          description: Opaque bot research lifecycle payload; the game remains its source of truth during migration.
    ResearchConjectureConsumptionWindow:
      type: object
      description: >
        Bounded, contiguous observations of conjectures that the legacy game cycle has already
        marked investigated. An epoch change or a missing sequence is audit-inconclusive and must
        not be treated as a queue transition.
      required: [epoch, firstSequence, latestSequence, events]
      properties:
        epoch: { type: string, minLength: 1 }
        firstSequence: { type: integer, format: int64, minimum: 0 }
        latestSequence: { type: integer, format: int64, minimum: 0 }
        events:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/ResearchConjectureConsumptionEvent'
    ResearchConjectureConsumptionEvent:
      type: object
      required: [eventId, roomId, sequence, gameTick, authorBotId, domain, sourceId, selectionKind, observedAt]
      properties:
        eventId: { type: string, format: uuid }
        roomId: { type: string, format: uuid }
        sequence: { type: integer, format: int64, minimum: 1 }
        gameTick: { type: integer, format: int64, minimum: 0 }
        authorBotId: { type: string, minLength: 1 }
        domain: { type: string, minLength: 1 }
        sourceId: { type: string, minLength: 1 }
        selectionKind: { type: string, enum: [PROMOTED_ANOMALY, ORDINARY_QUEUE] }
        observedAt: { type: string, format: date-time }
