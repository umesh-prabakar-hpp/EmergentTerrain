spring:
  datasource:
    url: ${PG_TEST_URL:jdbc:postgresql://localhost:5432/emergentterrain_test}
    driverClassName: org.postgresql.Driver
    username: ${PG_TEST_USER:postgres}
    password: ${PG_TEST_PASSWORD:NewStrongPasswordHere}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  task:
    scheduling:
      enabled: false

app:
  qr:
    hmacSecret: test-secret
  room:
    defaultAutoCreate: false
    multipleRoomsEnabled: true
    defaultUseWhenAvailable: false
  world:
    auto: false
    width: 80
    height: 60
    flushIntervalMs: 100
    flushMinChanges: 5
    flushMaxIntervalMs: 1000
    flushOverdueLockTimeoutMs: 10
  consensus:
    neighborRadius: 24
    voteWindowSeconds: 1
    minProposalLiveSeconds: 0
    maintenanceIntervalMs: 100
    maintenanceWorkers: 4
    broadcastMinIntervalMs: 50
    minVotesToResolve: 1
    quorumCap: 1
    botRuleChecksEnabled: false
    botProposalsPerMinute: 600
    maxBotProposalsPerMaintenance: 200
    maxBotsInspectedPerMaintenance: 1000
    botApproveBias: 0.0
    approveOnTieAfterExpiry: true
    minNeighbors: 1
    noParticipationLockSeconds: 1
  density:
    areaSize: 20
    maxOccupants: 15
  bots:
    populationFraction: 0.9
    maxPerRoom: 1000
    maxTickPerMaintenance: 500
  # Integration tests share the production Groq org quota: when prod has already
  # exhausted the daily TPD, the test's GroqPool init reports primaryFullyExhausted
  # and the gate would close scheduledRoomMaintenance. Disable the gate in tests
  # so room-maintenance scheduling stays independent of the org's LLM quota state.
  tokens:
    budget:
      enabled: false
  # Tests don't use the encrypted secrets vault (no ~/.emergentterrain/secrets.enc
  # in CI). Disabling it keeps integration tests hermetic and prevents the
  # file-source first-run bootstrap (ExternalSecretsEnvironmentPostProcessor)
  # from scaffolding a template + terminating when the file is absent.
  secrets:
    enabled: false
