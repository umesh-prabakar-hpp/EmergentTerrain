# ---------------------------------------------------------------------------
# Per-model LLM price lookup — SEPARATE config, imported by application.yml via
# `spring.config.import: optional:classpath:llm-pricing.yml`. Bound to the
# LlmPricing @ConfigurationProperties component.
#
# Prices are USD per 1,000,000 tokens, split input / output. Sourced from
# https://groq.com/pricing (verified May 2026) unless noted. Update this file
# (not code) when vendor prices change.
#
# `free-models` lists model IDs billed at $0 (free tiers / dev tiers). They are
# also hard-coded in LlmPricing.HARDCODED_FREE as a safety net and for the
# simulation tests; this list adds to that set. A free model always costs $0
# regardless of any per-model entry below.
#
# Cost for one call = inTok/1e6 * inUsdPerMtok + outTok/1e6 * outUsdPerMtok.
# A model with no entry here (and not free) is counted as $0 with a WARN — add
# its real price here to make the $ budget accurate.
#
# IMPORTANT — model keys under `models:` are wrapped in [brackets]. Spring's
# relaxed Map binding otherwise splits a key on '.' (and mishandles '/'), so a
# bare key like "llama-3.3-70b-versatile" silently fails to bind into the map:
# the lookup misses, the model is priced at $0, and you get a "No price for ..."
# WARN even though the entry is right here. The [..] escape binds each key as
# one literal string. Keep any new model keys bracketed too. (`free-models` is a
# list, not a map, so its entries are NOT bracketed.)
# ---------------------------------------------------------------------------
llm-pricing:
  free-models:
    - "openai/gpt-oss-120b:free"      # OpenRouter free mirror — $0 actual spend

  providers:
    groq:
      models:
        "[llama-3.3-70b-versatile]":
          in-usd-per-mtok: 0.59
          out-usd-per-mtok: 0.79
        "[openai/gpt-oss-120b]":
          in-usd-per-mtok: 0.15
          out-usd-per-mtok: 0.60

    fast:
      models:
        "[llama-3.1-8b-instant]":
          in-usd-per-mtok: 0.05
          out-usd-per-mtok: 0.08
        "[allam-2-7b]":
          # Not on Groq's public price table (May 2026); estimated at the
          # 8b-instant rate. Replace if Groq publishes a list price.
          in-usd-per-mtok: 0.05
          out-usd-per-mtok: 0.08
        "[meta-llama/llama-4-scout-17b-16e-instruct]":
          in-usd-per-mtok: 0.11
          out-usd-per-mtok: 0.34

    openrouter:
      models:
        # 2026-05-26 — frontier paid slot (promoted above groq; replaces the
        # gpt-oss-120b:free mirror). OpenRouter passes through upstream pricing,
        # so these can drift — rates per the OpenRouter API on 2026-05-26;
        # VERIFY at https://openrouter.ai/models. Cost tracking + the $8
        # openrouter budget cap derive from these, so a stale rate skews the
        # run-budget accounting (not catastrophic, but worth keeping current).
        "[deepseek/deepseek-v4-pro]":
          in-usd-per-mtok: 0.44
          out-usd-per-mtok: 0.87
        "[x-ai/grok-4.20]":
          in-usd-per-mtok: 1.25
          out-usd-per-mtok: 2.50
        "[openai/gpt-5.4]":
          in-usd-per-mtok: 2.50
          out-usd-per-mtok: 15.00

    # Claude *subscription* provider (scripts/legacy-ai-gateway). The
    # subscription is a flat plan, not metered API — but per operator decision
    # (2026-05-25) its usage is priced at Anthropic's generally-available API
    # list rates so the run-budget tracks an API-equivalent $ cost AND enforces
    # the global ceiling against it: a subscription call draws down the same $10
    # global stop as a metered call. Same pattern for ANY subscription / fixed-
    # cost provider — list its API-equivalent prices here and it's tracked +
    # capped like a metered one. Rates: Anthropic public pricing (standard
    # ≤200K-context tier), USD per 1,000,000 tokens, verified May 2026.
    legacy-ai:
      models:
        "[claude-sonnet-4-6]":          # the model the provider is configured to use
          in-usd-per-mtok: 3.00
          out-usd-per-mtok: 15.00
        "[claude-opus-4-7]":            # priced for if it's added to the provider's models list
          in-usd-per-mtok: 15.00
          out-usd-per-mtok: 75.00
        "[claude-haiku-4-5]":
          in-usd-per-mtok: 1.00
          out-usd-per-mtok: 5.00
