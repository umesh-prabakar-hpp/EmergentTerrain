spring:
  datasource:
    url: ${PG_URL:jdbc:postgresql://localhost:5432/emergentterrain}
    driverClassName: org.postgresql.Driver
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:NewStrongPasswordHere}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  thymeleaf:
    cache: false
  task:
    scheduling:
      pool:
        size: 12
  # Phase 9 U4 — spring.ai.ollama.* removed from default config; OllamaPool reads
  # from app.ai.ollama.* now. If you have an existing override in another
  # application.yml or env layer, OllamaPool will log a deprecation WARN at
  # startup and continue using the legacy value for this release cycle.
server:
  port: 8081
app:
  e2e:
    enabled: true
  gpu:
    enabled: true 
    world:
      enabled: true 
      minCells: 20000
    bots:
      enabled: true 
      applyEdits: true 
      cacheWorld: true
      steps: 1
      diffMaxEdits: 4000
      minBotCount: 128
      minWorkItems: 256
    patch:
      minArea: 4
  qr:
    hmacSecret: "dev-secret-change"
  room:
    defaultName: "Consensus Field"
    defaultAutoCreate: true
    multipleRoomsEnabled: false
    defaultUseWhenAvailable: true
    defaultSystemEmail: "system@emergentterrain.local"
    defaultSystemPasswordHash: "system-hash"
  world:
    auto: true
    width: 40
    height: 30
    maxTiles: 120000
    cacheTtlMs: 60000
    cacheMaxEntries: 64
    aspectRatio: 1.3333
    highwayRatio: 0.02
    flushIntervalMs: 750
    flushMinChanges: 80
    flushMaxIntervalMs: 15000
    flushOverdueLockTimeoutMs: 10
  consensus:
    neighborRadius: 24
    voteWindowSeconds: 6
    minProposalLiveSeconds: 1
    maintenanceIntervalMs: 150
    maintenanceWorkers: 4
    broadcastMinIntervalMs: 40
    botVoteRetentionSeconds: 0
    minVotesToResolve: 2
    quorumCap: 4
    botRuleChecksEnabled: false
    botProposalsPerMinute: 480
    maxBotProposalsPerMaintenance: 200
    maxBotsInspectedPerMaintenance: 400
    botApproveBias: 0.35
    approveOnTieAfterExpiry: true
    minNeighbors: 1
    noParticipationLockSeconds: 300
  density:
    areaSize: 20
    maxOccupants: 15
    occupancyRefreshMs: 250
  move:
    maxSteps: 6
  bots:
    populationFraction: 0.8
    maxPerRoom: 1000
    initialRoomCreateTarget: 200
    maxTickPerMaintenance: 0
    reversePenalty: 0.6
    headingBias: 0.18
    planLength: 3
    reverseCooldownTicks: 2
  highways:
    emergent:
      enabled: true
      longTripMinDistance: 12
      travelPressure: 0.35
      explorationPressure: 0.08
      decayPerMaintenance: 0.002
      promoteThreshold: 1.0
      preserveThreshold: 0.35
      removeThreshold: 0.12
      maxCoverageRatio: 0.08
      localDensityCap: 0.4
      localDensityRadius: 3
      seedPressure: 0.65
  government:
    enabled: true
    maintenanceIntervalMs: 2500
    electionIntervalMs: 60000
    billIntervalMs: 20000
    stateCount: 4
    feedback:
      implementation:
        successTrustDelta: 0.025
        successServiceDelta: 0.03
        stallTrustDelta: -0.015
        backfireTrustDelta: -0.045
        backfireServiceDelta: -0.03
      conflict:
        activeTrustDelta: -0.02
        activeServiceDelta: -0.015
        settledTrustDelta: 0.01
      pressure:
        trustPenaltyScale: 0.025
        trustPenaltyCap: 0.08
    thresholds:
      pressure:
        high: 0.65
        agendaShock: 0.68
        executiveTrigger: 0.55
      implementation:
        succeed: 0.72
        stall: 0.46
      court:
        blockScore: 0.45
    timeline:
      enabled: true
      fullResolutionHours: 6
      minuteBucketHours: 24
      fiveMinuteBucketDays: 7
      defaultWindowMinutes: 360
      maxWindowMinutes: 21600
      compactionIntervalMs: 300000
  simulationHistory:
    root: simulation-history
  activityLog:
    intervalMs: 30000
  university:
    enabled: true
    researchIntervalMs: 15000
    researchOutputDir: research
    maxDraftBacklog: 3
    peerReviewEnabled: true
  ai:
    enabled: true
    groq:
      enabled: true
      apiKey: ${GROQ_API_KEY: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}
      parallelism: 3
      maxTokens: 2000        # reasoning models (gpt-oss-120b) burn ~400-600 tokens on chain-of-thought
                             # before user-visible content; 600 cap → 94% critique:skip from truncation
      toolMaxTokens: 1500    # token budget for professor tool-calling calls (critique + synthesis)
      primaryModelCount: 10  # effectively "all" — benchmark selects top-N 70B+ models for round-robin
      # Leave blank to auto-discover and rank all Groq models at startup.
      # Comma-separated list to pin specific models (e.g. "llama-3.3-70b-versatile,llama-3.1-70b-versatile")
      preferredModels: ""
    # Phase 7 E1 — additional free-tier provider scaffolding. Flags stay `false` until each
    # pool implementation ships; the keys are present so that flipping a flag is a one-line
    # config change. See phases-for-human-like-performance/phase-7-multi-provider-and-math-expansion.md
    # for the 2026-05-13 provider test results documenting which models work.
    openrouter:
      enabled: true
      apiKey: ${OPENROUTER_API_KEY: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}
      baseUrl: "https://openrouter.ai/api/v1"
      siteReferer: "https://github.com/umesh-prabakar-hpp/EmergentTerrain"
      siteTitle: "EmergentTerrain"
      # Only OpenInference / NVIDIA backends are reliable on free tier; Venice is rate-capped.
      excludedBackends: "Venice"
      preferredModels: "openai/gpt-oss-120b:free,nvidia/nemotron-3-super-120b-a12b:free"
    nvidia:
      enabled: true
      apiKey: ${NVIDIA_API_KEY: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}
      baseUrl: "https://integrate.api.nvidia.com/v1"
      # 5 confirmed working free 70B+ models with tools per 2026-05-13 tests.
      # Excluded paid-tier-only models: nvidia/nemotron-4-340b-instruct, nvidia/llama-3.1-nemotron-70b-instruct
      preferredModels: "meta/llama-3.3-70b-instruct,openai/gpt-oss-120b,nvidia/nemotron-3-super-120b-a12b,qwen/qwen3-next-80b-a3b-instruct,qwen/qwen3-coder-480b-a35b-instruct"
    cerebras:
      enabled: true
      apiKey: ${CEREBRAS_API_KEY:csk-denhmj335dh2ete5vdcv5n96w9p92hdpvt42f9ynw6yynkpk}
      baseUrl: "https://api.cerebras.ai/v1"
      # Single confirmed model; WSE-3 hardware delivers 14ms tool-call inference — best fit
      # for the runQualityAudit stage. Free tier is ~30 RPM per model.
      preferredModels: "qwen-3-235b-a22b-instruct-2507"
      role: "fast-audit"  # Phase 7 E1.4 — direct runQualityAudit at this pool first
    # Phase 7 E2 — opt-in list of providers allowed to receive tool-calling professor-stage
    # calls. Default "groq" matches the spec: non-Groq pool tool calls must be explicitly
    # whitelisted by the operator after the ≥3-day E1 soak demonstrates they're stable
    # (no startup errors, no quota anomalies in /tmp/et-app.log). Acceptance test: with
    # Groq manually exhausted, a paper completes prof:nvidia:ok / prof:openrouter:ok /
    # prof:cerebras:ok depending on which providers are in this list.
    # Set to "*" to allow every supportsTools pool in the primary chain (legacy behaviour).
    # To opt in after the soak: tool-calling.providers: "groq,nvidia,openrouter,cerebras"
    # Phase 9 follow-on (2026-05-14) — opened to all 4 providers. The
    # PrimaryModelRegistry walks every available 70B+ tool-capable model across
    # Groq, NVIDIA, OpenRouter, Cerebras; the professor stage no longer
    # routes "Groq first then nothing" when Groq's TPD is exhausted. The
    # soak period for non-Groq tool calls completed on 2026-05-14 with
    # Phase 9 U3b's registry-backed routing.
    tool-calling:
      providers: "groq,nvidia,openrouter,cerebras"
    # Phase 9 U5 — startup selection tests for every configured model on every
    # pool (primary + fast). Three probes per tool-capable model: chat ("reply
    # with OK"), JSON-mode ("return JSON with name=Euler, value=2.71828,
    # good=true"), tool-call (one-arg get_value(key=pi) probe). Two probes for
    # non-tool pools (Ollama). Models that fail any probe drop from activeModels
    # at startup with a WARN log line; passes log INFO with per-probe latency.
    #
    # No timeout drops per operator direction 2026-05-15 — slow models pass if
    # they eventually return a valid response. Failures look like HTTP error,
    # non-JSON response, missing fields, or wrong tool-call shape.
    selection-tests:
      enabled: true
      # Phase 9 follow-on (2026-05-14) — interval at which ModelRetestService
      # re-probes models that failed initial selection. Surfaces dropped models
      # for transient causes (NVIDIA's intermittent 503 ResourceExhausted,
      # OpenRouter backend hiccups, etc.) — a passing re-probe moves the model
      # back into activeModels and the registries pick it up immediately.
      # Floor: 10 min (re-tests burn provider quota; tighter would thrash).
      retestIntervalMinutes: 15
    # Phase 9 follow-on (2026-05-14) — single per-request HTTP read timeout
    # applied across every primary pool's chat-completions calls (Groq, NVIDIA,
    # OpenRouter, Cerebras). 7 minutes is long enough for slow reasoning models
    # generating long responses but short enough to fall through to the next
    # provider on a true hang. The 30s timeout on GroqPool's /models GET is
    # separate (small fast endpoint).
    http:
      requestTimeoutSeconds: 420
    digestCooldownMinutes: 10
    advisorCooldownSeconds: 15
    explanationCooldownMs: 2500
    hintAcceptanceRate: 0.6
    # Phase 9 U4 — Ollama config migrated to the unified app.ai.ollama.* namespace.
    # The previous app.ai.backendHosts / app.ai.backendPort / app.ai.backendParallelism
    # keys and the Spring AI auto-config keys (spring.ai.ollama.chat.*) are still
    # read as fallback for one release cycle; OllamaPool logs a deprecation WARN at
    # startup if any legacy key is present.
    #
    # preferredModels: CSV of Ollama model names. The pool creates one Backend per
    # (host, model) tuple — a single host running gemma3:4b + qwen2:7b becomes two
    # Backend instances. callSyncOnModel(modelId, ...) targets a specific model;
    # callSync(...) keeps legacy "first model wins" behaviour for back-compat.
    ollama:
      backendHosts: ${OLLAMA_HOSTS:localhost,192.168.1.145}
      backendPort: 11434
      # Max concurrent requests per backend — must match OLLAMA_NUM_PARALLEL on each Ollama instance.
      backendParallelism: 3
      preferredModels: "gemma3:4b"
      temperature: 0.7
      maxTokens: 200

  # All research flags enabled on 2026-05-13. Phases ship chronologically;
  # later phases sometimes depend on earlier ones being on (Phase 5 C2 needs
  # programs.enabled; Phase 4b auto-staking needs markets.enabled; etc.).
  research:
    # ── Phase 1 — identity + graph + programs ──
    programs:
      enabled: true        # Phase 1 Iter 4 — longitudinal research programs (also a hard dep for C2 dispute-reconciliation)
    # ── Phase 2 — surprise + planner ──
    planner:
      enabled: true        # Phase 2 Iter 5 — algorithmic experiment plans (4 strategies)
    # ── Phase 3 — world + institutions + markets ──
    institutions:
      enabled: true        # Phase 3 Iter 8 — universities / journals / funding / council bootstrap
    markets:
      enabled: true        # Phase 3 Iter 7 — reputation-staked prediction markets
    world-intervention:
      enabled: true        # Phase 3 Iter 6 write side — bots file GovernmentBills via WorldInterventionService
    # ── Phase 4 — formal findings + meta-science ──
    findings:
      enabled: true        # Phase 4 Iter 9 — FormalFinding persistence + KnowledgeBaseService
    meta:
      enabled: true        # Phase 4 Iter 10 — MetaResearchService self-observation stats
    # ── Phase 4b — meta-science evolution targets ──
    reviewer-routing:
      enabled: true        # Phase 4b — adversarial reviewer picking by topic-weight orthogonality
    funding-allocation:
      enabled: true        # Phase 4b — periodic grants from FundingAgency → University
    journal-review:
      enabled: true        # Phase 4b — reviewers drawn from journal editor pool
    impact-factor:
      enabled: true        # Phase 4b — Journal.impactFactor recomputed from citation counts
    replication-council:
      enabled: true        # Phase 4b — CONTRADICTS citations force replication; pairs naturally with Phase 5 C2
    auto-staking:
      enabled: true        # Phase 4b — same-domain bots auto-stake on open markets (needs markets.enabled)
    dominant-methodology:
      enabled: true        # Phase 4b — University.dominantMethodology emerges from member modes
      reputation-weighted: true  # Phase 4b refinement — bot reputation weights the methodology count
    surprise-broadcast:
      enabled: true        # Phase 4b — per-room cross-bot surprise fan-out (rate-limited)
    exploration-tuning:
      enabled: true        # Phase 4b — per-room z-threshold + EXPLORATION trigger auto-tune
    theory-composition:
      enabled: true        # Phase 4b — A~f(B) ^ B~g(C) chains emit derived ProgramOpenQuestions (needs findings.enabled)
    # ── Phase 5 — quality pipeline ──
    truncation-guard:
      enabled: true        # Phase 5 A1 — mid-sentence papers publish as NEEDS_REVISION
    harness-leak-filter:
      enabled: true        # Phase 5 A4 — strip simulator-coord phrases from prose
    numerical-consistency:
      enabled: true        # Phase 5 B1 — catch "close to N×" with no nearby observed; hypothesis-vs-conclusion range mismatch
      # Phase 12 D2 — promotion mode.
      #   warn      — publish as REJECTED on disk (today's behaviour, default for rollout).
      #   downgrade — publish as NULL_RESULT with an honest preamble naming
      #               the unverifiable values; same persistence path, different
      #               status + prose.
      #   suppress  — paper is dropped entirely before addPaper (no disk, no DB);
      #               operational log carries `numeric_inconsistent→suppressed`.
      mode: warn
    magnitude-range:
      enabled: true        # Phase 5 B2 — per-(domain, topic) physical bounds (composite ≤ 3 GPa, Arrhenius ≤ 12×, …)
    dedup:
      enabled: true        # Phase 5 B3 — uncited near-clones publish as NEEDS_REVISION
    cross-domain-gate:
      enabled: true        # Phase 5 B4 — MATHEMATICS bots drifting into materials prose flagged; INTERDISCIPLINARY exempt
    dispute-reconciliation:
      enabled: true        # Phase 5 C2 — DISPUTED papers queue reconciliation questions
    citation-aware-scoring:
      enabled: true        # Phase 5 C1 — +0.02 / −0.04 per high-quality / critique-skip citation
    audit-physical-mechanism-rejects:
      enabled: true        # Phase 7 G8 — SUPPORTED papers carrying audit-4b physical_mechanism gap publish as REJECTED
    # ── Phase 6 — novelty levers ──
    literature-search:
      enabled: true        # Phase 6 D1.3 — professor stage sees curated literature block
    # Phase 6 D1.4 — when the curated literature corpus has a non-sentinel reference for
    # (domain, topic), cap novelty at `score` so the saturated-topic prompt branch fires
    # and the bot frames as a replication rather than re-deriving textbook results.
    # Sentinel entries (engine-constructed bridges) skip the cap.
    literature-novelty-cap:
      enabled: true
      score: 0.4
    discussion-section:
      enabled: true        # Phase 6 D2 — first-pass narrator emits discussion + related_work sections
    # Phase 7 G9 — when two papers on the same (domain, topic) publish within this
    # window, the second one's novelty score is docked by 0.5 to discourage parallel
    # duplicate clusters (e.g. two Goldbach papers in 8 min). Set to 0 to disable.
    intra-room-novelty-window-minutes: 30
    # Phase 7 E3 — when both the tool-calling and JSON-path primary branches are
    # unavailable (e.g. every Groq+NVIDIA+OpenRouter+Cerebras pool is rate-limited),
    # route the critique+revise loop through the fast (Ollama) pool. No tool calls
    # in this fallback. Call path is stamped rev:ollama:ok on success so the publish
    # path treats the paper as fully revised (not PUBLISHED_NO_PROFESSOR).
    ollama-fallback:
      enabled: true
    # Phase 7 G6 — RLC R_c boilerplate, Thermal-Stress "yield strength" mis-label,
    # and Arrhenius scientific-notation prose all trigger NEEDS_REVISION when this
    # validator is on. Fixable in revision (not REJECTED).
    topic-specific-findings-validator:
      enabled: true
    # Phase 12 D6 — when on, conclusions that use the "no prior theoretical
    # bound" boilerplate on a topic with a known textbook closed-form publish
    # as NEEDS_REVISION. The TextbookBoundRegistry catalogs the bounded
    # (domain, topic) pairs (Stefan-Boltzmann, Beer-Lambert, Hall-Petch,
    # Mertens, Doppler, Hall, …) while explicitly excluding active conjectures
    # (Twin Prime, Goldbach, Collatz, Aliquot, Happy Number) where the
    # boilerplate is actually correct prose. Flipped ON 2026-05-17 — the
    # D-series suppression markers are visible on refresh #1 and #2; one-refresh
    # observation window is met.
    closing-prose-validator:
      enabled: true
    # Phase 13 E6 — when on, papers whose Findings cite unit-anchored numerics
    # without any uncertainty indicator (± value, "exact closed form",
    # "to within X%") publish as NEEDS_REVISION. Addresses the most-repeated
    # panel critique in REVIEW_REPORT refresh #1 (~38 mentions across ~18 of
    # 23 papers). Flipped ON 2026-05-17 — Phase 13's remaining verification
    # gate. Refresh #3 measures the panel-recommendation drop.
    uncertainty-disclosure:
      enabled: true
    # Phase 14 F5 — when on, papers reaching publishPaper with a null or
    # empty tool-call trace (i.e. no Methods section content) publish as
    # NEEDS_REVISION. Catches the refresh-#2 P-503 signature (Hypothesis →
    # Findings → Conclusion → Discussion → Related Work, no Methods + no
    # Panel). Flipped ON 2026-05-17.
    missing-methods-gate:
      enabled: true
    # Phase 14 F3 — when on, papers whose Findings prose claims a sample
    # count exceeding 2 × trace.size() (e.g. "sixteen sampled cases" backed
    # by 1 call) publish as NEEDS_REVISION. Catches refresh-#2 P-494 /
    # P-507 / P-512. Flipped ON 2026-05-17.
    single-point-sweep:
      enabled: true
    # Phase 14 F4 — when on, papers whose Conclusion polarity (within /
    # outside / confirmed / refuted) contradicts the Findings number vs
    # Hypothesis bound publish as NEEDS_REVISION. Conservative: returns
    # empty on any ambiguity. Catches refresh-#2 P-491 / P-496 / P-511.
    # Flipped ON 2026-05-17.
    direction-of-finding:
      enabled: true
    # Phase 14 F1a — when on, the structured-findings markdown renderer
    # annotates each ### Computation N header with `[call_N]` and replaces
    # blocks beyond trace.size() with `(no data — call_N missing)`. Does
    # NOT change paper status — observability only. Ship-stamp-first per
    # the phase doc: refresh #3 should see markers on the Five-Computation
    # cluster (refresh-#2 P-480 / 485 / 489 / 492 / 502 / 503) so the
    # would-be-gate rate is visible before F1b's block-count-guard flips on.
    # Flipped ON 2026-05-17; block-count-guard (F1b) stays off pending
    # one refresh of stamp-mode observation.
    block-count-stamp:
      enabled: true
    # Phase 14 F1b — when on, papers whose findingsBlocks size exceeds
    # max(1, trace.size()) publish as NEEDS_REVISION. The Five-Computation
    # stub block fabrication cluster (refresh-#2 §1 rec #1, 6 of 20 papers)
    # is the target. Flipped ON 2026-05-17 (Phase 15 Tier 2): refresh #3 of
    # research/a3289005 showed 4 of 11 papers (P-526, P-533, P-540, P-548)
    # carrying `(no data — call_N missing)` markers — within refresh #2's
    # ~6-of-20 baseline (±2), so F1a's heuristic is calibrated and the gate
    # is safe to flip. See phase-flags.md "Recently flipped
    # — Tier 2" log entry.
    block-count-guard:
      enabled: true
    # Phase 7 F2 — when on, the narrator emits one H3 prose block per computation
    # in the findings section, keyed by 1-based computation index. The per-block
    # truncation guard then fails NEEDS_REVISION if any block ends mid-sentence,
    # so a truncated block 2 doesn't poison block 1. When off, max-computations
    # is force-clamped to 1 and the entire pipeline is bit-identical to F1-baseline.
    # Flipped ON 2026-05-13 per the standing "ship default ON when feature needs
    # flag ON" directive; the spec's acceptance test ("flip on, observe the next
    # 8 papers") is what the live ON state exercises.
    structured-findings:
      enabled: true
    # Phase 11 — citations-as-schema. The student-revision prompt asks the LLM
    # to mark every numeric value with a [call_N] tool-call ID AND emit a
    # parallel numeric_claims array. CitationValidator checks both shapes
    # against the persisted tool-call trace.
    #   warn      — log + stamp citations:{ok,uncited=N:unmatched=M:out_of_tolerance=K}
    #               on call_path. Never suppresses. Default for the rollout
    #               (Phase 11 C4 / 11a). Observe 2-3 REVIEW_REPORT refreshes
    #               before flipping.
    #   downgrade — papers with mismatched/out-of-tolerance claims publish as
    #               NULL_RESULT with an honest preamble naming the unverifiable
    #               values. uncited-only papers stamp `citations:manual_review`
    #               but still publish. (Phase 11 C5a.)
    #   suppress  — papers with mismatched/out-of-tolerance claims are dropped
    #               entirely (return null, like Phase 10's all_tools_failed gate).
    #               Papers with uncited count >= 3 are also dropped. (Phase 11 C5b.)
    citations-as-schema:
      mode: warn
    # Phase 7 F2 — number of independent computation prose blocks the narrator
    # produces (NOT the number of MathPhysicsEngine compute() calls, which is
    # still driven by the refinement loop). Clamped to 1 when
    # structured-findings.enabled=false. Bumped 2 → 5 on 2026-05-13 (operator
    # direction; skips the staged 2→3→4→5 ramp described in F4).
    max-computations: 5
    # Phase 7 F7.2 — multi-reviewer panel. After the professor stage produces its
    # synthesis + tool-call trace, the panel fans the F7.1 review prompt out to
    # every configured provider in parallel. Each reviewer returns structured
    # JSON; aggregation is deterministic (median grades, intersection of
    # cited_calls, contradictions flagged by ≥2 reviewers). The aggregated
    # PanelOutcome is persisted as JSON on the ResearchPaper and rendered as a
    # "## Panel Review" section in the published markdown.
    #
    # Empty trace (JSON-path / Ollama fallback / no tool calls) short-circuits the
    # panel — papers without a trace publish bit-identically to pre-F7.2.
    #
    # Operator direction (2026-05-14): default ON across all four providers.
    #
    # Phase 9 U3a (2026-05-14): the panel picks from the PrimaryModelRegistry's
    # aggregated 70B+ model list rather than from per-provider pools. `size` caps
    # the number of reviewers per panel — with ~10 models in the registry across
    # 4 providers, 4 keeps cost bounded while giving cross-vendor representation
    # when all providers are healthy. `providers` filters the registry to the
    # opt-in providers; "*" allows every primary provider.
    review-panel:
      enabled: true
      providers: "groq,nvidia,openrouter,cerebras"
      size: 4
    # Phase 12 D4 — when on, panels that return n ∈ {2, 3} of the configured
    # size demote the paper from PUBLISHED → NEEDS_REVISION (the paper still
    # persists with its peer score / call path / panel outcome — only the
    # status changes). REVIEW_REPORT refresh #3 §1 rec #6 named four Reject
    # papers (P-417, P-419, P-428, P-431) that carried PUBLISHED despite
    # degraded panels — the gate signal was there in the LLM path but not
    # enforced. The n=1 suppression branch is unchanged (single-reviewer
    # agreement is non-informative; suppress outright).
    panel-degradation-demote:
      enabled: false
    # Phase 7 F7.3 — when on, SUPPORTED papers whose panel surfaced the
    # cherry_picked_evidence audit-gap dimension (>=2 reviewers agreed the LLM
    # omitted a relevant tool result) publish as REJECTED rather than PUBLISHED.
    # Default OFF — the dimension fires advisory-only until the false-positive
    # rate is measured over >=30 papers, mirroring how G8's physical_mechanism
    # gate soaked before going live.
    audit-cherry-picked-rejects:
      enabled: false
    # Phase 16 P6a — cross-citation verdict propagation. Default OFF runs
    # disclaimer mode: REJECTED priors appear in the priorPapers context
    # with a [REJECTED — do not propagate] tag prepended; DISPUTED priors
    # with [DISPUTED — under replication review]. The narrator LLM still
    # sees the paper but with verdict-aware context. Set true to enable
    # suppression mode — REJECTED priors are dropped from the context
    # entirely (DISPUTED still appear with the disclaimer tag). Targets
    # the P-a328-539 → P-a328-534 failure where P-539 cited P-534
    # (REJECTED) and re-fabricated the same convergence claim.
    corpus-citations:
      suppress-rejected: false
    # Phase 16 P6b — prior-result injection at formulation time. When on
    # AND exactly one PUBLISHED prior with peer score >= min-score exists
    # on the (domain, topic) pair, the formulation prompt gains a
    # "STRONG-CONFIDENCE PRIOR" hint asking the bot to replicate, refute,
    # or shift sub-question. Default OFF for rollout-discipline — flip on
    # after P6a's verdict-tag has soaked for one corpus refresh. Targets
    # the P-a328-541 (inverts P-a328-516 Reuss V_f=1) and P-a328-539
    # (re-fabricates P-a328-534 convergence) failures. min-score=0.5
    # admits the corpus baseline (P-516 at 0.535, P-552 at 0.723).
    prior-result-injection:
      enabled: false
      min-score: 0.5
    # Phase 16 P7 — topic-clone scheduler backoff. When on, after the initial
    # topic selection, ResearchCycleService counts REJECTED papers on the
    # chosen (domain, topic) over the last window-size published papers in
    # the room. Probability of keeping the topic is 0.5^rejections; on
    # resample, selectTopicIndex is invoked again with the same flags up to
    # max-retries times. Default OFF — flip on after P6's prior-injection
    # behaviour has soaked for one corpus refresh. Targets the divisor-sum-
    # average cluster (P-a328-534/539/553 all REJECTED for the same (1/N)
    # vs (1/N²) convergence-fabrication pattern; scheduler kept re-picking).
    topic-clone-backoff:
      enabled: false
      window-size: 5
      max-retries: 3
    # Phase 17 D3-ext — when on, papers whose call path contains
    # `gate:resources:professor` AND whose first-pass conclusion contains a
    # quantitative claim (any digit outside [call_N] / "Computation N" refs)
    # are suppressed pre-publish, the same way Phase 12 D3 suppresses
    # `prof:llama:zero_successes` papers. Surfaced in REVIEW_REPORT.md
    # post-hang refresh #1: 7 of 12 papers (P-559/568/570/573/575/580 +
    # P-565) carried gate-skipped-professor stamps and the narrator
    # fabricated a Conclusion anyway ("maximum buoyant force of 1480 kN",
    # "worst-case deviation 3.00% at T=4121 K"). D3's existing precondition
    # requires the professor stage to have *run*, so this new gate covers
    # the case where the resources gate killed the prof stage before any
    # tool call. Flipped ON 2026-05-17 immediately after the host-thrash
    # incident — the failure mode is named and the dominant fabrication
    # driver in the post-hang batch.
    gate-resources-quantitative-suppress:
      enabled: true
    # Phase 17 gate-retry — when on, papers whose professor stage is killed
    # by SystemResourcesGate are deferred to an in-memory retry queue
    # instead of publishing immediately as NEEDS_REVISION. The queue's
    # @Scheduled tick re-dispatches drafts when the resources gate
    # recovers, up to max-attempts. On give-up, the cached first-pass
    # is published as NEEDS_REVISION with a `gate-retry:gave-up:attempts=N`
    # stamp on the call_path — same content the pre-Phase-17 code would
    # have shipped immediately, just delayed.
    #
    # Scoped to the gate:resources:PROFESSOR site only. The revision-gate
    # site (where the professor already ran and spent tokens) keeps the
    # existing behavior: publish the professor-decorated first-pass with
    # no student revision, no retry. Re-running the full pipeline for
    # those would waste the professor's spent tokens.
    #
    # The D3-ext suppression (above) wins over retry-defer when both
    # apply: a quantitatively fabricated first-pass shouldn't be retried —
    # the same narrator on a healthy host would produce the same prose.
    #
    # Default OFF for safe rollout. Flip ON after one corpus refresh
    # confirms the deferral semantics don't deadlock the planner.
    gate-retry:
      enabled: false
      max-attempts: 3
      max-queue-size: 100
      poll-interval-ms: 30000
    # Phase 17 P2 — panel-recommendations-as-feedback. After the multi-
    # reviewer panel produces its outcome, when it includes ≥1 consensus
    # contradiction (≥2 reviewers agreed) OR ≥2 deduplicated
    # recommendations, the student model runs a focused second revision
    # with the panel's feedback in the prompt. The hypothesis is pinned;
    # findings/conclusion may be rewritten. The prompt forbids new
    # numerics not in the trace and forbids inventing new tool calls.
    # Downstream validators (numerical-consistency, magnitude-range,
    # dedup, etc.) run on the revised content as a backstop.
    #
    # Targets the P-571-class failures named in REVIEW_REPORT.md post-hang
    # refresh #1, where the panel said exactly what to fix ("Remove call_2
    # / call_3 citations — only call_1 exists", "Peak η=0.788 at r=0.40,
    # not 0.793 at 0.414") but no code path picked up the feedback.
    #
    # Cost: one extra primary-model call per paper that has a non-empty
    # actionable panel. Resources-gate-aware (skips when host is under
    # pressure). Default off; flip after one corpus refresh confirms
    # revision text quality matches the pre-revision text.
    panel-revision:
      enabled: false
    # Phase 17 panel-grade-floor — orthogonal to D4 (panel-degradation-
    # demote). D4 fires on reviewer-count (n=2 or n=3 of configured 4);
    # this gate fires on the grades themselves — even a full panel
    # (n=configured) can return rock-bottom grades with specific
    # consensus contradictions. P-a328-593 in the post-Phase-17 refresh
    # #1 is the canonical case: panel honesty=0.10, completeness=0.00,
    # rigor=0.10 + two reviewer-agreed contradictions on a 1147× unit
    # error, yet status PUBLISHED.
    #
    # The gate fires when:
    #   median(honesty, completeness, rigor) < threshold (default 0.30)
    #   AND consensus contradictions are non-empty (≥2 reviewers agreed)
    #
    # Both clauses required to avoid false-positives. Novelty is
    # excluded from the average because textbook topics legitimately
    # score novelty=0 without being poor papers (P-595 Basquin
    # honesty/completeness/rigor=1.00 with novelty=0.00 — clearly fine).
    #
    # When the gate fires, the stamp is
    # `panel:grade_floor=N.NN:demoted_to_needs_revision`, caught by the
    # same UniversityService.publishPaper clause as D4's stamp (both end
    # in `:demoted_to_needs_revision`).
    #
    # Default off; flip after one refresh confirms zero false positives.
    panel-grade-floor:
      enabled: false
      threshold: 0.30
    # Phase 7 F3 — when on, the planner / bot topic selector samples uniformly
    # over the FULL topic list per domain (current 5 + the F3.2–F3.5 additions:
    # PHYSICS 10, MATERIALS 10, MATHEMATICS 10, INTERDISCIPLINARY 8 = 38 topics)
    # rather than the bot's weighted-genome choice over the original 5. Off →
    # behaviour bit-identical to F2-baseline (same five topics per domain, same
    # weighted selection).
    # Flipped ON 2026-05-13 per the standing "ship default ON when feature needs
    # flag ON" directive; F3.1–F3.5 added 18 new closed-form topics with bounds
    # + 36 unit tests; the rollout is now active.
    topics-v2:
      enabled: true

  # SimulationGate — pauses scheduledRoomMaintenance when any provider's rolling
  # token spend crosses pauseThresholdPct of its limit, and reopens after a drop
  # below resumeThresholdPct (hysteresis). Provider keys are free-form; add any
  # future top-tier LLM (anthropic, openai, …) by appending an entry — every
  # model the provider exposes is aggregated under its key. dailyLimit /
  # minuteLimit = 0 means "unlimited" (use for local / unmetered providers).
  tokens:
    # TokenBudgetReporter prints a one-line-per-provider heartbeat every
    # reportIntervalMs: tokens used/remaining (day + minute), current burn rate,
    # pause-likelihood ETA. Cheap — only reads in-memory counters.
    reportIntervalMs: 60000
    budget:
      enabled: true
      pauseThresholdPct: 95
      resumeThresholdPct: 80
      providers:
        groq:
          # 270K = 90% of actual aggregate Groq daily cap (gpt-oss-120b 200K + llama-3.3-70b 100K = 300K).
          # An earlier 500K config never tripped the gate before Groq's own TPD did — see refresh-cycle
          # of 11 simultaneous double-Groq-blackouts in the 2026-05-13 a3289005 room corpus.
          dailyLimit: 270000
          minuteLimit: 8000    # matches observed TPM rate-limit
        # 2026-05-17 (room a3289005): nvidia/openrouter/cerebras were unconfigured here,
        # so SimulationGate.providerSpread() only saw groq. When groq hit 95%/day the gate
        # closed globally for ~3.5 h, even though NVIDIA/OpenRouter/Cerebras handles in
        # PrimaryModelRegistry had unspent capacity. Adding them below restores the
        # Phase 13 E1 min-across-metered semantics: gate closes only when EVERY metered
        # provider is over pauseThresholdPct. Tune the limits against each provider's
        # actual dashboard reading.
        nvidia:
          # NVIDIA NIM free tier: per build.nvidia.com, accounts get a one-time
          # allocation of API credits (currently advertised as ~5000 inference
          # credits for newly-verified developer accounts; some legacy accounts
          # have 1000 — STARTUP.md was written against the 1000-credit cohort).
          # Credits debit per call, not per token, and only paid-tier models like
          # nemotron-4-340b draw multiple credits per call. The token-based cap
          # below is a proxy: at ~3500 tokens per primary call (observed in
          # logs/et-app.log), 100K tokens ≈ 30 calls/day. Check live remaining
          # at build.nvidia.com → Profile → API Credits and adjust.
          dailyLimit: 100000
          minuteLimit: 20000
        openrouter:
          # OpenRouter ":free" routes: hard-capped per-account at 50 RPM and 200
          # requests/day for unverified accounts; 1000 req/day after $10 lifetime
          # spend. Beyond that, 429 from upstream. Token cap is the indirect
          # signal — at ~3500 tokens/call × 200 calls = 700K. Setting to 500K to
          # gate at ~70% of the request-rate cap, leaving headroom for retries.
          # Check live usage at openrouter.ai/activity.
          dailyLimit: 500000
          minuteLimit: 175000  # ≈50 RPM × 3500 tok/call
        cerebras:
          # Cerebras Cloud free tier: 30 RPM per model. Daily uncapped (subject
          # to monthly free-tier ceiling which Cerebras does not publish a hard
          # number for; observe at cloud.cerebras.ai usage page). Currently
          # role-tagged fast-audit only — calls are short ("OK"-style probes,
          # ~200 tokens). 30 RPM × 200 tok ≈ 6000 tok/min. Daily left at 0
          # (unmetered) — only the per-minute gate is meaningful.
          dailyLimit: 0
          minuteLimit: 6000
        ollama:
          dailyLimit: 0        # local, unmetered
          minuteLimit: 0

  # SystemResourcesGate — host-level kill-switch. Scheduled samples /proc/meminfo
  # and /proc/loadavg plus JVM heap; if any metric crosses the CRITICAL threshold
  # the gate closes and worker threads either return early or block in
  # awaitOpen(). Added after the 2026-05-16 system-wide hang to keep the app
  # from piling on more work while the kernel is thrashing.
  #
  # Memory thresholds are PERCENTAGES of total host memory by default — the
  # gate reads MemTotal at startup (re-resolved every 60s) and computes the
  # elevated/critical floors from that, so the same defaults work on a 4 GB
  # laptop and a 64 GB workstation. Set memAvailableElevatedMb /
  # memAvailableCriticalMb to a positive integer to override with absolute
  # values (useful for capping behavior in containers with cgroup limits
  # smaller than the host's MemTotal). Load and heap thresholds are already
  # per-core / heap-pct and don't need overrides.
  resources:
    enabled: true
    sampleIntervalMs: 5000
    memAvailableElevatedPct: 20   # warn when free mem < 20% of total
    memAvailableCriticalPct: 7    # pause when free mem < 7% of total
    memAvailableElevatedMb:  0    # >0 overrides the pct above
    memAvailableCriticalMb:  0    # >0 overrides the pct above
    loadPerCoreElevated:     2.0
    loadPerCoreCritical:     4.0
    heapElevatedPct:         85
    heapCriticalPct:         95

logging:
  file:
    name: logs/et-app.log
  level:
    org.springframework.boot.context.config: DEBUG
    com.emergentterrain.service.RoomService: INFO
    com.emergentterrain.service.LlmService: INFO
