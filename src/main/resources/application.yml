spring:
  datasource:
    url: jdbc:h2:mem:emergentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false
  h2:
    console:
      enabled: true
      path: /h2
server:
  port: 8080
app:
  qr:
    hmacSecret: "dev-secret-change"
  world:
    width: 40
    height: 30
