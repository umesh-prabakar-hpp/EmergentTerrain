spring:
  datasource:
    url: jdbc:h2:file:C:/dev/ide/eclipse/workspace-web/EmergentTerrain/data/emergentdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;USER=sa;PASSWORD=
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
      jakarta:
        persistence:
          jdbc:
            url: ${spring.datasource.url}
  thymeleaf:
    cache: false
  h2:
    console:
      enabled: true
      path: /h2
server:
  port: 8080
app:
  qr:
    hmacSecret: "dev-secret-change"
  world:
    auto: true
    width: 40
    height: 30
    maxTiles: 120000
    aspectRatio: 1.3333
    highwayRatio: 0.02
  consensus:
    neighborRadius: 8
    voteWindowSeconds: 60
    minProposalLiveSeconds: 3
    botVoteRetentionSeconds: 20
    minVotesToResolve: 3
    botRuleChecksEnabled: false
    minNeighbors: 3
    noParticipationLockSeconds: 300
  density:
    areaSize: 20
    maxOccupants: 8
  bots:
    populationFraction: 0.25
