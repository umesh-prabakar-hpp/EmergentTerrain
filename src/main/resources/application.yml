spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/emergentterrain
    driverClassName: org.postgresql.Driver
    username: postgres
    password: NewStrongPasswordHere
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  thymeleaf:
    cache: false
  h2:
    console:
      enabled: false
      path: /h2
  task:
    scheduling:
      pool:
        size: 2
server:
  port: 8080
app:
  qr:
    hmacSecret: "dev-secret-change"
  world:
    auto: true
    width: 40
    height: 30
    maxTiles: 120000
    aspectRatio: 1.3333
    highwayRatio: 0.02
  consensus:
    neighborRadius: 24
    voteWindowSeconds: 60
    minProposalLiveSeconds: 3
    botVoteRetentionSeconds: 0
    minVotesToResolve: 3
    botRuleChecksEnabled: false
    botProposalsPerMinute: 100
    minNeighbors: 3
    noParticipationLockSeconds: 300
  density:
    areaSize: 20
    maxOccupants: 15
  bots:
    populationFraction: 0.7
    maxPerRoom: 1000
  activityLog:
    intervalMs: 30000

logging:
  level:
    org.springframework.boot.context.config: DEBUG
    com.emergentterrain.service.RoomService: INFO
