<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
  <script type="module" src="/js/m3.js"></script>
  <script defer src="/js/diag.js"></script>
</head>
<body>
  <div class="container">
    <div class="hero">
      <div class="hero-row">
        <div>
          <div class="chip">Emergent Terrain</div>
          <h2 class="section-title md-typescale-headline-medium">Sign in</h2>
        </div>
        <md-outlined-button id="themeToggle" type="button" class="theme-toggle m3-only">
          <md-icon id="themeIcon">dark_mode</md-icon>
          <span id="themeLabel">Dark mode</span>
        </md-outlined-button>
      </div>
    </div>
    <div class="card">
      <form th:action="@{/login}" method="post" class="form-grid">
        <md-filled-text-field label="Email" type="email" name="username" required></md-filled-text-field>
        <md-filled-text-field label="Password" type="password" name="password" required></md-filled-text-field>
        <md-filled-button type="submit">Login</md-filled-button>
      </form>
      <p class="md-typescale-body-medium">No player account yet? <a th:href="@{/register}">Create it</a></p>
    </div>
  </div>
  <script defer src="/js/theme.js"></script>
</body>
</html>
