<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Register</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
  <script type="importmap">
    {
      "imports": {
        "tslib": "https://cdn.jsdelivr.net/npm/tslib@2.6.2/tslib.es6.js"
      }
    }
  </script>
  <script type="module">
    import "https://cdn.jsdelivr.net/npm/@material/web@2.4.1/all.js";
    document.documentElement.dataset.m3 = "ready";
  </script>
  <script defer src="/js/diag.js"></script>
</head>
<body>
  <div class="container">
    <div class="hero">
      <div class="hero-row">
        <div>
          <div class="chip">Emergent Terrain</div>
          <h2 class="section-title md-typescale-headline-medium">Create your account</h2>
        </div>
        <md-outlined-button id="themeToggle" type="button" class="theme-toggle m3-only">
          <md-icon id="themeIcon">dark_mode</md-icon>
          <span id="themeLabel">Dark mode</span>
        </md-outlined-button>
        <button id="themeToggleFallback" type="button" class="theme-toggle fallback-button fallback-only">Dark mode</button>
      </div>
    </div>
    <div class="card">
      <form th:action="@{/register}" method="post" class="form-grid">
        <div class="m3-only">
          <md-filled-text-field label="Email" type="email" name="email" required
            th:attr="value=${form.email}"></md-filled-text-field>
        </div>
        <input class="fallback-input fallback-only" type="email" name="email" placeholder="Email" required />
        <div class="m3-only">
          <md-filled-text-field label="Password" type="password" name="password" required></md-filled-text-field>
        </div>
        <input class="fallback-input fallback-only" type="password" name="password" placeholder="Password" required />
        <div class="m3-only">
          <md-filled-button type="submit">Create Account</md-filled-button>
        </div>
        <button class="fallback-button fallback-only" type="submit">Create Account</button>
      </form>
      <p class="error" th:text="${error}"></p>
      <p class="md-typescale-body-medium">Already have an account? <a th:href="@{/login}">Login</a></p>
    </div>
  </div>
  <script defer src="/js/theme.js"></script>
</body>
</html>
