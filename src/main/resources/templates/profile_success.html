<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Profile Created</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
  <script type="importmap">
    {
      "imports": {
        "tslib": "https://cdn.jsdelivr.net/npm/tslib@2.6.2/tslib.es6.js"
      }
    }
  </script>
  <script type="module">
    import "https://cdn.jsdelivr.net/npm/@material/web@2.4.1/all.js";
    document.documentElement.dataset.m3 = "ready";
  </script>
  <script defer src="/js/diag.js"></script>
</head>
<body>
  <div class="container">
    <div class="hero">
      <div class="hero-row">
        <div>
          <div class="chip">QR Ready</div>
          <h2 class="section-title md-typescale-headline-medium">Your terrain key is ready</h2>
        </div>
        <md-outlined-button id="themeToggle" type="button" class="theme-toggle m3-only">
          <md-icon id="themeIcon">dark_mode</md-icon>
          <span id="themeLabel">Dark mode</span>
        </md-outlined-button>
        <button id="themeToggleFallback" type="button" class="theme-toggle fallback-button fallback-only">Dark mode</button>
      </div>
    </div>
    <div class="card">
      <p class="md-typescale-body-medium">Your QR code encodes your profile and hidden properties.</p>
      <div class="qr">
        <a th:href="@{/game(token=${token})}">
          <img th:src="@{/qr(token=${token})}" alt="QR Code" />
        </a>
      </div>
      <p class="md-typescale-body-medium">Click the QR code to open the game.</p>
      <div class="m3-only">
        <md-filled-tonal-button th:href="@{/game(token=${token})}">Open Game</md-filled-tonal-button>
      </div>
      <a class="fallback-button fallback-only" th:href="@{/game(token=${token})}">Open Game</a>
    </div>
  </div>
  <script defer src="/js/theme.js"></script>
</body>
</html>
