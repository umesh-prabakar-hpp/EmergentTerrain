<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Emergent Terrain</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <link rel="stylesheet" th:href="@{/css/app.css}" />
  <script type="importmap">
    {
      "imports": {
        "tslib": "https://cdn.jsdelivr.net/npm/tslib@2.6.2/tslib.es6.js"
      }
    }
  </script>
  <script type="module">
    import "https://cdn.jsdelivr.net/npm/@material/web@2.4.1/all.js";
    document.documentElement.dataset.m3 = "ready";
  </script>
  <script defer src="/js/diag.js"></script>
</head>
<body>
  <div class="container wide">
    <div class="hero">
      <div class="hero-row">
        <div>
          <div class="chip">Live Terrain</div>
          <h2 class="section-title md-typescale-headline-medium">Emergent Terrain Lab</h2>
        </div>
        <md-outlined-button id="themeToggle" type="button" class="theme-toggle m3-only">
          <md-icon id="themeIcon">dark_mode</md-icon>
          <span id="themeLabel">Dark mode</span>
        </md-outlined-button>
        <button id="themeToggleFallback" type="button" class="theme-toggle fallback-button fallback-only">Dark mode</button>
      </div>
    </div>
    <div class="card">
      <div class="game-layout">
        <div class="game-panel">
          <canvas id="world" width="640" height="480"></canvas>
          <div class="tools">
            <div class="m3-only">
              <md-filled-tonal-button data-tool="forest">Paint Forest</md-filled-tonal-button>
              <md-filled-tonal-button data-tool="clear">Paint Clear</md-filled-tonal-button>
              <md-filled-button id="applyChanges">Apply Changes</md-filled-button>
            </div>
            <div class="fallback-only">
              <button class="fallback-button" data-tool="forest">Paint Forest</button>
              <button class="fallback-button" data-tool="clear">Paint Clear</button>
              <button class="fallback-button" id="applyChanges">Apply Changes</button>
            </div>
          </div>
        </div>
        <div class="info-panel">
          <div class="chip">Pattern Insights</div>
          <h3 class="section-title md-typescale-title-large">Explanation</h3>
          <div id="explanation" class="md-typescale-body-medium">Make changes to see explanations.</div>
          <div class="tools">
            <div class="m3-only">
              <md-filled-button id="confirmYes">Yes, this reflects me</md-filled-button>
              <md-outlined-button id="confirmNo">No, adjust</md-outlined-button>
            </div>
            <div class="fallback-only">
              <button class="fallback-button" id="confirmYes">Yes, this reflects me</button>
              <button class="fallback-button" id="confirmNo">No, adjust</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.APP_TOKEN = "[[${token}]]";
  </script>
  <script src="/js/game.js"></script>
  <script defer src="/js/theme.js"></script>
</body>
</html>
