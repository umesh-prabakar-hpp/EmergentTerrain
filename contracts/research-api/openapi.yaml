openapi: 3.1.0
info:
  title: EmergentTerrain Research API
  version: 1.0.0
  description: |
    Versioned game-to-research read contract. The game service retains the legacy
    /room/{roomId}/research paths while research is co-located; separate deployments
    use these /api/v1 paths exclusively.
paths:
  /api/v1/research/rooms/{roomId}/papers:
    get:
      operationId: listPublishedPapers
      parameters:
        - $ref: '#/components/parameters/roomId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: Most recently published papers first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResearchPaperSummary'
  /api/v1/research/rooms/{roomId}/stats:
    get:
      operationId: getResearchStats
      parameters:
        - $ref: '#/components/parameters/roomId'
      responses:
        '200':
          description: Aggregated research state for a room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchStats'
  /api/v1/game/rooms/{roomId}/research-context:
    get:
      operationId: getResearchGameContext
      security:
        - researchContextKey: []
      description: |
        Game-owned, read-only context for an autonomous research worker. The response is a
        snapshot; it never grants the research service authority to mutate game state.
      parameters:
        - $ref: '#/components/parameters/roomId'
      responses:
        '200':
          description: Most recent persisted government context for the room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchGameContext'
        '404':
          description: Room does not exist.
  /api/v1/research/work:
    post:
      operationId: submitResearchWork
      description: |
        Accepts a game-agnostic immutable work request into the research-owned durable queue.
        Replaying the same requestId is idempotent and returns the original receipt state.
      security:
        - researchWorkKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResearchWorkRequest'
      responses:
        '202':
          description: Work was durably accepted or an idempotent replay was acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchWorkReceipt'
        '401':
          description: Missing or invalid research-work credential.
  /api/v1/game/research-results:
    post:
      operationId: projectResearchResult
      description: |
        Accepts a research result for the game's idempotent display-only projection. This endpoint
        cannot apply gameplay effects or recommendations.
      security:
        - researchResultKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResearchResult'
      responses:
        '202':
          description: Result was accepted for idempotent display projection.
        '401':
          description: Missing or invalid research-result credential.
components:
  securitySchemes:
    researchContextKey:
      type: apiKey
      in: header
      name: X-Research-Service-Key
    researchWorkKey:
      type: apiKey
      in: header
      name: X-Research-Work-Key
    researchResultKey:
      type: apiKey
      in: header
      name: X-Research-Result-Key
  parameters:
    roomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ResearchWorkRequest:
      type: object
      required: [requestId, workspaceId, workType, sourceRevision, requestedAt, subjects, contextSnapshot]
      properties:
        requestId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        workType: { type: string, minLength: 1 }
        sourceRevision: { type: integer, format: int64, minimum: 0 }
        requestedAt: { type: string, format: date-time }
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/ResearchSubject'
        contextSnapshot:
          type: object
          properties:
            draftSelection:
              $ref: '#/components/schemas/ResearchDraftSelectionInput'
          additionalProperties: true
    ResearchDraftSelectionInput:
      type: object
      required: [selectorVersion, selectionSeed, topicSelectionMode, candidates]
      properties:
        selectorVersion: { type: string, minLength: 1 }
        selectionSeed: { type: integer, format: int64 }
        topicSelectionMode: { type: string, enum: [WEIGHTED, UNIFORM] }
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ResearchDraftCandidate'
    ResearchDraftCandidate:
      type: object
      required: [subjectId, tier, selectionScore, domain, topicOptions]
      properties:
        subjectId: { type: string, format: uuid }
        tier: { type: string, enum: [PRIMARY, FALLBACK] }
        selectionScore: { type: number, format: double }
        domain: { type: string, minLength: 1 }
        topicOptions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ResearchTopicOption'
    ResearchTopicOption:
      type: object
      required: [topic, weight]
      properties:
        topic: { type: string, minLength: 1 }
        weight: { type: number, format: double, minimum: 0 }
    ResearchSubject:
      type: object
      required: [subjectId, kind, attributes]
      properties:
        subjectId: { type: string, format: uuid }
        kind: { type: string, minLength: 1 }
        attributes:
          type: object
          additionalProperties: true
    ResearchWorkReceipt:
      type: object
      required: [requestId, state, acceptedAt]
      properties:
        requestId: { type: string, format: uuid }
        state: { type: string, minLength: 1 }
        acceptedAt: { type: string, format: date-time }
    ResearchResult:
      type: object
      required: [resultId, requestId, workspaceId, outcome, summary, findings, completedAt]
      properties:
        resultId: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        outcome: { type: string, minLength: 1 }
        summary: { type: string, minLength: 1 }
        findings:
          type: object
          additionalProperties: true
        completedAt: { type: string, format: date-time }
    ResearchPaperSummary:
      type: object
      required: [paperId, roomId, reviewerBotIds, peerScore, tick, generation]
      properties:
        paperId: { type: string }
        roomId: { type: string, format: uuid }
        authorBotId: { type: string }
        domain: { type: string }
        topic: { type: string }
        title: { type: string }
        hypothesis: { type: string }
        methodology: { type: string }
        findings: { type: string }
        conclusion: { type: string }
        reviewerBotIds:
          type: array
          items: { type: string }
        peerScore: { type: number, format: double }
        status: { type: string }
        tick: { type: integer, format: int64 }
        generation: { type: integer, format: int32 }
    ResearchStats:
      type: object
      required: [totalPublished, totalRejected, researcherCount, maxGeneration, avgReputation, avgPeerScore, byDomain]
      properties:
        totalPublished: { type: integer, format: int64 }
        totalRejected: { type: integer, format: int64 }
        researcherCount: { type: integer, format: int64 }
        maxGeneration: { type: integer, format: int32 }
        avgReputation: { type: number, format: double }
        avgPeerScore: { type: number, format: double }
        byDomain:
          type: object
          additionalProperties: { type: integer, format: int64 }
    ResearchGameContext:
      type: object
      required: [roomId, gameTick, capturedAt, governmentState, activeBots]
      properties:
        roomId: { type: string, format: uuid }
        gameTick: { type: integer, format: int64, minimum: 0 }
        capturedAt: { type: string, format: date-time }
        governmentState:
          type: object
          description: Opaque JSON representation of the game-owned government state.
        activeBots:
          type: array
          description: Active game-owned bots selected for the research cycle at this snapshot.
          items:
            $ref: '#/components/schemas/ResearchBotSnapshot'
    ResearchBotSnapshot:
      type: object
      required: [botId, type]
      properties:
        botId: { type: string, format: uuid }
        type: { type: string }
        lifecycleJson:
          type: string
          description: Opaque bot research lifecycle payload; the game remains its source of truth during migration.
